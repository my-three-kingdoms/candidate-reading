8游戏的片头曲","children":[]},{"text":"生命之杯和wakawaka毫无疑问\n意大利之夏作为足球歌曲个人并不喜欢\n\n02年的纯音乐主题曲我也挺喜欢的","children":[]},{"text":"意大利之夏和14年的好听，至今还在循环播放","children":[]},{"text":"没有02年那个纯音乐的《圣歌》吗？","children":[]},{"text":"马丁:你们一起上，我赶时间","children":[]},{"text":"生命之杯和wakawaka这两个肯定没跑了 这两首歌破圈效应太强了","children":[]},{"text":"反正我选意大利之夏……","children":[]},{"text":"意大利之夏，我不懂意大利语都会唱了……","children":[]},{"text":"真正的足球圣曲是这首\nThe Fans的单曲《Ole Ole Ole》","children":[]},{"text":"最牛的还是意大利之夏","children":[]},{"text":"只投两个我还就会选南非的两首 都特别好","children":[]},{"text":"官方主题曲最喜欢南非世界杯的waka waka和卡塔尔世界杯的dreamers\n\n法国世界杯的la copa de la vida其次\n\n非官方歌曲里最喜欢的是FIFA98的song 2和法国队应援曲magic in the air","children":[]},{"text":"我选意大利之夏跟生命之杯","children":[]},{"text":"我是从La Copa de la Vida(生命之杯)开始对西班牙语感兴趣的","children":[]},{"text":"韩日世界杯的ANTHEM貌似是最容易被忽略的一首。","children":[]},{"text":"个人喜欢南非那届，然后是美国那个gogogo","children":[]},{"text":"世界杯相关音乐我更喜欢14年为支持法国而做的magic in the air","children":[]},{"text":"前三基本就是生命之杯 wakawka和意大利之夏，跑不了的\n另外86年的hero，女声柔和优美，和足球有点不搭，但简直就是为马拉多纳量身定做，看马拉多纳的视频时候配这么一首，效果也是极佳","children":[]}]},{"title":"红楼梦galgame你会选谁？","body":"如果《红楼梦》做成galgame，你是宝玉，可以自由选一条人物线打结局，你会选谁？可选：宝钗、黛玉、元春、探春、迎春、惜春、妙玉、凤姐、李纨、秦可卿、湘云、袭人、香菱、晴雯、麝月、宝琴、秦钟、茗烟、尤三姐、王夫人、赵姨娘、夏金桂、平儿、蒋玉菡、北静王、鸳鸯。","replies":[{"text":"不过说起来，晴雯和袭人这样忠心且品格高尚的仆人可能比大小姐更得我心吧","children":[]},{"text":"我是俗人，我就是意难平宝黛\n木石前盟，我的木石前盟","children":[]},{"text":"以前可能会选黛玉吧，又美丽又善良，非常符合传统古典审美的女孩子，而且还是女主角，着笔多戏份足。\n\n现在的我，肯定是选择我的好哥们史湘云啦！\n\n好想和她一起踏雪寻梅，割鹿肉温美酒，聊聊诗词看看黄书。\n\n和湘云在一起不需要拘束，非常契合现代人的择偶观念，毕竟谁不想要一个和你一起打游戏看动画，才华横溢且娇憨动人的女朋友呢？","children":[{"role":"回应者","text":"假小子圣经！"}]},{"text":"元春牛头人线怎么想都很刺激吧快进到苦主反杀满门抄斩","children":[{"role":"回应者","text":"元春可不只是ntr线，按宝玉回忆，小时候的他基本都是元春带大的，对他来讲是半个母亲。"},{"role":"作者","text":"那能不能期待一下考中之后在庙堂之上怒斥皇帝“元春可是能成为我母亲的女人，害死她的你有什么资格说话”"}]},{"text":"晴雯单推人，傲娇永不退环境","children":[{"role":"回应者","text":"傲娇只有死路一条(字面意义)"}]},{"text":"有王夫人那我肯定选王夫人啊","children":[]},{"text":"这肯定选鲸卿啊","children":[]},{"text":"晴雯傲娇系。\n湘云好姊妹。\n元春麻麻。\n\n其实当年国产有过GAL化的，一代的湘云线还可以。","children":[]},{"text":"你既然做gal，我找当你是18x好了，那我选凤姐和秦可卿","children":[]},{"text":"我是俗人，我喜欢宝黛，我甚至怀疑宝黛是不是我be爱好的起源\n袭人晴雯选了很久，决定袭人了，袭人她值得\n湘云太哥们了，而且人原本姻缘应该挺好的，除了男的估计短命","children":[]},{"text":"都特么galgame了就不能来个大团结？","children":[]},{"text":"晴雯天下第一，一起疯一起乐的生意気女仆可太行了\n袭人是天！！！","children":[]},{"text":"李纨和凤姐，嘿嘿嘿","children":[{"role":"回应者","text":"曹丞相是吧"}]},{"text":"玩就玩刺激的，王夫人和王熙凤","children":[]},{"text":"其实傍上北静王不是不可能让他抬一手","children":[]},{"text":"单投秦可卿了 最喜欢她 风流","children":[{"role":"回应者","text":"你也喜欢扒灰养小叔子是吧"}]},{"text":"来个IF线：山贼王妙玉","children":[]},{"text":"灵魂之友+前世因缘+BE结局，说实话我很难控制自己不选黛玉。真做成gal game那黛玉绝对是那种一周目锁BE，然后二周目开真结局的真·女主定位\n晴雯和袭人票数还挺相近的，这俩原作就有点角色照应的意思，而且都塑造的很生动形象。\n我永远喜欢史湘云.jpg","children":[]},{"text":"我要先努力科举，整个大官，回来把我喜欢的人都保住","children":[{"role":"回应者","text":"轻小说标题我都帮你想好了\n关于我转生成为galgame男主却化身卷王这件事"}]},{"text":"不是\n秦钟茗烟蒋玉涵北静王都有\n为啥没薛蟠？\n我呆霸王不算青梅了？\n还能玩个一雌复一雄，双飞入紫宫","children":[{"role":"回应者","text":"不是 那四个都是0啊 画师习惯作画了\n呆霸王的h情节太难画了"}]},{"text":"对不起，看见北静王的那一刻我就已经没有别的选择了\n基友(男二)线也属于不可不品的一环","children":[]},{"text":"呜呜呜我的晴雯","children":[]},{"text":"为什么没人喜欢妙玉呜呜呜呜","children":[{"role":"回应者","text":"我看你也不是真喜欢，只是好玷污尼姑这口吧"},{"role":"作者","text":"这话说得只是不想她被其他人玷污罢了"}]},{"text":"明明我记得书里应该是黛钗拉扯仔细想想还真是后宫\n\n投了黛玉袭人灵魂伴侣前世今生和贴身大丫鬟永远的撒娇对象","children":[]},{"text":"还得是黛玉。\n因为我不是宝玉宝玉明显和黛玉共同语言多谈得来，我能选分分钟给他塞黛玉线里去。","children":[]},{"text":"那必然是袭人呐","children":[]},{"text":"没有甄宝玉吗，世另我组合。个人喜欢木石前盟和惺惺相惜的蒋玉菡。还有帅哥柳湘莲也加上吧","children":[]},{"text":"没看过\n哪个奈子大选哪个","children":[]},{"text":"所以元春是啥情况？8要命啦？\n这大概是要切换成地图填色游戏后统一全国后才能开放的的超高难隐藏路线吧","children":[{"role":"回应者","text":"还要在攻陷皇宫之前，元春没有被皇上发泄吊死才有"}]},{"text":"那肯定赵姨娘啊，赵姨娘生的是很美的，不然也生不出探春来\n赵姨娘性格泼辣恶毒也没文化，反而显得异常的有生命力\n最好还能让赵姨娘怀上宝玉的孩子，宝玉还是“天真世界一片懵懂”的年纪浑然不觉和自己有什么关系，贾政以为是自己的自然高兴，王夫人生怕生出个比贾环出息的儿子日夜担忧，只有这个庸俗泼辣甚至恶毒的小妇人赵姨娘本身是惶恐的，再也不能安睡，多么刺激","children":[{"role":"回应者","text":"这几页你最逆天"}]},{"text":"薛宝钗和袭人，她们俩双剑合璧就是全方位无死角的母爱型伴侣，不考虑大环境，宝玉这辈子都在温柔乡里出不来了\n\n反而宝玉的亲妈王夫人，着实是有些差劲","children":[{"role":"回应者","text":"袭人还好点，宝钗连唠叨都是亲妈型的好吧，以宝玉的脾气怕不是烦死了"}]},{"text":"黛钗太普通了，第一反应是湘云，第二反应是秦可卿\n忽然对元春充满了期待","children":[]},{"text":"能来个 一女五男，一起得了STD","children":[]},{"text":"之前学校里有一个伟人，大晚上在和女朋友在外面遇到几个人，抢完钱还想干他女朋友，在他反抗加，哀求下，放他女朋友走了，把他干了，休学了好几个月","children":[{"role":"回应者","text":"这是真男人 挺佩服的"}]},{"text":"肯定有人听过 澳洲 男被土著强暴 拿pr息事宁人了","children":[]},{"text":"谁和谁谈恋爱了这不叫瓜，朋友回国，喊人帮他喂猫，某天一进门发现警察把他家抄了这才叫瓜。真事，倒卖特斯拉。","children":[]},{"text":"我留学时候室友经常在隔壁炒币，炒完币出来我们一起抽烟他跟我复盘一下。过段时间他发现女人在同一层楼跟另一个男人炒币，边炒币边跟他打电话，他还上门讨说法把那男人家给砸了，女人后来不知道去哪了。","children":[]},{"text":"说这我就不困了，我在英国的时候学校有一座保研桥，其名字由来就是有个中国男生在桥上被黑哥哥嘿嘿了，后来学校为了平息事态，给他保研了…\n还有一个兄弟当时天天和当地人一起在酒吧厮混，后来沾染上了大m，刚开始啥事儿没有还和我们说这东西比吸烟危害小，后来剂量越来越大，就开始出现幻觉，不出门也不去上课，把自己关在屋里天天说有人要杀他，最后他爸从国内跑过来给他强行带回国戒毒了…","children":[{"role":"回应者","text":"兄弟不会是英国哈德吧，我们那也有"},{"role":"作者","text":"就是哈德，但我咋听说是个男生被保研了啊"}]},{"text":"我在华威上学时听过的特搞笑的一个事，说一个学长把校园里一只天鹅给抓了做菜，然后被遣送回国了。理由是杀死了女王的动物","children":[]},{"text":"自爆一个大瓜好了，跟一个美国白女恋爱了两年，回国期间被申请限制令+偷偷转移全部财产了导致签证也过不了，本来已经准备订婚拿绿卡了。不过这是喜事","children":[{"role":"回应者","text":"损失了多少"},{"role":"作者","text":"学业和工作这些东西没法估值，光说车和财产啥的两三百多万吧。。"}]},{"text":"在澳洲读书的时候。香港仔不和我们玩。一直喊我们大陆狗。回国之前和朋友花了2.8w澳元叫越南仔暴揍他们一顿 真爽","children":[]},{"text":"以前认识老鸨，看到她下面基本都是留学生。有的抱着男朋友还能在街上遇到上午刚服务过的。但干得多的赚的是蛮多的。有的真的拿了钱回国换身份生活的很光鲜，当霸总上恋综啥的","children":[]},{"text":"我以前一个朋友说当年在日不落留学，和几个朋友一起种大拿，收获的时候有人持枪来抢","children":[]},{"text":"那地方鸽子多且胆子大，经常飞入寻常百姓家。有大我们几届的一群学生有次在某家聚会，后院飞进来两只鸽子，他们就加了个餐把鸽子逮了吃了。后来倒垃圾的时候被人发现了零散的骨头事发，最后全部被遣返。","children":[]},{"text":"毕业典礼时， 我们那届的学生会长在厕所干了行政老师","children":[]},{"text":"刚到国际学生宿舍时， 有个姐妹加拿来的， 有一个印度裔男友（皮肤偏白的）那种。聊了两次天后来说喜欢我， 没从。 后来知道她在学生宿舍和好几个男的发生关系（而且她男友就在楼上房间里。  她和男朋友在宿舍里（6人间）做的时候， 别人等他们做完再进去。 后来那姐妹回国了 生了孩子，孩子白白胖胖的。 也不知道哪个老哥有这个福气","children":[]},{"text":"隔壁学校两男一女普通情感纠纷，其中一男先得到后被踹失败气不过，在家写十万字小h文，配不露脸图，同时发在留park某榴某色上，生情并茂，文笔生动，本市留学生纷纷拜读传阅，我隔壁室友跟女主当过同学，拿着该文当夜间干粮。前段时间我还想起来准备去找找，奈何已经快20年实在找不到了。","children":[]},{"text":"有个和我同校的中国女同学，来之前新生群认识的 买的同一趟航班，她直接告诉我她带了很多tao和玩具啥的就想着来体验风土人情了…\n姐们人落地以后光是我知道的pao友就有三个，甚至有两个还是同一寝室的（我们那里寝室是公寓户型，三四个屋子共用客厅和厨房） 姐们室友和我说她要不就是早上才回来，要不就是根本不回来。之前姐们把男的往宿舍里带结果晚上吵着她室友都睡不着哈哈哈所以就给她ban了","children":[]},{"text":"在巴黎郊区管理（其实就是温州老板用包住宿抵工资再加白嫖我帮他看着）一家难民酒店，一个中北美老哥在窗外种大麻，我在收租的路上警察打我电话让我去警局了解情况……","children":[]},{"text":"两个女留子都在一个类事约炮群的群里，群里都是女的，分享炮友和心得。然后有时候会吐槽自己男友，然后某天吐槽多了，其中两个女的觉得不太对劲，一聊，发现是同一个男友，被脚踩两只船，然后俩人破口大骂对方是小三，垃圾，不检点。。真特么讽刺，","children":[]},{"text":"上同一节数学课的男生，有一晚在学校旁边chase的atm取钱，被个老黑劫财又劫色，最后据说给了身份","children":[]},{"text":"就同系的一对男女朋友，半夜去医院了，男的那个卡在女的宫颈里面了，去医院打镇定剂才分开了","children":[]},{"text":"说一个我当时在泰学校学长的，学长毕业回国，带了很多佛牌，在机场连人带货过检查被逮了，佛牌里藏了不少毒，据说现在还被关在我们学校附近的监狱","children":[]},{"text":"我大学同学，四川人，在市中心的公园被毛利人鸡奸，国家给补偿还给发绿卡了，时间2010，新西兰，这事很有名","children":[]},{"text":"大一刚去的时候有个同学在LA上演真人GTA 超速后面拉了一大串警车直升机也出来了 后来保释出来后开庭哥们没去 直接变悬赏又给抓了\n大四的时候有个打球的兄弟做车行的 卷进了LA华人绑架案 被绑的意外嘎了 这兄弟后来回国被抓了之后再也没听到后续 当时知道挺吃惊的因为这兄弟人不错 对我们还挺好的\n还有个大一新生 哄骗女生到家里然后qj拍照威胁恐吓 最后搞了太多人被直接联合报警抓了 出来之后跑去英国读书回国还抖音当了网红 叫亚人还是啥的…被大家扒出来后注销账号了","children":[]},{"text":"1 学校开学华人学生会聚会上主持的清纯学姐，回我租房后我房东(也是本校毕业的老学长)告诉我，这个学妹(他毕业十几年了看谁都是学弟学妹)当年非常有名的一战是她和当时两个男性同学去酒吧喝烂醉……你们以为是3P？ nonono，第二天两个男同学在酒吧后门垃圾桶旁醒来，身上现金全没了，有个的名贵外套没了，这个学姐失踪到第二天晚上这边都要报警了她才回学校生活区，据另外一波人说当时在酒吧几个老外就给她扒了然后被保安请出去了……他们以为都认识的只是玩得比较开就没管。\n2 一非正式学生的哥们进新生群把所有性别为女的群友加了个遍，一个一个骚扰。并且后面当着已毕业结婚的学长面吃醋此学长的老婆(学长学姐夫妇都已工作，回来搞搞活动免费开车带大家爬山，本来男女群体各一车，此男非要坐学姐副驾)\n3 股神学长群里分享自己炒股超神战绩，然后群里集资近千万梭哈崩盘，其中一个非富二代学姐梭哈了200万自己的学费生活费直接崩溃，最奇葩点在于，他并不是骗钱，是真觉得自己能炒股赚钱。\n4 神人同学伪装学弟，与室友吵架刀了室友，逃出门逃亡两天太累了遂在酒店开房休息被警察直接抓获。\n5 附近学校四个富二代两两一组抢车位，东北富二代团体开车把另一边已下车的其中一人嵌进了商店。","children":[]},{"text":"悉尼这边，一群国际生小孩，好像有个网红叫什么提莫西的，一群男女在他家开银趴，有一次一个女的直接和一个男的在一群人中间客厅左艾，一群人在那拍视频，那女的还很漂亮，是个小网红，有上万粉丝，忘了抖音名了","children":[]},{"text":"我同学因为帮mr夯卖片，即将毕业入职亚马逊前，回国探亲喜提14年牢饭。","children":[]},{"text":"一个裸官的儿子开着他的豪车车带我和两个妹子在土澳海边兜风，看到一个出售的独栋，妹子说这栋房子挺好看的，然后他当场就全款把这栋房子买了。","children":[]},{"text":"我发小雪城大学的，他说有个留子在厕所被黑哥拿枪指着头口","children":[]},{"text":"我们伯明翰的瓜 一个女的被sugar daddy包了 然后开价1秒50磅","children":[]},{"text":"有个读博士大哥，官二代，已婚，老婆还来陪读过一段时间.做事很有分寸一个人，虽然也很好色.学的热核工程一类的，不到半年因为压抑和台湾女不清不楚在一次酒后之后，据传是告性骚扰，被整上法庭.后来莫名其妙被一波带走，据说是主动退学了，越想越像CIA和湾湾那边联手干的，为社么？因为这个事之前一个月，大哥和我说导师带他去看了地下核工程设施了.而且我们那一批人，不少人来回中美往返都或多或少因为读了理工被卡签证机场滞留过.后来想想，他主动退了感觉像是不想配合那边，知难而退，明哲保身了.","children":[]},{"text":"鸽子停在阳台，某男抓了鸽子烤了吃了，分给同宿舍外国舍友，舍友遂举报，开除学籍回国了","children":[]},{"text":"在悉尼留学的时候，在一家公司打工，公司俩老板，是女同，一个55年的，一个75年的，55年的是马来西亚的，75年的是印尼的，后来那个75年的把55年的甩了，找了个更年轻的女的，公司好像是她俩共同创办的，她俩就打官司争公司归属，我是那个55年的招的，经常守着我哭…","children":[]},{"text":"过去日本留学的兄弟 隔壁租房的韩国小姐姐没带钥匙为了装自告奋勇要从自己家阳台（没错就是你们动画里看的公寓那种并排的阳台）跳过去隔壁拿钥匙给小姐姐开门 结果一个马有失蹄从五楼掉到三楼还是从四楼掉到二楼的租房情侣的阳台 摔坏了自己身子不说还落了个非法侵入的罪名","children":[]},{"text":"吃到过我自己的瓜，女方没指名道姓，但是以改编得面目全非的故事，传到了我耳朵里。我听得津津乐道，然后稍微对了下打球的时间地点，故事中这位射手不是我自己吗","children":[]},{"text":"有一个同学，高中看着很老实，也是从农村一步步考出来的，在国内读的博士。读博期间在帝国理工交流，劈腿了一位女生，当时国内的女友已经谈了七八年了，据说是嫌国内女友不漂亮、家庭条件一般。\n后面在帝国理工做博士后期间，过年回家家里介绍了女友，也谈了也睡了，据说是临走前让女生等他回国，结果转头就在飞机上认识了一位女生，现在和飞机上女生谈了，准备谈婚论嫁了。","children":[{"role":"作者","text":"女生刚从ucl毕业，现在俩人经常抖音秀恩爱，我们都好奇男生咋好意思的"}]},{"text":"早年留子来告诉你点瓜\n其实我觉得那种什么谁和谁在一起，谁和谁开in趴都是逻辑上没啥奇怪的，也谈不上炸裂。\n说两个我听了就觉得很无语的\n1、某两男，觉得打工苦，于是加入当地中国人黑帮组织，在第一次行动前被警方抓获，住的校宿舍房间内搜出绳索、斧头、催泪瓦斯等，于是被关押几个月后遣送回国。\n2，某男和学校某女老师看对眼，两个人在学校就拉拉扯扯，但是某日两人外出相见后去到某男住所，开始从文艺复兴聊到诗词歌赋，相互说着动人的情话发着非你不可的誓言，然后一晚上连外套都没脱……","children":[{"role":"回应者","text":"第二个是你吧？没带蓝色小药丸？"},{"role":"作者","text":"是个香港同胞哦\n戴个眼镜高高瘦瘦看上去还挺斯文"}]},{"text":"我一个同学，男的，在国外被几个黑人同性恋强暴了…….以前挺阳光开朗的一个人，后来整个人变得极其神经质….","children":[{"role":"作者","text":"确实，整个人都变了…以前挺开朗的，长得也挺秀气，回国之后邋里邋遢不修边幅，不刮胡子留长发，我们以为他是在国外学的什么凹造型….后来才知道他有那种经历。不过现在比刚回来那会好多了"}]},{"text":"有华人本科校友拉开宿舍气动床，下面全部是。和当地gangs关系很好，可以互成你哥的那种。虽然UK对飞不怎么管，但是你贩还真的有点猛了。","children":[]},{"text":"初恋很多年前高中毕业后去澳洲留学，后来她回来我们成了 py 关系，她和我说过一件事印象深刻，两个港区女生很努力的，也很漂亮，我问她努力什么，她说卖 b","children":[]},{"text":"不是我自己经历的，是我朋友。他租房的房东有一儿一女，好像是异父异母，被我朋友发现搞在一起了，房东不知道。","children":[{"role":"作者","text":"也就是父亲再婚，继母也是再婚，各带一个孩子。那天我朋友早回家了，他两以为我朋友不在，搞得非常大声。"}]},{"text":"我在91上刷到组里师兄的作品，这玩意发帖征集在美华人搞他注册结婚了的老婆，之前我一直以为这种是剧情","children":[]},{"text":"隔壁宿舍大一开学第一周吸气死了","children":[]},{"text":"无非就是X上面那些事，没有底线和没有下限而已。说一个我觉得最搞笑的事就是期末考试，两个女同学作弊，然后被老师抓去校长室重考。老师说西班牙人都考不到那么高分，你们两个中国人怎么那么牛逼，笑死","children":[]},{"text":"我同事，在LA晚上出去玩，被老黑拿枪围了，最后一把枪顶脑袋，三把枪顶菊花，太tm残了","children":[]},{"text":"认识一个哥们，在一天之内连续遇到捡钱，被8分美女搭讪，撞车（开车冲到花坛里了，人没受伤，因为喝了酒黑灯瞎火赶紧跑掉了，不过后续还是被找到了，结果被罚了几个月义工），回家匆匆忙忙把包忘在车里，结果被车窗被砸，然后到家里，发现墙上多俩流弹的弹孔，附近黑哥火拼乱开枪，黑哥没事，好几个邻居家中弹。也不知道他这一天算是幸运还是不幸。\n搭讪他的那个小美女，俩人后来还真交往了一段，然后通过她的关系，那哥们还找到了一个挺好的工作，给人拍卖事故车，这哥们挺懂车的，这个工作就是去评估一些事故车，看看维修价值，然后买回来修了卖二手，早些年还不那么流行，现在已经可以看到很多相关视频了。他干这个一直干到他回国，收入还不错，只管评估和拍卖，又很轻松。这大概要算是那一天最大的一个好运了。","children":[]}]},{"title":"变身魔法少女却没怪兽可打，你会做什么？","body":"某天醒来，床头多了个空调遥控器大小的粉色魔杖。拿起就变身魔法少女，放下解除；带在身上保持，掉了解除。没有吉祥物解释，也没有魔女、怪兽或邪恶组织。变身能念咒放酷炫魔法，但不能和现实物体产生物理交互，连在纸上轰个洞都不行，也不能飞。攻击魔法只对魔法少女的宿敌生效，宿敌是什么不知道。变身无时限无副作用，只是指纹和刷脸没法用。这个过程能被摄影设备记录，没有认知屏障。你会做什么？","replies":[{"text":"拍视频去","children":[]},{"text":"拿起后指纹和脸不同，光这个就够你犯罪干票大的咯","children":[]},{"text":"要不你去唱跳成为偶像吧","children":[{"role":"回应者","text":"如果在舞台上脱手的话，职业生涯就结束了罢"}]},{"text":"是时候制造怪兽了","children":[]},{"text":"变身足够进行身份伪装了，魔法少女太炸眼，但是可以变身后把衣服换一身，妹子进去汉子出来。\n魔法可以唬人了，足够发展成邪教教主级别，自己话术不行当个圣女分钱也行。","children":[]},{"text":"那我必须研究一下女生的生理构造","children":[]},{"text":"魔术师是魔法师假扮的，那你就可以去当魔法特效师","children":[]},{"text":"没有副作用也没有时间限制吗 那我把魔杖磨成粉吃了吧","children":[]},{"text":"别人能看到魔法特效吗？能的话还是有用的，比如在别人眼珠创造一层不透光的纸，不能物理交互但是可以实质造成目盲效果什么的","children":[]},{"text":"可研究的地方挺多的。比如不跟现实物体发生交互，也就是说特效连可见光都不是(光也有光压来着)，很神奇，不是光但是让感受光的细胞产生信号…\n能有这种超自然现象，要么世界其实是允许超自然现象存在，要么幕后黑手能在现实物理法则基础上强行制造例外，不管哪个都挺颠覆的…","children":[]},{"text":"这可是完美的双重身份，赶紧看看刑法上都写了啥？？","children":[]},{"text":"不能飞那敌人真来了也是白搭，还是研究一下怎么永久带在身上吧","children":[]},{"text":"幻术也是可以杀人的","children":[]},{"text":"能提升动态视力反应力等身体素质吗，那我速速开一把绀珠传","children":[]},{"text":"上交国家喽，要是国家本身都被怪兽掌控了，那也干脆别挣扎了，我看恶堕也挺好。","children":[]},{"text":"问题来了\n魔法少女状态变身前后 身体状态是否同步(传染病、慢性病)\n每次变身，魔法少女形态下的身体状态是否会刷新\n变身形态下，对针对人体的病菌、传染病是否免疫\n变身形态下本体的寿命是否自然流逝、魔法少女形态会不会随时间老化\n\n没有怪兽打，不就是连给qb打工这一环都省了，直接白嫖一副健康的身体","children":[]},{"text":"那当然去制造邪恶再去正义执行了\n既然魔法少女需要正义击败邪恶\n如果没有邪恶怪人 我算什么魔法少女","children":[]},{"text":"成为黑帮老大(kono迪亚波罗哒！)","children":[]},{"text":"先把该死的工作辞了","children":[]},{"text":"那我不直接vtb真人出道狠狠恰米","children":[]},{"text":"我去翻翻刑法，onlyfans哪有刑法来钱快","children":[]},{"text":"去找机关和凉宫春日","children":[]},{"text":"看看魔法最大作用范围，释放的魔法其他人能不能观测到？持续力如何？若是能理论上往模因危害武器方向去发展\n\n魔法最大作用范围若是能到达笼罩地表的程度，嘻嘻，我要光污染地球灭绝生态圈口牙！","children":[]}]},{"title":"香港演技最强的三个男演员","body":"香港男演员里，前二几乎没有争议，是二梁；第三竞争有点大，张国荣、周润发、吴镇宇。","replies":[{"text":"任达华刘青云应该排这三个人前面","children":[{"role":"回应者","text":"任达华戏路略窄一点，例如他演不了逗比\n其他的几个基本全能型"}]},{"text":"反正我觉得吴孟达第一","children":[]},{"text":"梁朝伟那万年面瘫脸式演技还不如学友哥呢","children":[{"role":"回应者","text":"无间道：？\n冷知识，梁朝伟和乌蝇哥搭档过喜剧"}]},{"text":"梁家辉，周星驰，林家栋，张家辉","children":[{"role":"回应者","text":"看到林家栋，必须支持一下，东莞仔的演技快能接班梁家辉。可惜他演技大成时，港片时代已经过去。没有一部个人当大旗大红片。"}]},{"text":"只有梁家辉有不需要讨论的地位，其他人没有。另外这种排名，请加上学友、青云和达华。","children":[]},{"text":"梁家辉独一档\n梁朝伟往后稍一稍","children":[]},{"text":"周润发一直觉得他很尬，有时都可以看出用力过猛","children":[{"role":"回应者","text":"因为以前演太多江湖大哥，有包袱了。就不会演非大哥角色了。"}]},{"text":"梁家辉，周星驰，剩下一个可选比较多","children":[{"role":"回应者","text":"梁家辉，周星驰我同意，周星驰就是无厘头搞笑让大家忽略了他的演技第三给吴孟达或者成龙都可以，梁朝伟和周润发有点过誉了"}]},{"text":"王晶说，梁家辉演技仅次于周星驰","children":[{"role":"回应者","text":"喜剧方面是。\n\n但星爷也没演其他类型也没出彩的地方"}]},{"text":"周润发有演技？哪一部片？","children":[{"role":"回应者","text":"有啊，喋血双雄的小庄，被他四哥拿枪指着那种表情，赌神里他在朱古力和高进两个角色无缝切换，演傻子和演赌神时那眼神和表情完全是不一样的，还有英雄本色里地下车库吃盒饭遇到狄龙时那种高兴，不甘，又带点委屈，其实周润发演技挺好的"}]},{"text":"论拿奖，梁朝伟前三妥妥的\n论演技，任达华、吴镇宇、周星驰、吴孟达、黄狗等等，他顶多想一想前十","children":[]},{"text":"论演技从来没觉得张国荣行\n\n真要说第一\n绝对是梁家辉\n\n这个人是真让我觉得演什么像什么\n而且什么都能演的人\n\n喜剧悲剧\n正剧娱乐剧\n好人坏人\n大人小人\n正人邪人平常人\n每一种角色他都能刻画出来...\n\n其他很多好演员\n只有在自己擅长的领域内才有好的发挥\n比如周星驰 \n无厘头喜剧他无敌\n但正剧很显然就不太行了","children":[]},{"text":"哈？谈香港演技，千面如来都不配上桌了吗？","children":[{"role":"回应者","text":"这个就是主角演少了"}]},{"text":"周星驰，吴孟达，梁家辉","children":[]},{"text":"当年香港称到演技的一直是廖伟雄和郑则仕，后来的是梁家辉。","children":[]},{"text":"上世纪三级片流行时的几个男星才是真的演技之王，什么单立文 曹查理 任达华 吴启华都是演技杠杠的。","children":[]},{"text":"万梓良\n我心目中的演技满分，反正在大哥这条赛道上已经到达巅峰了","children":[]},{"text":"说张国荣不行的啊\n\n想想东邪西毒，东成西就，霸王别姬，倩女幽魂，春光乍泄，阿飞正传\n\n跟他的唱比，他演电影更像个副业，要是和其他人一样多拍，还不知道多几个经典作品","children":[{"role":"回应者","text":"他们就一句“沾死人光”，不会说点别的。完全不知道张国荣演的这几个片子，那就是演员里的传奇。一个演员主演了霸王别姬，他们知不知道什么概念？"}]},{"text":"那我还是认为刘青云和周润发更强，梁朝伟演谁都是梁朝伟","children":[]},{"text":"单论演技这一项我觉得是梁家辉\n\n当然成龙演技也是顶尖的，只不过讨论成龙很难不把他强烈的个人风格算进去","children":[]},{"text":"梁朝伟肯定是排在第一的 后面是梁家辉 任达华","children":[]},{"text":"我提张学友一票，不能因为学友哥唱歌好，就忽视他的演技","children":[]},{"text":"我心里一直是吴孟达，没有他，星爷的片子也黯然失色，2人的化学反应太厉害了。","children":[{"role":"回应者","text":"唐伯虎点秋香里就没有达叔，换了陈百祥不是一样出彩？"},{"role":"作者","text":"那是谁多点？"}]},{"text":"从看过的电影看，戏路最广的是梁家辉，然后是梁朝伟、刘青云","children":[]},{"text":"没有郑则仕？成龙在重案组把郑则仕压了，拿到金马奖也该有一席之地","children":[]},{"text":"梁家辉，刘洵，吴孟达，任达华，刘青云，林家栋，排名不分先后","children":[]},{"text":"梁朝伟的演技也就是舒适区里勉强T0而已\n\n演点别的就露馅","children":[{"role":"回应者","text":"伟仔主要是拿奖的戏角色太单一了\n\n基本都是一个调调\n\n实际上他的喜剧功底是很强的，后期没有往这边发展是比较可惜的，当然也有可能是和星爷撞脸了(不是"}]},{"text":"梁朝伟输就输在天赋上，不是说天赋低，而是天赋高\n\n梁朝伟天生就会用眼神说话，这种技术其他演员可能学一辈子都学不会，对于导演来说更是千载难逢，李安王家卫都说过类似的话，他是所有文艺片导演的梦中情人，侯孝贤更是直说哪怕改剧本都要让梁朝伟展示这种天赋\n\n这种过高的天赋某种意义上来说成为了他锻炼其他类型角色演技的阻碍，有点类似罗伯特德罗尼，天赋过高使得导演都来为他搭台，演谁都像自己","children":[]},{"text":"秦沛、谷峰呢？你说角色多样性，这两可不低","children":[{"role":"回应者","text":"这俩反派专业户了。"},{"role":"作者","text":"秦沛和谷峰好人也演过不少"}]},{"text":"香港男演员t1演技里：梁家辉、梁朝伟、吴镇宇、刘青云、周润发、周星驰、任达华、张国荣\n\n差不多就是这些人，排名根据喜好分先后\n\n虽然大哥很猛地位t0而且是因为最顶级只有t0，但是大哥单讲演技确实和上面几个有差距  \n\n歌神演技不列入评估范围，主要是样本比较少，好的超神，烂的也确实很烂。","children":[]},{"text":"郭峰我觉得演技就是顶级的，他演的不管正牌反派都是信手拈来，霍景良，吕不韦，各种警察署长总警司，反派大佬，古装剧里上至王公大臣下至酒店掌柜，简简单单","children":[]},{"text":"梁家辉\u003e周星驰\u003e周润发≥吴镇宇≥刘青云\n\n星爷第二，我是个人认为喜剧演员演正剧属于降维打击。。。\n\n另外，吴镇宇很多人是小瞧了的，很有实力。\n\n我一只觉得吴镇宇和刘青云\u003e华仔，华仔胜在全面和做人，前面那俩属于偏科生。。。","children":[]},{"text":"你说的这些明星，\n\n有好几个，他们自己都说：“第一是周星驰”。\n\n除了他们，还有很多大导演、金牌配角，都认为周星驰第一。","children":[{"role":"回应者","text":"他们不懂喜剧和正剧的难度"}]},{"text":"酒剑仙出道战就干翻梁朝伟的，只能说文无第一","children":[]},{"text":"第一就是我大D哥，谁赞成谁反对，下面的我就不投了，你们自己去搓圆仔汤，有好剧本的时候你们分我一个配角演就行了，我不是戏霸不抢戏","children":[]},{"text":"大概看过一些梁家辉电影的都应该承认他就是t0独一档的，华语电影里面，大陆有演技和他一档的，但是没人戏路像他一样宽。","children":[]},{"text":"外行看热闹，内行看门道\n演技谁最好，导演王晶说过周星驰的演技未来几十年都没人能超越","children":[]},{"text":"天天都在玩大时代的梗，可别忘了丁蟹","children":[]},{"text":"梁朝伟还比不上吴启华，吴启华可是正人君子 变态 小人都演的活灵活现","children":[]},{"text":"梁家辉吧\n还有刘洵这两个印象太深刻了\n刘洵有一张公公的图片 我光是看着就觉得阴气逼人\n这是什么功力！","children":[]},{"text":"我个人觉得NO.1就是周星驰，喜剧其实是最难演的","children":[]},{"text":"吴镇宇这么多年拿不到一个金像奖，最有希望的一年，输给了谢贤复出的噱头。\n吴镇宇最好的两个角色，我觉得是一个赌鬼的传说，和无间道2，一个喜剧，一个正剧，一个主角，一个配角。\n反映了他演技的全面，但是也反映了香港电影工业化制造的先天不足。\n就像王晶，拍10部电影，9部都是好看的，但是选最佳导演呢，评委永远不会考虑他。\n所以我觉得吴镇宇进前十也只能是守门员，甚至应该在十名开外。","children":[]},{"text":"虽然我很喜欢哥哥，\n\n如果只选巅峰一部戏的演技，哥哥凭霸王别姬第一都可以争，但如果不是一部戏，哥哥最多只能当前十的守门员。","children":[]},{"text":"梁家辉没什么问题  \n但是说道多样性方面 梁朝伟真的不行 \n千面如来吊打之","children":[]},{"text":"男的梁朝伟，女的张曼玉，演技不管是不是最强的那个，奖项确实是无敌的，无论如何肯定在最顶级的行列","children":[]},{"text":"没人提李连杰么\n\n洪熙官、方世玉、黄飞鸿同一套造型都能演出不同风格\n\n甚至打出不同风格","children":[]},{"text":"梁朝伟？在我看来还不如吴孟达\n\n达叔真是演啥像啥，各种类型都能驾驭","children":[]},{"text":"梁家辉第一 其他第几无所谓了\n周星驰应该是被低估了，周润发应该是被高估了","children":[]},{"text":"张国荣应该排进前三，没他就没有《英雄本色》的成功，他在里面演一个幼稚又热血的弟弟，演的太成功了，让人以为他本人就是幼稚又热血，甚至他的演技也是幼稚又热血，属于演的太逼真了把自己给坑了。\n别看他的舞台形象风风火火，其实他是一位外表和善、内心忧郁的文艺青年。","children":[]},{"text":"表演类奖项，梁朝伟6金像3金马1金鸡1戛纳，梁家辉4金像1金马，两岸三地到海外全包围了(尤其内地，考虑到立场差异，这差距已经非常大了)，总结性表彰更不必说，比如顶级电影节或学院奖的终身成就，比如05年的一系列百年百大，基本也是全包围\n\n总之，但凡是表演类指标，梁家辉就没有能胜过梁朝伟的，这确实不能相提并论","children":[]}]},{"title":"有什么已死的手游是你永久怀念的吗","body":"有哪些已经“死”了的手游，是你至今仍会怀念的？","replies":[{"text":"克鲁赛德战记，也是二次元三消","children":[]},{"text":"提前在幻书死之前弃坑所以还好，意难平的就是植物人的永七","children":[]},{"text":"《幻想战姬》，被群友安利去玩的第一款手游，水墨画风格的二次元画风有些立绘放现在铁和谐的那种程度。周围拉我入坑的伙计都退坑了我还坚持到关服，甚至这游戏还把主线剧情写完了才关的我还给他们转述主线故事","children":[{"role":"回应者","text":"炸鸡国服打完阴剧情就断了 是说日服主线？"}]},{"text":"龙约，至今怀念那段加载界面的BGM","children":[]},{"text":"宿命回响 ui太牛逼了\n而且人设和题材也很喜欢","children":[]},{"text":"有两个，一个是双生视界\n还有一个是我玩的第一个手游，一直玩到了关服，应该有不少人虽然没玩过但听过它的名字，或者和这个游戏有关的传闻\n山海战记，我手机里现在还留着它的图","children":[]},{"text":"影之诗","children":[]},{"text":"必须cq啊可惜棒子短视真把s2搞死了","children":[]},{"text":"乖离性百万亚瑟王","children":[]},{"text":"永远怀念的手游吗？\n那必然是《艾诺迪亚》了！\n谁能懂最初接触智能机时的白月光啊！","children":[{"role":"回应者","text":"單機不算已死吧"}]},{"text":"梅露可物语，弹射世界","children":[]},{"text":"《银河足球队》","children":[]},{"text":"神代梦华谭 那时候打了一晚上，打个全服第一","children":[]},{"text":"妖恋奇谭，剧情和画风还可以","children":[]},{"text":"数值膨胀前的乖离，比FGO还让我更早接触神话传说人物","children":[]},{"text":"失落的龙约爹不疼娘不爱，版权方任天堂只是拿它当做和白猫打官司的工具，打完官司后直接放生。运营的CY觉得这游戏版权反正不在自己手上直接后妈式放养，狠狠压榨剩余价值","children":[]},{"text":"乖离MA我再也找不回以前共斗打牌的感觉了","children":[{"role":"回应者","text":"怪离环是技八给这个IP盖的最后一层土。果然废物做事就是靠不住啊"}]},{"text":"乖离ma，算是青春了，认识了很多朋友，游戏性和社交性都不错，后续代餐也很少，纯白女巫开服暴死，新的ma出来玩了会算是还原了很多，台服玩了一会之后等等国服吧。。。\n\n还有一个没有情怀加分纯游戏性的就是黑潮之上，算是二次元肉鸽卡牌(杀戮尖塔)？被猪场运营死后，几乎没有代餐，包括纯白和弦一类的虽然局内游戏机制稍微接近，但是角色卡组没有那么大的自由度和类肉鸽局外养成，目前市面上唯一可见代餐好像是棒子的chaos zero nightmare，也在等吧。。。","children":[]},{"text":"天命之子吧，当初为了玩到错过的街霸联动还特地话600去闲鱼买了个号，可惜买了之后也没玩多久就a了","children":[]},{"text":"takt Op，我是真的喜歡這部番，很享受那趟公路旅行，沒想到遊戲短命的誇張……\n\nエヌイノセンス，少見的手遊格鬥類型，當時也是停更了非常久才宣佈終止營运\n\nAliceFiction，印象很深刻，跟上面一樣也是停更很久才宣佈終止營运，不過我覺得這遊戲已經結束的很體面了\n\nユクレゾ，哈哈我死啦我又活啦我又死啦我又活啦我又死啦，從來沒看過有遊戲可以終止營运又換名再戰這麼多次的","children":[]},{"text":"苍之纪元，一个小厂的放置手游。画风很戳，关服之后再也找不到跟他一个味的手游了","children":[]},{"text":"dmm的社娘每个月付费项目固定，每天免费一抽，运气差了再充钱\n剧情和人设都挺不错的，可惜关服了。。。\n\n素材被其他公司买去打复活赛褒姒，好似","children":[{"role":"回应者","text":"立绘水平感觉挺高，不过可能太良心了爆不出米"}]},{"text":"龙约，唯一让我觉得是一款网游而不是单机的游戏","children":[]},{"text":"玛奇决战~\n不明白为什么一个卡牌对战游戏要停掉","children":[]},{"text":"苍空的解放者","children":[]},{"text":"神都夜行录，网易真该死啊","children":[]},{"text":"说个小众点的：痛击英雄。一个很独特的玩法，手游里独一份。","children":[]},{"text":"我魔女兵器真的已经没人记得了吗","children":[{"role":"回应者","text":"魔女兵器，那个剧情现写的逼游戏，太整蛊了。我退坑的时候第二个活动都没写完，真把我看傻了"}]},{"text":"神都夜行录 再也找不到这样的刷子游戏了\n已经开始玩fgo了","children":[]},{"text":"幻境双生，在tap上下架之后就不知道去哪找了\nPC版的好像没有DLC","children":[]},{"text":"其他的都还好，龙约我是真怀念\n到现在还记得第一个活动bgm，呀~咿 呀~咿 呀咿呀咿呀~","children":[]},{"text":"时空炫斗，是一个java时代我就很喜欢的厂商做的。世界观类似大蛇无双，不同国家的英雄大乱斗。我还记得我最喜欢的阵容是唐僧、雅典娜、赵云、真田幸村、织田信长，再加个冰主，一套连招能打几十下。\n玩法和腾讯的火影忍者页游(回合制，不是格斗的那个)一样，主角也是完全照搬页游的五系主角，只不过把人物形象大改了，火主是照着拳皇k做的，冰主是库拉，风主是贝姐。\n战斗系统贼好玩，攻击可以造成敌人击退、小浮空、大浮空、倒地等状态，不同的人物会针对这些状态进行追击，又造成新的状态，别人再接着追击，玩起来特别带感。第一次玩了大概两个月吧，被肝度和难度劝退了，气得我在tap打了一篇长文骂厂商。\n后面实在没游戏玩了又下回来重新玩，疯狂沉迷，每天废寝忘食肝，终于拿到了性转版的上杉谦信，也慢慢明白关卡应该怎么打，要在什么时机出招，什么时机打断敌人出招，不能瞎放技能。\n后来的某一天，我一打开游戏，系统就送了我10万钻，我一打开角色，居然所有角色我都有了。我当时就明白是要关服了。后续又玩了半年，大家都是全人物，每天上线就是跟全球玩家打竞技场pk(没错这b游戏还是全球同服的)，纯拼你对人物的理解。再后来关卡全通了，很突然的一天，公告也没发，就关服了。\n我特别特别喜欢这游戏，无论是画面还是机制，都深得我心。刚关服那几年我每年都去tap论坛留言，不知道啥时候论坛也关了，就逐渐淡忘了。\n这游戏真的挺可惜的，我贼喜欢他的画风。","children":[]},{"text":"机甲爱丽丝国服","children":[]},{"te ldren":[]},{"text":"不要问，问就是随便，都可以，一具体就这不好那不行。","children":[]},{"text":"设计院领导：我们这次施工图预判式生产，请大家严格按照生产进度计划表相互提咨，推后的时间只能缩短其他专业的正常画图时间","children":[{"role":"回应者","text":"预判式生产是什么勾八？"}]},{"text":"领导:你可以上班干公司的事，下班再把xx的材料写了","children":[]},{"text":"我们一定要有奉献精神！\n不能事不关己高高挂起！\n平时工作有困难一定要提！\n不是我就不明白了，有那么难吗！有那么困难吗！\n你看这样不也能弄吗，我就说可以吧~","children":[]}]},{"title":"死亡重置记忆，如何逃出怪物校园？","body":"在有怪物游荡的校园里，每次死亡都会重置记忆并获得一条提示，要怎样才能成功逃脱？","replies":[{"text":"要是我到这种环境肯定试着搓装备打一打，或者尝试搓绳索从窗户跑(总之大概率白给)","children":[{"role":"回应者","text":"确实是不错的想法，但是为啥不先试试从楼梯走到一楼再出去"}]},{"text":"找找有没有粉笔之类的，在墙上写上记号，然后下楼梯。没有必要的话先不进房间，从走廊上全校逛一圈，走过的地方用数字升序做记号。如果看到有危险地形，则额外做三角叹号的标志。","children":[]},{"text":"尝试拿衣服或者场景里找材料搓绳子，确认坚固后一层一层下，总之既然楼里有危险那就走外面，真有危险再回来虽然我觉得没机会回来了(绳子是可以整成下一层能收回去那种，虽然感觉走窗户会出事，但我估计我会这么干)要不是第一个提示是不要开灯我肯定找点光源或者开始想办法放火了","children":[]},{"text":"其实把灯全打开低头走路就行了，只看脚它是不管的","children":[{"role":"回应者","text":"主角毕竟不是史蒂夫，十字准星不动，就不会移动视线。"}]},{"text":"如果真是末影人的话，其实最好的办法是找个牢固的低矮结构，人藏在下面用长柄武器去修脚，这甚至能单刷","children":[]}]},{"title":"哪些神话民俗设定出自现代作品？","body":"你知道哪些常被当成神话或民俗的设定，其实出自现代小说、游戏等文艺作品？","replies":[{"text":"这不最典型的克苏鲁","children":[{"role":"回应者","text":"甚至当前流行文化中规范化、体系化的克苏鲁神话要素还是洛氏本人死后一个叫德雷斯的人搞的二创，且其中不乏生搬硬套刻意凑对应的情况，例如克苏鲁一个被封印在海底古城遗迹的存在莫名其妙就成了水属性代表古神"}]},{"text":"华南到台湾，很多所谓的考究民俗，其实源自于梦入神机的佛本是道","children":[]},{"text":"吸血鬼和狼人争风吃醋。","children":[{"role":"回应者","text":"有趣的是狼人和吸血鬼本身实际是同种玩意儿，现代意义上的狼人和吸血鬼都是来自东欧的吸血活尸传说，这种活尸会在晚上变成狼人来吸血。但现在吸血鬼摆托了狼的意象，虽然德古拉小说里也变过狼。保留吸血活尸的设定，并跟吸血蝙蝠的形象挂钩。而狼人就剩下个变狼以及被狼人伤害也会变狼人的设定了。"}]},{"text":"二郎神是沉香舅舅出自上美版宝莲灯","children":[{"role":"回应者","text":"这个真不是，清朝同治年间的沉香宝卷，沉香母亲的哥哥就是二郎神，最骚的是这事还是二郎神在瑶池会上调戏何仙姑说你有老公没有，何仙姑反呛说我没老公你妹妹真有老公，这才泄露的"}]},{"text":"他，改变了吸血鬼\n《德古拉》","children":[{"role":"回应者","text":"吸血鬼上逼格应该等到白狼了，把吸血鬼跟亚伯该隐关联起来应该也是那里，蘑菇的死徒、真祖也基本是纯抄的那个系统"}]},{"text":"轩辕剑也是啊，或者说这个才是重灾区，其他9个神器是顺便的\n\n洪荒流提供的几乎所有设定，包括昊天是鸿钧童子、鸿钧是所有人老师、巫族、妖庭、龙凤大劫、罗睺、三千魔神、多宝是释O、准提是菜狗，等全部","children":[]},{"text":"五弊三缺\n出自崔走召的《我当阴阳先生那几年》，是作者根据一些民间说法编出来的，但是被很多人真当成了传统文化","children":[]},{"text":"发菜的大量传统文化都是八十年代发明出来的","children":[]},{"text":"僵尸的影响是最大的吧\n影视里经典的僵尸形象，僵尸咬人也会变僵尸等说法\n都是当时的电影创作者杂糅了民俗，还有外国吸血鬼等形象建立起来的","children":[{"role":"回应者","text":"像墨斗封印，清朝官服，跳着行走都是电影生造的\n以及最核心的设定之一茅山道士真的和僵尸一毛钱关系没有"}]},{"text":"既然提到了轩辕剑，那就不得不提到轩辕剑了\n\n其实整个十神器都有点微妙\n黄帝铸剑是有记载的，但显然不是这么一回事\n伏羲也有造琴的传说，但同样也不是那个意思\n盘古的确有把斧头，也确实开天辟地，但并没有什么其他详情\n女娲自然有块石头\n东皇有个钟也没啥问题\n别的大抵也似是而非\n比如黄帝问道广成子于崆峒山，广成子最有名的法宝是番天印，虽然书看串了，但姑且也算有逻辑吧","children":[{"role":"回应者","text":"但是这个系列还有个因果律神器啊 \n众所周知，上古十大神器有十一件，真的"}]},{"text":"凤凰涅槃","children":[{"role":"回应者","text":"感觉凤凰吸取了不死鸟死而复生的能力，不死鸟吸取了凤凰美丽的外形\n\n考虑到不死鸟自焚还要靠点燃木材和香料，点火应该是靠外力\n凤凰和不死鸟应该都吸取了朱雀的火能力"}]},{"text":"知名日本都市怪谈“如月车站”是爱迪奥特曼的原创情节","children":[]},{"text":"圣诞老人的红色衣服，完全就是广告营销出来的刻板印象。","children":[{"role":"回应者","text":"其实坊间一直有传闻圣诞老人形象是可口可乐公司创作的，但是这个反而是谣言至少在19世纪早期，圣诞老人就已经定下来了红衣白胡子胖老头的形象，在一战时期这个形象已经被广泛作为圣诞节吉祥物形象了，满打满算也有200年历史\n但是在可口可乐公司靠广告营销把圣诞老人和自家产品强绑定，并且几乎是完全统一圣诞老人造型这就是另一回事了"}]},{"text":"地缚灵。创作者中冈俊哉以前参加过过抗战，当过北京台日语播音员","children":[]},{"text":"贯穿死棘之枪基伯尔格的必中效果是月球原创","children":[{"role":"回应者","text":"逆转因果穿心才是原创，必中不是，狗哥最后死就是因为背负誓言把枪交给了和他有杀父之仇的吟游诗人，吟游诗人明明是个战五渣，但拿到了枪以后只需要念诵王者之枪贯穿王者，扔出去的枪就是必中"}]},{"text":"其实是这样，北欧神话的发掘离现在并没有很远，在“漫威流行文化开始写北欧神话角色”的那个时候，大伙真以为洛基是托尔的弟弟。\n后来才发现是奥丁的。\n到漫威开始搞北欧神话的五六十年代，这个设定已经深入人心了。","children":[]},{"text":"源自古早游戏创世纪4的骑士八大美德","children":[]},{"text":"年兽目前可考出处还差个几年才满一百岁。","children":[]},{"text":"“龙的传人”这个广义概念。\n自认是“龙裔”的古人有，但是用“龙的传人”来指代华人好像是近代甚至现代的事了……","children":[{"role":"回应者","text":"但其实龙被皇家独占也就是元明时的事，比很多人印象都要近。"}]},{"text":"亚瑟王的剑鞘叫阿瓦隆也是型月的二创\n阿瓦隆原本只是地名","children":[{"role":"回应者","text":"fate里阿瓦隆也是地名，遥远的理想乡，剑鞘是异次元门，连接了那里，梅林就住在阿瓦隆"}]},{"text":"神笔马良\n因为改编画风多半是古风小生导致一直下意识以为是古代玄幻，知道这个故事实际出版于1955年的时候相当震惊","children":[]},{"text":"楢山节考\n因为编的很一本正经被太多人当真了","children":[]},{"text":"有首《七杀碑》，传播较多的句子有“忽有狂徒夜磨刀，帝星飘摇荧惑高”，其实是现代小说家燕垒生所作。\n另外所谓刻有七个杀字的七杀碑的传说也就大概一百多年，清朝县志首次记载，可能是民国小说《七杀碑》后才有大规模传播，而现实存在的只有一个“圣谕碑”。","children":[]},{"text":"炼气、筑基、金丹、元婴、化神，\n全是出自《飘邈之旅》和《凡人修仙传》那批作品","children":[]},{"text":"糯米驱尸跟屏蔽呼吸避尸之类的设定，都是洪金宝武术班锻炼时想出来的，这些都是他们访谈说的。","children":[]},{"text":"维京人的代表形象牛角头盔，其实是当代桌游和游戏的二创。\n同理哥布林的形象 以前也没固定的 很多时候和巨魔 花园矮人  混在一起，直到龙与地下城做了个二创区分\n玄幻小说里面的御剑飞行现在形象 类似踩滑板，最初(晚清民国)的形象 是类似奥特曼那样手里的剑拽着主人飞........到了仙剑游戏里进行了改良，古代更加没有这一说法。","children":[]},{"text":"很多盗墓的词语常识 都是天下霸唱编的\n比如 “粽子” 黑驴蹄子的用法 东南角蜡烛 鸡鸣灯灭不摸金之类 全是编的","children":[]},{"text":"煉金術的等價交換\n只是鋼鍊參考質量守恆整出的設定，但太火一堆人信\n現實煉金術目標是憑空生金，哪有甚麼等價交換","children":[]},{"text":"洪荒\n不止一次看到群友聊封神的时候混进去了","children":[]},{"text":"醉拳啊，准确的说是所谓的“醉八仙”\n醉拳本身可能是传武，但实在证据太少几乎无从考证，现代电影动画游戏等作品里的醉拳全部源自成龙主演袁和平指导的电影《醉拳》，而这部电影里醉拳的打法是两人合作创作的舞台表演形式而已并不是真的拳法，央水武松醉打蒋门神打的是醉拳也是因为武指同为袁和平而已……","children":[]}]},{"title":"大胆说出你喜欢的星铁女性角色","body":"在《崩坏：星穹铁道》里，你喜欢的女性角色是谁？说说喜欢的地方和原因，不限人数；NPC、boss也可以，别太离谱。","replies":[{"text":"符玄！谁能不爱粉毛傲娇！","children":[]},{"text":"镜流，白毛红瞳大姐姐","children":[]},{"text":"停云和白露，软乎乎的大尾巴，嘿嘿，可爱的小短腿，嘻嘻","children":[]},{"text":"那还得是姬子。特地给她弄了个拂晓。景元查无此人。","children":[{"role":"回应者","text":"不带踩的哈咱多说说好的地方只要是你喜欢的，怎样放大都不算犯规！"},{"role":"作者","text":"踩他为何？我十分感谢大将军带来的武器。只不过我xp抽卡没带他回家而已。"}]},{"text":"艾丝妲，如果我要痛车\n\n一定会选艾丝妲的，所有都那么完美","children":[{"role":"回应者","text":"痛车大佬恐怖如斯"}]},{"text":"镜流在刚看到短篇的时候还没啥感觉，刷到一个摘掉眼罩版本的mmd之后立刻被惊艳到了","children":[{"role":"回应者","text":"静流姐姐我帮你滴眼药水呀！"}]},{"text":"我的第一当然是卡芙卡了，感觉这个女人就像一本翻不完的书，未知但永远都会觉得很有趣","children":[{"role":"回应者","text":"而且你还永远会期待她的“下一页”会是什么"}]},{"text":"停云还有卡芙卡姬子虽然好但是强度有点在在线，还是有点影响\n对了星也很喜欢，又屑又可爱，还高","children":[]},{"text":"黑不见底的布洛妮娅\n注定是我老婆的镜流\n还有跑图最爱的星\n还有好像让抱憾终身的符玄","children":[{"role":"回应者","text":"我超！我把自己给忘了哎哟！啊啊啊啊！星妹我喜欢你呀！"}]},{"text":"一看姬子老师开大就想冲，已经冲晕好几次了","children":[]},{"text":"符玄\n很喜欢看性格强势的小女孩吃瘪的剧情","children":[]},{"text":"可可利亚，抽不到的永远是最想要的","children":[]},{"text":"隔壁喜欢刻晴，这边喜欢布洛妮娅\n\n对这种认真脸凛娇完全没有任何抵抗力\n现实中真的有这种做事认真品格坚毅能力强大略带娇媚的的女生吗\n\n或者说声优演绎得太好了\n谢莹声线真的太棒了","children":[]},{"text":"我可以选幻胧吗？谁能拒绝女巨人呢","children":[]},{"text":"我最喜欢那个宇宙市场趋势光锥里的白毛妹子了！感觉很像卡莲的千本樱皮肤！","children":[{"role":"回应者","text":"我也特别喜欢那个白毛妹妹，第一印象真的不错，看着就像个活泼又调皮的人"}]},{"text":"当然是星了，我最开始就是被星的立绘和建模吸引进铁道的","children":[]},{"text":"\"我想，你可能还不明白。\"\n\n喜欢姬子阿姨很大程度上是因为中配的这句话，还有她的专武立绘。不知道怎么形容，总觉得这句话很有故事感，想要为开拓献出一切的悲伤。没接触过崩三，但我觉得姬子无论在铁道和崩三一定都是 \n人物？\n机设？\n\n哪个方面单拎出来是不入流的水准？\n\n我倒是真的很好奇。\n\n理解因为把独角兽强行写入uc纪元带来的观感问题，但单论作品本身，独角兽到底哪部分这么招厌、甚至已经该被划入烂片行列了？","children":[]},{"text":"种自","children":[]},{"text":"差不多得了，0083这种内核完全烂透的就是纯纯的垫底中的垫底，没有任何一部作品能跟它比，作画再好也没救","children":[]},{"text":"鐵血2永遠最下面，沒有之一\n\n它讓我戒膠了，種命都做不到\n\n笨呆去搞30MM那些玩意，我真信是鐵血嚇出來的","children":[]},{"text":"那还是安魂曲吧，拍的属于又蠢又坏，看得出制作组没啥能力又被腌的入味开始到处发散那种表达欲，别的真不及它半根","children":[]},{"text":"给吉翁挽尊的作品很多都是德三味 而0083和秘录系列是皇军味最重的","children":[]},{"text":"0083 安魂曲 吉翁妖精，这三坨里面我最讨厌0083，因为这是uc正史\n\n至于日五档正传，铁血倒一无可争辩，就凭它一己之力干停七年日五档高达","children":[]},{"text":"0083的作画上是优秀的，作为正史贡献了浦木宏这个高达男主，但也正是这样才加剧了它的不可饶恕。\n\n不过0083好歹还能被放到剪辑里，你安魂曲就别来凑热闹了，这个东西做出来我怀疑就是为了恶心我们的","children":[]},{"text":"我是觉得根子上烂了的东西才是真的烂，这个意义上0083、AGE和安魂曲这三部给右翼招魂的是最烂的。尤其AGE，这玩意我当初追着看完的，剧内红茶圣母心泛滥原谅UE，剧外当时小日子右翼猛抬头搞事，给人恶心的不行","children":[]},{"text":"水魔，铁血，种命","children":[]},{"text":"个人是种自和0083","children":[]},{"text":"0083在内一切给军国主义招魂的作品首先拉制作组去打靶\n还有，我黑角是因为它这种能力和无力结局放在UC正史很恶心，但你要说铁血水魔这种臭狗也配来踩一脚了那我陪种孝子一个阵营对外","children":[]},{"text":"创潜一个番外作罪不至此\n只是无聊而已，同一个赛道往前论有初代钢普拉起始G，往后看有真人版创真(说起来哪怕不算G救世主，这部GBR也比传奇敢达更早啊)，千禧年起的SD敢达动画从SDGF到三国赚BBW到创杰传到英雄传也没有好看到哪里去","children":[]},{"text":"说实话排罪大恶极，观众最恨排名，铁血和水魔能上榜。\n\n但是这是最粪排名，我觉得这两不太行，因为这两都是给人希望又狠狠摔碎的作品，追过来的观众可能更恨这两作品，但这两绝对不会是最粪的。\n\n真正的大粪，大多数人是不会去吃的。","children":[]},{"text":"水魔是蠢，铁血是又蠢又坏还赔钱\n铁血编剧歪屁股扭曲剧情，主角团被天降钢钉钉死还被盖章三流机师，主角团被写成反派小混混社团，卖机器人的动画最后用不明所以的铁钉秒杀机器人，无论从立意还是故事核心还是作为商业片没有一项是合格的","children":[]},{"text":"种命种自肯定有一席之地","children":[]},{"text":"铁血稳坐第一，机战主线都进不去，只能进dlc，代孙都不想见冥场面\n这盟主嘛是铁血大哥的，这副盟主是水魔二姐的，三弟这个先锋将军就随便上了","children":[{"role":"回应者","text":"网飞安魂曲一出，谁与争锋？连云小鬼都不肯看个15分钟切片的"},{"role":"作者","text":"这倒是真没看过，看来是更粪的，那没看过就对了"}]},{"text":"0083，网飞那个拯救生命，第三不好说","children":[]},{"text":"你看，我就知道没有多少人记得ms igloo","children":[]},{"text":"我会排x 00 复国 可以烂但不能无聊，这几部看完就感觉只想了开头水到那么多集以及神神秘秘地藏了一堆谜底，揭晓之后比前期热身更无聊了，可能我是更喜欢故事和人物而接受不了设定先行的，不过x的bgm和复国的作画做的非常好","children":[]}]},{"title":"你最喜欢哪种足部防具？","body":"过膝袜、短袜、裤袜、踩脚袜、裸足，你更偏好哪一种？","replies":[{"text":"希望能给裤袜增加D数分类，喜欢低透的和喜欢高透的完全是两种不同的xp","children":[]},{"tex []},{"text":"船袜的xp点在于穿运动鞋/低帮帆布鞋的时候露出完整的脚踝，视觉效果等同于光脚穿鞋，是属于裸足xp的一个分支\n\n而单腿袜一般是指左/右边的腿穿过膝长袜，另一条腿不穿任何袜子，相当于光腿+裸足xp的结合(集大成者)呀","children":[]},{"text":"二次元那当然是都喜欢了，反正怎么都好看\n但如果是三次元的话，除了短袜都不喜欢\n尤其是连裤袜和踩脚袜，洗起来相当于把袜子和贴裆的裤子放一起洗了\n长点的袜子穿的时候还要整理，船袜可能会错位\n丝袜不吸汗穿起来还打滑","children":[]},{"text":"还得是过膝袜绝对领域","children":[]},{"text":"选了短袜和长一点的短袜","children":[]},{"text":"网袜这么好，为什么大家都不喜欢","children":[]},{"text":"你以为我是在选足部装甲，其实我是根据腿部装甲来选的。很难界定大家喜欢过膝袜绝对领域和连裤袜到底是喜欢足部还是腿上的那部分。","children":[]},{"text":"吊带和连裤袜\n其实过膝袜也可，但是还是吊带更瑟一点","children":[]}]},{"title":"ACG里最坏的坏女人能坏到什么程度？","body":"你在ACG作品里见过最坏的坏女人能坏到什么程度？谁的下限最低？","replies":[{"text":"我先摆个玛琪玛在这","children":[]},{"text":"虽然不一定是最坏，但是最先想起来的就是马三娘了","children":[{"role":"回应者","text":"马三娘原型是马\n马三娘赶路会骑马\n四舍五入\n马三娘也是玛奇玛"}]},{"text":"江之岛盾子","children":[]},{"text":"v高达的卡迪公 第一次真正让我感到拳头硬了的acg女性角色 黑富野最恶意的体现 甚至看高达z都没这么恼火过","children":[]},{"text":"这就要提一下巴比伦了，女主恶到让人生理不适","children":[]},{"text":"这就不得不提一嘴卡迪珍娜了，没见过比她坏的","children":[]},{"text":"魔女之家里的“那个人”。\n拖这位的福看到玛奇玛这种从第一话就把“我是坏女人”写在脸上的我看着居然全程放松","children":[]},{"text":"杀生院吧\n把地球塞批里了","children":[{"role":"回应者","text":"虽然但是\n\n满足了世间处男可能一辈子都无法达成的进入XX的幻想，这难道不是真女菩萨吗"},{"role":"作者","text":"人家本来就是女菩萨啊\n正牌女菩萨\n但她爽完要你命啊\n虽然的确是女菩萨\n魔性菩萨"}]},{"text":"细数卡迪珍娜的罪恶，支持赞斯卡尔以断头台的方式进行恐怖统治，第一次开ms就在赞斯卡尔居民区开火，教唆女下属穿比基尼和高达肉身对射导致被光剑蒸发，由于自己情感的摇摆不定就让别人争个你死我活来获得自己的青睐，对原先是笔友的十三岁小弟弟诈降哭诉自己的经历结果拥抱时反手就是一刀腰子，对着装满了活人的大铁块肆无忌惮的开炮，与她同行的面罩哥深陷泥潭思想扭曲我也就认了，但这个女人就是个纯粹的刽子手，为了自己的感情而去行恶，整个高达系列都找不到比她更坏的女人。","children":[]},{"text":"史克威尔最大罪恶绝望事件《圣龙传说》的女主悠悠，“好快！比沙拉曼达还快！”","children":[]},{"text":"万能罚抄，母女都有单人灭世的战绩","children":[]},{"text":"《巴比伦》的曲世爱","children":[]},{"text":"咎儿，连自己都能欺骗","children":[]},{"text":"马琪马，这个我必须点名，我把喜欢你的妹子，你的好哥们，你的好闺蜜(帕瓦)？全都杀了，包括让你喜欢我也是计划一部分，而我只想让你当狗","children":[{"role":"回应者","text":"最后错了，电次主动想当狗，mkm只是单纯想要波奇塔"}]},{"text":"帆刈叶？","children":[]},{"text":"应该看过挺多类似的角色不过总是一时想不起来\nmkm对我来说是个聪明到恐怖的女人\n像芙蕾卡迪公这种我觉得只算小儿科\n在读书时代看剧真正令我气得咬牙的大概有两个，一个是鹰野三四，一个是高达蛋蛋第二季的614，没说614坏，但是第二季她的戏确实看得我抓心挠肝\n再加一个llx里的妮娜，一个角色让编剧安排的全是这些奇葩戏份，也是够可以了","children":[]},{"text":"玛奇玛，坏女人，虽然漫画明讲，但让枪之恶魔附身秋的只能是她，用心太险恶了。","children":[]},{"text":"感觉没有诶，砂糖里面的女店长算吗","children":[]},{"text":"盾一其随，绝望教主在破坏力上就高了其他人一个档次。千奈美之流也就杀几个人，盾子差点完成灭世。","children":[]},{"text":"神厨小福贵里面的老佛爷","children":[]},{"text":"皆川茜","children":[]},{"text":"提名个罗克珊，大剑里坏女人没多少，莉芙露欧菲丽娅虽然不干人事但总感觉讨厌不起来。整个作品就罗克珊我是零好感","children":[]},{"text":"巴比伦，曲世爱，顶着再高的颜都让人觉得只有反胃。","children":[]},{"text":"曲世爱吧，不仅坏还有外挂，甚至没有收到任何惩罚(指动画)，纯尼玛恶心人","children":[]}]},{"title":"张艺谋和陈凯歌00年后哪部最烂？","body":"张艺谋和陈凯歌00年后拍的电影里，你认为哪一部最烂？","replies":[{"text":"考虑背景的话，个人感觉是满江红","children":[{"role":"回应者","text":"满江红如果不是疯狂搞资本炒作招黑，这片子本身称不上烂"}]},{"text":"三枪拍案惊奇。太他妈土了，我第一次看的时候甚至以为导演是赵本山的哪个徒弟","children":[{"role":"回应者","text":"三枪是人情电影，张艺谋自己都承认拍的不咋地。最烂的应该是长城，跪舔白皮都舔出花来了，只能说资本力量太强大"}]},{"text":"影最烂，无极三枪至少能逗我笑","children":[]},{"text":"无极、三枪、满江红、影，排名不分先后都是垃圾！","children":[]},{"text":"把什么都考虑进来，最烂的都是长城，没有之一。\n一个强大的东方帝国，靠一个流浪白皮箭手来拯救。整个电影都是洋人强大，跪舔的气息，并送上美女。踏马的，这电影张艺谋太恶心。","children":[{"role":"回应者","text":"长城剧本和绝大部分职员都是好莱坞的，张艺谋被请去打工而已，他没制片剪辑权的。他后来也说了，后悔接了这片"}]},{"text":"张艺谋：黄金甲\n陈凯歌：无极\n\n这两部真特么是一坨涂着金漆的大便。。。。。","children":[]},{"text":"其实无极也并没有那么烂，还有点人性的思考和宿命论在里面，只是没有讲好故事。\n\n满江红也很拉，不过看票房也算成功的商业模版电影。\n\n我个人最不喜欢的三枪吧，什么玩意儿。","children":[]},{"text":"老谋子水平在那\n\n但是我感觉他时不时的瞎B拍……利益关系？还是还人情债还是啥\n\n三枪  长城   满江红\n\n尼玛，网剧水平","children":[]},{"text":"只论下限的话，还得是张艺谋的长城，真的是烂的无与伦比，烂出天际，比无极还烂。","children":[]},{"text":"道士下山应该独领风骚了～","children":[]},{"text":"没看过三枪和长城，我选满江红，陈凯歌的搜索梅兰芳妖猫传都还行，无极的话嘛，也比满江红好一点……","children":[]},{"text":"最烂不好说，妖猫传和悬崖之上我感觉可以。","children":[]},{"text":"长城最烂，既没有饺子也没有醋","children":[]},{"text":"单论三枪和无极 那肯定是无极更烂 三枪你还能欣赏一下孙红雷的演技 那会儿他还没摆烂，无极真的，除了预言艳照门一无是处，陈凯歌应该感谢胡戈 不是胡戈无极就是太平间里无人认领的尸体 殡仪馆无人认领的遗骸 凉的透透的，而且当年这事儿记者专门去采访过老谋子 老谋子很豁达。衬托的陈凯歌像个小丑上窜下跳 关键到了今天还在嘴硬","children":[]},{"text":"各有各的烂 但是满江红是划时代的\n作为烂片还能拿票房冠军，意味着资本运作的时代到来了\n资本让中国观众吃shi 中国观众就得吃shi，还要告诉你这shi好吃","children":[]},{"text":"张艺谋女儿那部狙击手，不仅烂，还讹钱，那种布景号称投资多少来着？就硬讹！","children":[]},{"text":"无极、白昼吧","children":[]},{"text":"第一反应是无极\n那时因为我没想到三枪\n现在我选三枪","children":[]},{"text":"陈凯歌在我的祖国里那一段真是屎得惊人","children":[]},{"text":"肯定是三枪最垃圾没啥比的，无极和长城至少还能看个热闹，三枪连热闹和特效都没得看。","children":[]},{"text":"三枪最烂，但是emo好片挺多的，他不能离开他熟悉的背景，虽然每年都在追求突破，但是水土不服。\n陈凯歌的话……唉，其实妖猫传我觉得口碑会翻正，但是吧……","children":[]},{"text":"道士下山","children":[]},{"text":"重温《满城尽戴黄金甲》，给我恶心吐了。色调低俗，剧情存在硬伤，演员表演也很拉(我不怪杰伦，杰伦唱歌就好)，尤其是镜头语言极其生硬，看的我不敢相信这是张艺谋的电影。","children":[]}]},{"title":"你看过最烂的国语片是哪部？","body":"你看过的最烂的国语片是哪一部？","replies":[{"text":"富春山居图电影院坐了2个多小时屁股都麻了","children":[{"role":"回应者","text":"我去的可是汽车电影院，更憋屈。。。。"}]},{"text":"你要说我花钱去电影院看过的 那就是《消失的她》了 看到一半就感觉不对劲 看完了越琢磨越恶心 感觉就像强行被人喂了粑粑一样恶心 这片儿从根儿上屁股就是歪的。","children":[]},{"text":"门锁电影院里看的 惊悚片给我看笑了","children":[]},{"text":"九层妖塔，看完半夜了给我整郁闷了，为啥花这么多时间看这么个玩意。","children":[]},{"text":"姜文演的什么图兰朵？那真是我在电影院看到过的最垃圾的东西","children":[]},{"text":"投一个 731，唯一一个让我在各个平台上长文开骂的电影","children":[]},{"text":"说个古早的《左耳》","children":[{"role":"回应者","text":"医学专家说，左耳是靠近心脏最近的地方，甜言蜜语要说给左耳听。"},{"role":"作者","text":"md这么小众的片子也还有受害者。"}]},{"text":"惊蛰无声，开头光污染就看着不舒服，后面室内对话居然谁说话就秒切谁大脸，一点镜头语言都没有，还闪的生理不适，都快给我看出癫痫了，他们还没说完我不就不看了。导演居然还是张艺谋","children":[]},{"text":"富春山居图怎么烂了？\n\n我正经的笑了好几次，里面还有美女，搞比利的佟大为。\n\n最烂的是后来那些什么郭比特人，韩寒，沈腾，贾玲的","children":[]},{"text":"推荐各位去看一下 法门寺之侠女神器。\n\n看完之后你就会觉得，相比于看完整部电影，活着也不是一件很难的事","children":[{"role":"回应者","text":"有幸看过，只坚持了不到2分钟，绝对的SHI中SHI，和这位相比，逐梦娱乐圈、爵迹都堪称杰作。"}]},{"text":"陈凯歌的无极，看的从头懵逼到最后，完事了都没弄明白导演想表达个啥","children":[]},{"text":"我一般会看风评避雷，不过当年为了泡妞还是陪着看了小时代","children":[]},{"text":"网上看的不算，花钱进影院看的最烂片是邓超孙俪两口子拍的那个《恶棍天使》","children":[]},{"text":"大鱼海棠\n\n看到有个女的散场在哭 给爷逗乐了 没白来","children":[]},{"text":"秘密访客\n关键词：男同、代孕、形婚、出轨、地下室囚禁\n郭富城是个gay，然后他跟老婆a形婚，并让老婆a代孕生下了他男朋友的孩子，老婆a以为自己怀的是郭富城的孩子，结果生下来个混血知道了真相上吊了。\n后来这个孩子全班去旅游，出了车祸，只有大巴司机(段奕宏)和另一个学生(失忆了)活了下来，郭富城就动用了财阀的大手，把大巴司机关地下室，把学生买了下来让这个学生以为自己就是郭富城亲儿子，同时又娶了一个老婆b，老婆b自己有一个孩子，组成了一个新家庭。\n这个老婆b之前是另一个财阀的情人，现在是郭富城的形婚老婆，和郭富城的私家车司机有一腿。\n郭富城闲着没事干就去吓唬地下室的段奕宏，老婆b闲着没事干就去地下室勾引段奕宏，把段奕宏搞得一惊一乍的。\n郭富城有时候会去摄影房看着男朋友的照片打手冲。\n\n这部电影我在电影院看的，左边有人，右边也有人，想跑都不好意思走，非常折磨。","children":[]},{"text":"封神传奇，雷震子当主角的那个，","children":[]},{"text":"在电影院里看的最烂就是这个傻逼女足，这之前是富山春居。\n\n下载资源里能和 ，越看越觉得这就是剧本杀，甚至逻辑压根不通，结局更是令人头皮发麻","children":[]},{"text":"花钱看的话就是 刺客聂隐娘 我一直感觉我的忍受度算高的 给我看睡着了","children":[{"role":"回应者","text":"其他人说的电影，要么是没看过，要么是觉得还可以。你说的这部电影，我是真没看懂，不知道导演想要表达什么"}]},{"text":"电影院里大概是港囧吧，当初看过泰囧，以为是原班人马，结果发现是包贝尔这个傻逼，然后我就被这个傻逼折磨了2个小时\n\n后来就很注意看评分再去电影院了，只有口碑好的才会去看","children":[]},{"text":"澳门风云3，尤其是那天看到结尾还停电没看完","children":[]},{"text":"749，比我大学瞎搞的动画作业都烂，特效像ae模板套的，太拉了","children":[]},{"text":"赤道，真的给我恶心到了\n全程故弄玄虚为了反转而反转，还特别一个故事拆成两半准备拍2\n结果扑的现在都没后话，太恶心了","children":[]},{"text":"电影院开业，邀请人免费看电影，当时看的是《十全九美》，看一半离场，这是我觉得最难看的电影了","children":[]},{"text":"唐探系列吧，完全是吱吱哇哇的，像极了春晚郭达+蔡明……","children":[]},{"text":"诡镇，大学时候陪女票去看的，影院看过的最难绷的电影","children":[]},{"text":"唐探3，逐梦演艺圈富春山居图上海堡垒749这些我都看的解说吐槽，因为当我知道这些片的时候风评已经烂完了根本不会去看原片。\n唐探3我真是抱着期待去看的，12我很喜欢，网剧除了明显塞钱塞人的部分外我也比较满意，唐探3我真觉得tm陈思诚在耍老子。\n当时看的一个评论我觉得特别准确，这片为什么宁愿延一年也一定要在春节档上，因为这片除了“热闹”以外烂得一无是处","children":[]},{"text":"铜雀台，古早洗钱烂片，之后对国产电影就慎之又慎了","children":[]},{"text":"极限挑战的那个大电影。。 我就坐了不到20分钟","children":[]},{"text":"大部分我认为一眼烂的是不可能去的\n只有还年轻刚读大学时去看了部煎饼侠，评价是看不了一点，但你要真说是有多惊世骇俗的烂，对比这几年这些拟人生物那又还好","children":[]}]},{"title":"假设迁都上海，会有什么后果？","body":"如果把首都迁到上海，会带来哪些后果？","replies":[{"text":"上海根本不适合做首都，上海的城市文化是商业文明，扮演经济中心角色就行了，容纳不了盘根错节的山头。","children":[]},{"text":"那北京可以光荣的成为河北省会了","children":[]},{"text":"天子守国门？别人守后门，你守前门？","children":[]},{"text":"北京好歹有天津拱卫京畿，上海直接门户大开……","children":[]},{"text":"最大的还是经济问题，北方真完犊子了。","children":[]},{"text":"看有人说法是，定都北方 可以让发达地区不至于直接放弃北部 像宋那样。 保持国家完整","children":[]},{"text":"上海这个位置开打直接就被炸了，首都上来就被炸啥概念？没可能是首都的","children":[]},{"text":"河北人狂喜","children":[]},{"text":"江苏应该是要变河北了，但河北大概是变东北","children":[{"role":"回应者","text":"扎心了老铁"}]},{"text":"抱什么大腿，上海要是首都，浙江和江苏都得让上海吸成贫血。","children":[]},{"text":"那北方就废了，\n借用朱元璋的一句话，难道是半壁江山，","children":[]},{"text":"后果就是北京不再是首都","children":[]},{"text":"那全国人民都是臭外地的+乡毋宁","children":[]},{"text":"上海的交通条件确实不适合首都，但不是差，是太好了，上海这经济地位，就是地理位置和交通优势啊。\n长三角核心，陆运四通八达。然后海港城市，海运港口。而且上海还拥有着可通航内陆河长江，极为少见的河运城市。\n上海是交通条件太好了，老天赏饭的交通全开，就该顺势走经济。发展军事以建设首都，完全是亏的。一国双都的经济之都，就是上海最好的也是天然定位","children":[]},{"text":"上海无险可守，迁都上海等于放弃治疗","children":[]},{"text":"城市功能来说上海贸易货运经济这些功能已经非常拥挤了，再加个政治中心那得挤爆！同样武汉重庆啥的也不合适，还是定长沙吧，把我家拆了我可以住五环外都行","children":[{"role":"回应者","text":"你的算盘珠子崩我脸上了"}]},{"text":"首都靠海，等着挨宰","children":[]},{"text":"经济中心政治中心在南方你是真不怕北方乱啊","children":[]},{"text":"上海直接军舰对着炸然后就登陆了，哪有把沿海城市当首都的","children":[]},{"text":"一个是经济，北方经济没了首都基本上凉了。\n第二个是现在是信息社会。\n迁都的影响大的很。\n一个会被外界解读为不自信，恐被外界利用舆论，影响名族自信。\n外界也会瞎想你的迁都目的。\n若是真强也不必真的迁到更安全的地方","children":[]},{"text":"外企替代国企","children":[]},{"text":"那我要动员大家加紧排放温室气体了 趁早淹了更放心","children":[]},{"text":"海平面上涨，军事打击，分分钟就可能让你百年基业遭受打击。以我们国家的能力，分分钟可以通过确立首都将一个小城变为国际化大都市。但是我国幅员辽阔，黑、蒙、新、云、贵、海、广、浙、山、辽，所有边疆都是不可分割的领土，需要一个中心地带来确保团结紧密各地各族人民。我们不是岛国，不是沿海小国，没必要为了一个沿海城市举全国国防之力来守卫。首都首都，最大的作用是守在那儿，上海的地势守得住吗？淞沪会战的惨烈还在眼前吗？真要是世界掀起新一轮大战，一旦触及到我国本土，上海的惨烈程度较淞沪会有过之而无不及。一旦确立上海为首都，百年基业会被外国疯狂针对毁于一旦的，那个时候像民国时代临时迁都的代价太大了","children":[]},{"text":"迁都上海？沿海城市在现代就是导弹最喜欢的无纵深大目标。民国的时候南京是首都，你看淞沪会战的时候上海沦陷了南京保住了么？","children":[]},{"text":"不会放南方，本来南方就富硕，首都要放北方辐射，不然北方真的彻底烂掉，加剧南北矛盾","children":[]},{"text":"那估计国语都变成英语了，百亿补贴家家一个咖啡机","children":[]},{"text":"应该会被嫌弃吧，毕竟LD也不是都会讲上海话","children":[]},{"text":"全国都是外地佬，重回91年","children":[]},{"text":"到时候要查资产才能进入上海界了","children":[]},{"text":"迁都上海？后果就是敌人的导弹要打你，不用飞那么远了","children":[]},{"text":"海平面上升直接团灭","children":[]},{"text":"意味着再次迁都","children":[]},{"text":"参考淞沪会战，无险可守，行政首都分分钟葬送掉。","children":[]},{"text":"那北京就完了，乐观估计不如济南悲观估计向石家庄靠拢","children":[]},{"text":"这个时代，定都上海并没有什么不合适。当然，我个人并不希望定都上海，因为政治中心会影响金融活跃度，更加会影响思想活跃度。","children":[]},{"text":"那外地乡毋宁去首都就真得开签证了，而且京傲气归傲气，对外地臭要饭的倒是挺一视同仁的，比起排外不排洋带人的老上海滩还是好多了","children":[]},{"text":"没什么后果，该咋过咋过","children":[]},{"text":"后果就是比巴黎快些。","children":[]},{"text":"那上海人还不得装到天上去了。再说了，也没见过哪个首都是崇洋媚外的啊","children":[]},{"text":"第一次鸦片战争就亡国了","children":[]},{"text":"上海改名东京。","children":[]},{"text":"迁都上海，北方废了，完全成资源来源地和商品倾销地","children":[]},{"text":"都城设在经济中心，鸡蛋放在一个篮子里是吧？","children":[]},{"text":"相当于心脏长在肋骨外面。","children":[]},{"text":"定都有个很隐藏的属性就是带动地方发展，你敢想象首都不在北方，北方的经济会拉到什么地步吗………经济上从东北到西北会比现在最少降一个档次","children":[]},{"text":"江苏彻底摘不掉抱上海大腿的帽子了","children":[{"role":"回应者","text":"江浙的未来就是现在的河北？"}]},{"text":"官僚资本和江浙财团结合后不敢想","children":[]},{"text":"新疆西藏丢完\n内蒙东北云南尾大不掉\n中原内陆各自为营","children":[]},{"text":"三峡防护费用大涨","children":[]},{"text":"实在需要的话就在上海远郊择地建设各部门、委办、机构的集中办公区。但如此会造成东南更加繁忙，甚至畸形繁荣，北方更加冷落。","children":[]}]},{"title":"你玩过音乐最好听的游戏是什么？","body":"你玩过的游戏里，哪款游戏的音乐最好听？","replies":[{"text":"我先选一个神之天平吧  \n每次天平启动的bgm一响我都会起一身鸡皮疙瘩","children":[{"role":"回应者","text":"确实，每一章结尾主题曲放出来的时候，天平转动的时候，音乐一响鸡皮疙瘩就来了"}]},{"text":"玩的不多剑盾的最终战里和苍响、藏玛然特一起打无极汰那的bgm，空洞骑士打三螳螂的bgm，以撒的结合真结局线最终战的bgm。","children":[]},{"text":"文无第一，众口难调\n最早被游戏里的音乐震撼到，觉得“woc游戏里音乐还能这么牛逼”是在第一次踏入暴风城的一瞬间","children":[]},{"text":"异度之刃2，无论是counterattack还是drifting soul，one last you都是百听不腻，除此之外各国的背景bgm也都是印象深刻。我相信初次体验这部作品的，一定会有着这游戏音乐已经堆砌到了一种近乎奢侈的程度的感觉了，随便一地的日夜bgm展示当地风土人情，随便一场景的剧情bgm体现人物的心境变化，还有那霸道热血到不讲道理的反击神曲，实在是太棒了。\n除此之外，异度1,异度3，p4,p5的音乐也都极为出色，从ost里面随便点开一首都是享受","children":[]},{"text":"最终幻想14，绝神兵本体开场到3运结束，BGM和BOSS机制音效的融合堪称完美","children":[]},{"text":"对于我这个铁血魂小将来说，我最喜欢听的是只狼的音乐，尤其樱龙的boss战BGM我至今难忘。\n最经典的是魂三，boss战BGM普遍恢宏大气。","children":[]},{"text":"极乐迪斯科吧大概，不列颠海力量太迷人了。","children":[]},{"text":"原神。单拿一两张专辑的话还不好说，可能是巫师三，可能是大逆转裁判，可能是雷逆，问题是原神能出几十张，而且质量还有保障，哈人。","children":[]},{"text":"好不好听不好说，但是有几个印象很深刻的。Ac2的ezio's family，当年爬上俯瞰点配合这个主题曲，鸡皮疙瘩都起来了。还有ff14一个一片白的副本的bgm，好像叫死亡大地永恒焦土啥的，我退坑好多年了一直记着。再就是素晴日的一个bgm，应该是夜晚的向日葵，这个不知道是原创还是改编，恬淡的钢琴曲和游戏剧情有一种微妙的和谐感。","children":[]},{"text":"废墟图书馆楼层解放战的bgm真的好听，还有红姐的电吉他，邵的铁莲华","children":[]},{"text":"魔兽世界，\n哪怕是我已经退坑了，也经常单独在播放器上找wow音乐听的程度。\n\n香草时代的狮王之傲、暴风城，\n燃烧的远征版本的卡拉赞，\n巫妖王之怒的风暴峭壁、嚎风峡湾，\n熊猫人之谜的风暴烈酒、雷电之王、潘达利亚之心，\n德拉诺之王的影月谷、塔拉多，\n军团再临的风暴峡湾，\n争霸艾泽拉斯的赞达拉之力、大海之傲、自由镇\n\n我尤其喜欢的还是赞达拉之力","children":[]},{"text":"t0(整体完美契合场景，几乎每一首都很好听，艺术品级享受):北欧女神1 恶魔城月下夜想曲 八方旅人 魔塔大陆2-3-1\nt1(整体契合度高，好听的曲子比例高):格兰蒂亚2 仙境传说 洛奇 ff14 尼尔2\n\n排名分先后","children":[]},{"text":"ori\n主要是跟游戏场景配合的特别好，特别是银之树那里，伴随着音乐的节奏冲出树的一刻真的久久不能平静","children":[]},{"text":"fgo，音乐喜欢的是咕哒咕哒系列的主题曲\n杀生院boss战的音乐诡异感，星辰诞生之刻配合剧情简直无敌","children":[]},{"text":"文明5，当然是要配合游戏本身内容，突出了音乐的大气磅礴和人类史实感","children":[]},{"text":"尼尔完全形态的音乐才是尼尔系列最开始给我震撼的，比如里面的魔王","children":[]},{"text":"冒险岛原神真三国无双7，主打的就是一个在非国风游戏里找国风","children":[]},{"text":"死亡搁浅\nxb2\n这俩是我唯一打完游戏之后还收藏了OST天天听的","children":[]},{"text":"印象最深刻的那还得是空洞骑士\n其他的游戏在我这大概都是只有那么几首印象比较深，空洞属于是每首都在DNA里","children":[]},{"text":"信赖铃音 肖邦怼脸\n魔塔大陆2 志方晶大战霜月遥\n勇气默示录 revo最好的ost，最还原古典jrpg音乐醍醐味的bgm","children":[]},{"text":"喜欢光荣家的无双系列和大航海系列，\n大航海早期菅野洋子，到大4高木庸旬，再到大OL岩崎琢和三宅一德，都喜欢。\n\n卡普空家的逆转裁判。\n先是逆1+幽灵诡计的杉森雅和，再是逆3岩垂德行，逆转4堀山俊彦，再到雷逆大逆的北川保昌+前马宏充。\n\nKONAMI家曾经的矩形波，\n尤其是恶魔城系列，山根大妈一直到精神续作血污的曲子。\n\n五星顶级家的雷顿。\n西浦智仁写下我最喜欢的雷顿主题曲。\n\nSE家，最终幻想14，祖坚。\n八方旅人，西木康智。这人有点东西。\n\nAtlus，P345，目黑将司。\n\n法老控，在他家作曲还超级强的年代，双星物语。\n\n任天堂，马车8，大乱斗remix全明星，喷喷也不错。\n\n这些都是会没事拿出来听的。","children":[]},{"text":"提一个伊苏起源\n尼尔和更之前的龙背都可以说是横尾为了音乐这碟醋包的游戏这盘饺子，质量确实高","children":[]},{"text":"undertale吧，真的可以无脑循环不腻而且偶尔想回头听的\n大众一点的话是剪纸马里奥很震惊般的好听，而且和历代马里奥有种不一样的感觉，很抓耳","children":[]},{"text":"节奏天国，比较新的就节奏医生吧\n好听耐听，音乐、画面表现和游玩浑然一体\n可惜还是冷门和制作难度大吧","children":[]},{"text":"回忆加成的话，魂斗罗1、赤影战士、星际魂斗罗Journey to Silius，都是最好的。\nWOW、EVE、老滚5，配乐还经常拿出来听，玩的爽的时候感觉不到存在，但感受到的时候又觉得是这音乐真是神作！","children":[]},{"text":"单论情怀的话，是冒险岛。冒险岛时间神殿系列的曲子可以说真的完美描述了我在这个游戏里十年的感受\n\n原神无论是每个区域的主题曲还是每个区域里小村子的曲子都什么精彩","children":[]},{"text":"最喜欢的可能是血源老驴的曲子\n不过印象最深刻的，应该是FF7re的hollow。\n40个小时的流程有15小时都在听这个悲伤の小曲的变奏 ，\n再到终章情感爆发挣脱命运枷锁，原曲意境也赫然揭示","children":[]},{"text":"P5的咖啡馆BGM，P4的逛街曲，属于是能无限循环当工作或者读书背景音用的","children":[]},{"text":"法老控老作品音乐都不错，伊苏起源、空轨、卡卡布三部曲，毕竟当年连新海诚这样的人才都有。\n\n黑魂3、法环的音乐让人印象深刻，比如法环晚上遇险的bgm。\n\nGalgame也有很多厉害的，比如舞姬、clannad。","children":[]},{"text":"奥比岛吧\n虽然不是原创音乐\n\n但全都是网易云999+甚至10w+的经典纯音乐含金量毋庸置疑","children":[]},{"text":"水月陵的恋x，松本文纪的樱之诗，忍的樱摸鱼，天门的eden*","children":[]},{"text":"单论一部作品的话那可太多了，不如说只要是配被人记住姓名的日厂，有哪一个是音乐做得差的么\n但要说全系列都优秀无一失分，连最严苛的遗老都不会在这一点上给新作挑刺的水平的话，我提名皇牌空战系列","children":[]},{"text":"动物园之星的《两只火烈鸟》和《水牛奥德赛》很好听！非常悠闲的曲子，让人想起动物园里的旅游巴士。\n第一次被游戏bgm惊艳到是弹丸论破的学级裁判，几个变奏版本都很有“燃起来了”的感觉。\n要说ff14的话，我最喜欢的是海都白天的bgm《伟大的母港》，刚到那个地图的时候刚好是早上，看着太阳随bgm的号角声一起升起，感动到想哭……\n也很喜欢湖区的《盐与苦难之歌》，厚重古老又带着雄壮激昂的斗争感，我会在城门上坐一整天听这首曲子。","children":[]},{"text":"文无第一\n塞壬唱片MSR\n不过就玩过的两款MMORPG而言，\nff14的副本音乐得益于他的战斗风格，会让战斗流程变得像舞台剧但他野外的背景音效有时会体感很差，我点名批评6.0做完主线之后的close in distance，有歌词的歌循环播放不适合做背景音，搁哪挖矿呢挖的耳朵起茧子\nWOW的音乐更适合做野外背景音效，各个主城音乐风格多样，点名表扬暴风城，达拉然，伯拉勒斯，达纳苏斯(因为我没玩过bl)","children":[]},{"text":"个人最早被震撼到的是使命召唤现代战争2\n汉斯季默做的配乐\n当时震撼到我的不仅仅是配乐\n还有电影化的叙事和运镜 原来游戏还能这样做的\n确实大受震撼","children":[]},{"text":"巫师三，到了史凯利格岛，bgm绝了","children":[{"role":"作者","text":"再补充一个，刺客信条黑旗，看起来是因为我比较喜欢开船"}]},{"text":"图书馆，乐团战的bgm属实是神中神，神性界的现在都还在时不时拿出来听","children":[]},{"text":"没有最好，不过这辈子都会记住的或许只有时空之轮","children":[]},{"text":"跑跑卡丁车的赛道bgm不止好听，还很契合每个赛道的主题风格，nexon真不如去做个音乐厂得了","children":[]},{"text":"红警三。\n随着对战优势均势劣势，三大阵营都有各自的BGM。许多地图的BGM也很好听，雪地，海参崴，浮岛要塞。\n甩了人家超武还能给人强制切个抖腿BGM真的超酷好吧在专辑里看BGM的名字还都叫QNMD真的笑死。\n\n苏的胜利音乐还被舍得酒拿来做广告了","children":[]},{"text":"兰斯10，血之记忆和Majin-Boss作为战斗音乐都很不错，煽情方面也有泪雨和甜言蜜语，上过cctv的含金量","children":[]},{"text":"孤岛惊魂5的bgm除了only you","children":[]},{"text":"大表哥2\n帮派一子排开救孩子\n刚从海岛回来的骑马回家\n最后一战道别结束带上帽子\n……\n记忆犹新  \n\n怪猎世界\n据点BGM跟任务结算BGM一听到就有种穿越的感觉\n\nhifi rush\n鼓点太带感了根本停不下来，连击和弦的存在所以不会单调\n\nApex\n原版跳伞BGM入耳还是会有鸡皮疙瘩起来\n\n跑跑卡丁车\n圣诞冰雪图BGM是个人觉得最好听的圣诞改编\n几个经典主题的BGM也是能勾起回忆","children":[]},{"text":"我觉得但凡不错的游戏音乐基本都不会太差，只不过好的方向不一样。\n比如作曲能力很强，质量也高的，ff14(其实应该说所有的最终幻想)、八方旅人、怪猎，小一点的ut、ebf5、酒保行动、图书馆、omori、杀戮尖塔等等等等……尤其杀戮尖塔，我倒是很好奇这些独立游戏的音乐倒是怎么做的反而都不错。\n有个例外是神之天平，这游戏曲子基本没有自己做的，但是作者选曲能力非常强，用的场合也不突兀，老实说还蛮稀罕的。","children":[]},{"text":"最好听的一首歌我不会在p5里面选，但音乐最好的游戏我会选p5","children":[]},{"text":"p系列吧，非音游的游戏里音乐要素如此突出但又不喧宾夺主，我玩的所有游戏里只有p系列能做得到","children":[]},{"text":"传说之下，植物大战僵尸，魔兽。\n\n其实好玩的游戏一般音乐都和游戏本身很契合很不错，但给人一直有印象的就更厉害了，植物大战僵尸确实算是经典永流传了","children":[]},{"text":"冒险岛 我可以在射手村 魔法密林挂机听一整天的bgm","children":[]},{"text":"神之天平东京和故乡的bgm，这游戏选曲也是是一绝，免费素材也能达到这么好的效果。","children":[]},{"text":"魔！兽！世！界！\n我永远记得第一次踏入暴风城时的震撼 \n还有第一次听到伯拉勒斯的曲子…","children":[]}]},{"title":"哪一首歌能让你一听就梦回2000年左右？","body":"哪首歌一响起，会让你瞬间感觉回到了2000年左右？","replies":[{"text":"相约98","children":[]},{"text":"2002年的第一场雪","children":[]},{"text":"爱真的需要勇气，来面对流言蜚语","children":[{"role":"回应者","text":"不是面对六眼飞鱼吗"}]},{"text":"动画片宝莲灯那几首歌，想你的365天，爱就一个字","c 吃就不要怕被人追杀","children":[]},{"text":"人类不是一开始就站在食物链顶端的，人类的先祖也是一路被吃过来的，顺便还可以反问“人可以不止吃羊，你们是只吃人么？”或者“我们不吃羊，你们不吃我，可以吗”","children":[]},{"text":"牛为了自保可以顶死狮子，我为了不被吃打死你不也是天经地义？","children":[]},{"text":"食物链的结构本质是循环而不是链条，上层的动物死亡后作为底层微生物的营养进入下一轮循环，不死的妖怪能循环个屁。","children":[]},{"text":"老虎吃人，人也能拿老虎骨头泡酒，还不是谁拳头大谁就有得吃，说个屁天经地义，看剑","children":[]},{"text":"人和妖就不是羊和草的差距啊，更应该算狼和老虎的竞争关系，谁吃谁都正常","children":[]},{"text":"雷禅都能不吃，你就没点志气？","children":[]},{"text":"弱肉强食这一套用在有文明的智慧生命上，就是纯把自己贬低为畜牲，他都骂自己是畜牲了你还反驳他干啥。","children":[]},{"text":"弱肉强食，但是人类能干翻妖就说明妖并不强，那还吃个屁","children":[]},{"text":"人吃草，人吃羊，人吃妖，食材还敢反了，用法术烹饪一下就安静了","children":[]},{"text":"端木将军有云：我懒得和你讲道理，你不配听","children":[]},{"text":"布莱泽奥特曼：无论是牛羊还是狮虎甚至怪兽，在最后一刻到来时都会挣扎着想要活下去","children":[]},{"text":"你还不准食物反抗了，过年杀年猪都要好几个壮汉摁着呢","children":[]},{"text":"食物链上面如果出现了两种智慧生命，那就是野蛮的、未开化的。食物链上层往往是肉食类的杂食动物，是杂食就没有非要吃智慧生物的理由吧，人类可以吃人类的肉，就必须得吃吗","children":[]},{"text":"都是凭本事吃饭，但羊一角顶死狮子老虎也不是没有","children":[]},{"text":"大象吃草，大象也能轻松踩死狮子鳄鱼","children":[]},{"text":"妖吃人没问题啊，我人吃妖也没问题。谁拳头大谁说的算呗。","children":[]},{"text":"食物链是打出来的，又不是天生的……有被毒死的羊，有被顶死的人，那也应该有被打死的妖。","children":[]},{"text":"以生态学知识而言，妖不存在也不会影响生态平衡，所以妖吃人并不是必要存在的。","children":[]},{"text":"你吃人天经地义，所以人打死你甚至主动打死你来保护未来可能被你杀死的同类也是天经地义，你吃不着被饿死更是天经地义，这个论点纯属给人类递刀的","children":[]},{"text":"既然我的道理在你这儿说不通，那么就按你的道理来：我比你强，所以我杀你，天经地义","children":[]},{"text":"你说得对，所以为了活命我要杀了你！","children":[]},{"text":"被水牛角马顶死的狮子老虎多了去了，你有本事吃我，还不允许我为了活命反杀么？再说食物链这东西又不是定死的，我的物种武力大于你的物种后就是我的生态位更高了","children":[]},{"text":"喜欢玩丛林法则那被人杀妖取丹不也是天经地义的事情，弱肉强食嘛，不会真以为自己永远是强的那一方吧","children":[]},{"text":"凭本事吃肉，凭本事反杀呗，狼吃羊被顶伤感染死掉的也不是没有。","children":[]},{"text":"弱肉强食，等下被打死了别狗叫嗷","children":[]},{"text":"食物链也是各凭本事的，没有什么人就活该被妖吃的道理。狮子吃牛还有被顶死的时候，说白了食物链里捕猎者和被捕猎者都是要拼命的，双方无分贵贱根本没什么“天经地义”，都是尽全力挣扎求生。如果要套他这层妖吃人天经地义，则人为了不被吃拼尽全力反杀妖也是天经地义，想要嘴遁让人放弃抵抗，才真违反了他的道理。往更本源一点的地方说，人的尊严高于一切，践踏他人尊严，剥夺他人主题思维，自我选择自我判断的权力放在任何道德体系下都是恶，古今中外所有的反派言论无不归束于此。他这套理论就是强迫你放弃抵抗放弃人的尊严，不管看似多么“自洽”，哪怕这个世界观里真的有天王老子定了一条“人必须被妖吃”的法则，只要你是被强迫的一方，你自然有充分的理由反抗。","children":[]},{"text":"吃的时候会不会被反咬一口缺胳膊少腿那就全看本事了，这点对 是桂雏菊没人喜欢会长么","children":[]},{"text":"可以选vtb吗，我要阿夸","children":[]},{"text":"果然是时代的眼泪了吗，当年娶妻当娶樱庭葵，生女当如泉此方都没人提了\n青出于蓝里面的大小姐，标准的大和抚子","children":[]},{"text":"当然是凉宫春日了啊","children":[]},{"text":"唯一指定四季夏目","children":[]}]},{"title":"南大碎尸案最可能的动机是什么","body":"你觉得南大碎尸案最有可能的杀人动机是什么？","replies":[{"text":"心理变态，一般人谁这么搞，","children":[]},{"text":"我个人猜测是性侵成功了 凶手怕留下液体生物信息 才会采取这样的手段 目的是让警方查无可查","children":[{"role":"回应者","text":"尊重死者，这个受害者就是平时那种假小子的打扮，这种被性侵的概率几乎为0。 警方报告也有，几乎可以断定没有性侵的痕迹。"},{"role":"作者","text":"警方并没有通报受害者是否遭遇过性侵 没有明确说明没有被性侵 也没有说明被性侵 年轻的女大学生 深夜独行走 这两点就符合遭遇过性侵的条件 当年是重点排查过独居单男这些人的"}]},{"text":"激情杀人吧。","children":[]},{"text":"一定是兴趣爱好。","children":[]},{"text":"还有一种反向说法，车豁意外，肇事者是木工","children":[]},{"text":"经过多年思考，动机可能是为了研究人体骨骼肌肉血管等。按这个动机推理，可能是美术雕塑类大四生，为了毕业作品蓄谋已久精心计划。作案手法很像在做一份作品或者一幅画。类比过一些碎尸案，这个案子很像有艺术气质的神经病人做的。再接着推理，搜一下当时南大附近院校，有没有当年的毕业美术类作品出现。作者或者家人可以查一查。","children":[{"role":"回应者","text":"所见略同，常规思路都是怀疑医生或者屠夫，但是学艺术的也会研究人体构造，而且像雕塑类专业，他们也是有条件获得作案工具的。不知道南大当年有没有开设雕塑专业，或者当年案发地附近有没有其他艺术类院校"}]},{"text":"反社会或精神疾病之类的的凶手概率大","children":[]},{"text":"真可能是一时兴起。","children":[]},{"text":"随机 反社会","children":[]},{"text":"公开卷宗没披露动机，谁说自己是推理都是在猜。真要挑一个最不离谱的：跟死者大概率不认识、临时起意，分尸纯粹是为了毁尸灭迹拖时间，不是仪式也不是炫技——因为手法太家常了，煮熟切小块扔垃圾点，这是怕臭怕被人认出来，不是变态审美。至于为什么偏偏是她，可能连凶手自己都说不清，一句酒后的话就动手了。这案子卡住的从来不是动机，是第一现场和检材都没有。","children":[]},{"text":"就是简单的强奸杀人案，为了掩盖罪行杀人碎尸","children":[]},{"text":"罪犯有心理问题，基于某个原因成功引诱了被害人，就像在艺术创作一样杀害了她。","children":[]},{"text":"如果是社会闲散人员老光棍能有这么牛逼的作案手法？这也不太可能啊。我还是倾向于熟人嫉妒作案而并非性侵","children":[{"role":"回应者","text":"毕竟悬案，这些都没法证实或证伪了"}]},{"text":"美国 日本 韩国 的重大连环杀人案 都是长期 无动机，无固定目标。有的几件犯一次 有的间隔10年 再犯。 南大这种 像拿她来练练手，顺便挑衅jc 挑衅社会。","children":[]},{"text":"应该不是心理变态，心理变态一般应该连环作案。应该是图钱或者色，临时起意","children":[{"role":"回应者","text":"也可能改变作案手法了，毕竟花挺多时间处理尸体，在这么玩保不齐失手被人看到。"}]},{"text":"有可能就是崇拜汉尼拔之类的心理变态，随机找目标满足心理上的快感，而没有再次作案的原因有可能是死了或者因为影响太大选择出国等等。","children":[]},{"text":"最有可能的杀人动机就是没动机，就是刚好赶巧了，随机选到她，那个年代基本没有监控，只能从周边关系调查，如果两个人完全不认识，搜查就跟大海捞针一样","children":[]},{"text":"祭献，或者纯粹就是杀人","children":[]},{"text":"变态杀人犯或者说反社会人格，杀人是不需要理由的，这也就是为什么这种罪犯难抓","children":[]},{"text":"杀人动机很多也未必有意义，这个案子要深究的是分尸动机。分尸无外乎便于抛尸，藏匿身份，藏匿证据。化整为零，说明凶手居住地区不便于搬运尸体，同时也不便于长时间存放尸体，可以推定居住在室内、有邻居甚至有家人；藏匿身份为了掩盖受害者真实信息，避免产生关联，但这个按后期抛尸的地点和分尸手段来说，凶手丝毫没有想将此事掩盖的想法；藏匿证据，分得细，是不是就可以把某些特殊部位浑水摸鱼移去，办案人员会觉得可能是切的碎，抛的过程中找不到了，甚至便于彻底销毁，比如煎炒烹炸。那么这些细小的部位，无外乎指甲、皮肤或者一些器官，有可能的是凶手的皮屑、jy、早期胚胎或者小面积的纹身。这其中之一应该是案件的突破口","children":[{"role":"回应者","text":"我个人觉得不是在出租屋或者小区之类的居住地处理的 因为要把人拖到高层 很容易露馅 居住的人越多越容易露馅  有家人就更不可能的 能做这种事的人心理素质绝对是异常强大的 这种人绝对是百无一的 这种人同时出现在同一家当中的概率极低 几乎不可能的"}]},{"text":"我看了一本小说，有以这个案子为原型的，说是一个雕塑家，把人碎尸了找灵感，然后把内脏放到他要做的雕塑里面","children":[]},{"text":"有一些人是纯粹的恶意 就是单纯想杀人","children":[{"role":"回应者","text":"没人会这么做 除非是有这么癖好的人 但有这癖好的人绝无可能只做一起案 要么0次要么无数次 但三十年过去了 并没有第二起 这说明并非是有预谋的 而是一场意外"}]},{"text":"认错人了","children":[]},{"text":"我觉得就是陌生人作案，大概率还是有点专业能力但是内心阴暗的人，玩英雄联盟这个破游戏，我感觉人对陌生人的恶意很大，越是不认识的越是肆无忌惮攻击侮辱谩骂，完全没有心理负担的。","children":[]},{"text":"美国样本比较多，随机杀人，这种人有反社会人格，不是仇杀，情杀，之类的杀人动机。而是他就喜欢享受杀人的乐趣。咱们国内有一个鸵鸟肉案，真的是夸张。或者是生长环境使然，没有三观，内心不知道什么是道德，什么是生命。德州著名的农场，他把他妈挖出来了，做成人皮，然后又把其他人杀了做人皮，还自己穿。被警察抓到了以后，都不知道自己因为什么犯罪了。那是真离谱。\n所以教育和道德教育真的很重要，除非先天反社会人格。根本找不到动机","children":[]},{"text":"对凶手来说，他必须杀死刁，难就难在一个人际关系并不复杂且没有什么钱的女大学生，到底会因为什么理由被杀。凶案三大动机:情杀，仇杀，财杀，后两者都不符合，按照当时警方的梳理，情杀也找不到关联人物，加上缺失第一现场，这就让案件调查根本无法推动下去。当然还有另一种可能，刁的死是一场意外，被碎尸只是这场意外的另一方为掩盖意外而采用的方法。","children":[]},{"text":"在我看来有两种可能性最大：\n1.林某，理由——在南京方圆4平方公里内，同时有两个超级心理变态是小概率事件。参考林某后续生平，连杀2任老婆的过程：\na.杀头妻，瑞典人，让女秘书订机票，伙同一个高大东北籍男子，先杀妻子楼下邻居（华裔），鸠占鹊巢，蹲点数日，杀妻夺子回国。变态细节1：大卸八块*2，邻居老头被拆卸后直埋花园。变态细节2：高大东北籍男子人间失踪，生死不知\nb.杀二妻，溺死泰国游泳池。变态细节：这个二婚老婆就是订机票的女秘书。\n\n2.间谍所为，理由：上下线断联，底层间谍无法通知高级内奸，为阻止高层内奸赴南京交换情报被捉，故意制造恶性案件——让南京城开展大排查，交换情报的地点被管控，内奸自然就不会落网。\n\n因为事发地点是敏感区域，教科文/军属大院/闹市，囼巴走狗容易隐藏和交易情报之所。","children":[]},{"text":"应该是变态心理，此人肯定接触过一些邪教或者冷门教派的东西。","children":[]},{"text":"那个年代落单女性被害，十有八九是强奸杀人","children":[{"role":"回应者","text":"那个年代强奸杀人案太多了 只不过这个案子太极端了"}]},{"text":"受害者性格内向，没有交际，刚去读书几个月，跟人结仇的概率极低，她家里很穷，没钱，财杀的概率也极低，如果是遭遇抢劫，肯定是抢了就跑，更不可能把人杀了还切成几千块，情杀也不太可能，真谈恋爱啥的，她肯定会经常外出啥的，她的室友同学那些人肯定会多多少少知道一点，但是经过调查并没有任何一点点信息是关于爱情之类有关的，我猜测大概率是一场意外吧！但是究竟因为什么原因才导致这场悲剧的发生就让人捉摸不透了，唯一能想到的只能是女大学生深夜独行遭遇流氓了……","children":[{"role":"回应者","text":"流氓应该没有这么缜密的心思，我觉得情杀偏多。说不定是某个暗恋者"}]},{"text":"有没有可能分尸并不能代表凶手是变态呢，也许就是有这个职业技能，外加激情杀人","children":[{"role":"回应者","text":"三十年过去了 没有第二个这种案件 说明凶手并非是有这方面的癖好 所以大概率是个意外"}]},{"text":"纯瘾大","children":[{"role":"回应者","text":"不是，如果作案人有这种癖好，那不可能只犯一次案。"}]},{"text":"这类犯罪大概率是有瘾的，控制不住再犯，我也觉得是意外，比如被一个二代在地下酒吧失手掐死？比如在某条偏僻马路被车撞死？但是这个人背后有个高人，比如他爸爸如果是个警察，为了保护自己的儿子，通过这样的手法掩盖真实的死法，让人往变态杀人狂方向查，但是实际这就是最简单的意外，所以人际关系肯定排查不出来，然后分尸和真正害人性命的地点和人物是分开的，也方便躲避侦查！","children":[]},{"text":"甚至是囚禁过程中的意外死亡。受害人不是失踪后立即死亡的。存活了几天，腹内无食物，但饮用过水。","children":[]},{"text":"同性恋，邪教仪式，sm可能性是最大的几个。","children":[]},{"text":"我觉得是死者当天不舒服，冬天感冒或者女生姨妈期很正常，去一个小诊所看病，当时那年代赤脚医生和黑诊所多，为了赚钱都说二话不说就打吊针，药的问题或者是没做过敏测试，结果出事了，分尸抛尸，这个一定是有医学经验的人分的，厨师做不了这么细","children":[{"role":"回应者","text":"你感冒或者来姨妈去诊所吗"},{"role":"作者","text":"感冒不去诊所去哪儿"}]},{"text":"可能是讨厌这种中性人","children":[]},{"text":"有很多时候估计都没有杀人动机，可能某些自卑男因为自尊心膨胀就会杀人","children":[]},{"text":"说不定就是得了某种绝症，然后封建迷信啥的，尸块不是还被烹煮过吗，哎，如果是这种人应该早死了","children":[]},{"text":"情杀，可能是单方面纠缠","children":[]},{"text":"我个人更倾向于无目的的报复性杀人，就是在别的地方收到了侮辱或者气愤，随机报复性杀人虐尸","children":[]},{"text":"有个想法不知道成不成立，这个凶手知道自己命不久矣，不管是得绝症或者是什么，在临死之前想要报复社会随机杀人来满足自己的变态欲望，作案后不久就去世了","children":[{"role":"回应者","text":"我觉得临时起意的可能性大，杀完了可能想了下怎么处理，最后想出分尸这个方法"}]},{"text":"最大嫌疑就是小餐馆，他们动机就是卖肉，然后切好之后发现变味或者不对，就扔垃圾桶了","children":[{"role":"回应者","text":"风险和回报不成正比"}]},{"text":"我听过一个说法，说是作案人是邪教或迷信教徒，发现的地点连起来金木水火土啥的。。","children":[]},{"text":"如此平凡的一个人，刚刚去南京人生地不熟、怎么会吸引专业人士去杀？如果有这样的变态，怎么会是孤案？\n\n网上对此案众说纷纭，个人觉得最靠谱的还是讲案自媒体人“江湖李白”推测的最靠谱，刁爱青是偷偷帮孤寡老人做好人好事时被杀的，所以没人知道她去哪～","children":[]},{"text":"南京也是个烤鸭很出名的地方，也不排除拿人练手的可能","children":[]},{"text":"我个人的分析 目前主流推测从未分析过的\n\n已知：96年，南大成人教育脱产专科，学费+住宿+生活费一年预计3000元左右。\n家庭情况：普通苏北农村家庭收入。\n刁爱青差3分进入南大，不愿上普通大学，脱产专科名额有限，系其姐姐、姐夫以及姐姐准公公托关系拿到名额进入南大。\n姐夫家庭情况：供销社，经商，有一定社会能力与关系。\n\n主流推测：医生/法医/屠夫等等，均已排查且未发现。\n此类人员身份特征明显，职业习惯突出，且自身职业气味明显，难以掩盖。\n\n第一现场：至今未明确第一现场。\n\n作案动机：至今未明确作案动机，并且目前的推测以及所有推测方向均未指向敲诈一类，报复一类。\n\n本人推测动机：\n\n1.知晓其如何来南大上学，能每年支出3000元左右用于学习，知晓其姐夫家庭条件，因禁（止）刁爱青进行敲诈，死者死前未进食，少量水分，通信手段无，死后只能分尸。推测凶手应与南大有关联，招生办，成人教育机构，或校内外相关人员勾结共同作案。\n\n2.报复，从未提起，托关系拿到名额，那被挤下去的名额？96年南大，虽不是本科，但那个年，农村人一家子的托举希望？","children":[]},{"text":"我看凶手并不是什么心理变态 有人说这个案子最难破的点就是凶手不是重复作案 这就不难理解了 凶手就是见色起意 然后就是实施犯罪 至于侵犯了没不清楚 但能确定的是他在这个过程中可能把受害人误杀了 然后他很明显是怕了 把st剁成那么多块 可能单纯是想让办案人员找不到证据 网上把这个案子传的很神 其实就是误杀碎s 破不了大概率是因为当时刑侦手段不是特别先进 再一个就是找不到第一案发现场","children":[]},{"text":"嫉妒","children":[]},{"text":"杀人无非四种：仇杀、情杀、钱杀、随机杀，先去除仇杀和钱杀，大概率不是情杀，所以应该是倒霉遇到了个变态的随机杀，这是最不好破的","children":[]}]},{"title":"有哪些误导性强的作品名","body":"有哪些作品的名字容易让人误解？","replies":[{"text":"斩赤瞳\n\n想到个伊桑霍克主要的，变种异煞实际是非常励志电影，原片名称是Gattaca 碱基序列\n\n还有很出名的刺激1995","children":[]},{"text":"肖申克的救赎","children":[{"role":"回应者","text":"肖申克救赎日版翻译的好点(不过日本大都是假名直接翻译英语)，向着肖申克的天空(shawshankの空に)，很容易联想到剧中red的经典台词，有些鸟儿是关不住的，它们每一片羽毛散发出自由的光辉。"}]},{"text":"《紫罗兰永恒花园》这个译名，感觉说实话。。不如音译","children":[{"role":"回应者","text":"音译就没人看了，起不到宣传效果。"}]},{"text":"没人记得古老节奏\n青春波纹么","children":[{"role":"回应者","text":"高校舰队\n当初是一集下架还是两集下架来着"}]},{"text":"我想吃掉你的胰脏","children":[{"role":"回应者","text":"我看到这个名字第一反应就是猎奇番。直接就不想看了"}]},{"text":"乌克兰拖拉机简史\n禅与摩托车修理艺术\n钢铁是怎样炼成的\n十又二分之一章世界史\n制服诱惑","children":[{"role":"回应者","text":"我倒觉得钢铁是怎样炼成的取得很好，首先是直接化用原文里保尔(大概是)和同志沟通时说的“钢铁就是这样炼成的”，其次确实也暗示了革命道路会洗刷不坚定分子(保尔的初恋冬妮娅)，让纯粹的革命家更加坚定。\n而且把革命者比喻成钢铁不也是一件很浪漫的比喻吗？(个人觉得)"},{"role":"作者","text":"我也知道保尔被比作钢铁，问题是这书名乍一看就是技术手册啊"}]},{"text":"无头骑士异闻录：\n\n虽然看过的人能明白这个标题，但是没看过的人估计真的很难把标题和真正的风格联想在一起。\n我当年真的以为它是讲西方骑士的奇幻故事。\n\n多罗罗：和塞尔达同理。\n男主：我他妈叫百鬼丸。","children":[{"role":"回应者","text":"好的多罗罗。知道了多罗罗"}]},{"text":"釜山行(听起来像家庭旅游公路片)\n\n失忆症:暗黑后裔(听起来像欧美RPG)\n\n机动警察:十三号废弃物(有怪兽，但只有五分钟；有萝蔔，但只有一分钟。)","children":[]},{"text":"月刊少女野崎君也挺误导的","children":[{"role":"回应者","text":"我一直在想是不是翻译错了，应该是《少女月刊野崎君》才对吧"}]},{"text":"七魔剑支配天下\n听名字以为是仙侠网文结果是个邪道版哈利波特","children":[]},{"text":"科学小飞侠一点都不科学也不飞侠","children":[]},{"text":"樱花庄的宠物女孩算吗？\n毕竟宠物女孩听起来是里番剧情","children":[]},{"text":"龙与虎  ，第一反应我还以为是日本黑帮向","children":[{"role":"回应者","text":"然而真有个日本黑帮剧虎与龙"}]},{"text":"happy sugar life谁能想到呢","children":[]},{"text":"魔法少女小圆","children":[{"role":"回应者","text":"魔法少女小圆我一开始真以为是小樱那种，有一个萌萌哒的小可陪着"}]},{"text":"闻香识女人，其实是一个小帅哥和一个老帅哥互相帮助对方解决人生问题的故事","children":[]},{"text":"剪刀男，然而凶手是女人","children":[]},{"text":"死亡诗社，我还以为是恐怖片，没想到是讲教育的","children":[{"role":"回应者","text":"它还有个名字叫春风化雨"}]},{"text":"千钧一发，看名字是不是感觉跟 《飓风营救》《谍影重重》一样是个紧张刺激的动作片？然而是个科幻+哲学的片","children":[{"role":"回应者","text":"《千钧一发》这个译名更恰当一点，毕竟一向小心谨慎的男主就是因为一根眼睫毛卷入了谋杀案。"}]},{"text":"电锯惊魂，我开始以为是和类似《德州电锯杀人狂》这种以电锯为作案工具的惊悚电影，但是全篇没出现过一次，翻译真的要背大锅。","children":[]},{"text":"科学小飞侠crowds，可以说和远古的小飞侠没有半毛钱关系，明明是剧情优秀的正剧，龙之子这个纪念作嗯贴小飞侠的名字，整的跟子供作一样好难安利","children":[]},{"text":"交响诗篇","children":[{"role":"回应者","text":"这个是直译啊，原名就叫交響詩篇エウレカセブン。"}]},{"text":"纯洁轮舞曲","children":[{"role":"回应者","text":"严格来说“纯洁的轮舞曲”是副标题，那作品叫“オトメドリ”。"}]},{"text":"终物语 根本没完好不 结物语都完结不了","children":[]},{"text":"搏击俱乐部 一开始以为是单纯的热血格斗片，看榜单推荐才知道题材不是这个","children":[]},{"text":"复仇者联盟，第一次看的时候真以为是反派","children":[]},{"text":"《家庭教师》，从日常篇结束到尾都在黑手党和打架，你们什么时候开始读书啊？？？","children":[{"role":"回应者","text":"但家教全名是《家庭教師ヒットマンREBORN!》《家庭教師HITMAN REBORN》=《家庭教師殺手REBORN》\n殺手就大剌剌寫在標題上然而\n家庭教師REBORN=家庭教師=家教"},{"role":"作者","text":"emmm…台湾翻译的时候吧杀手二字和谐了，那确实不是原名误导而是译名误导。但大家既然也回答译名而非原名，我觉得我不算跑题。"}]},{"text":"《女仆咖啡厅》\n明明人家有一个《即使如此小镇依然转动》这么高逼格的直译原名","children":[]},{"text":"剑风传奇，我寻思按封面直译成狂战士或者是狂战传奇不比你这个贴合实际？剑风总给我轻飘飘的感觉，搞的我一度以为蛤蜊是主角。","children":[]},{"text":"日在校园","children":[]},{"text":"提名一个《我的诅咒吸血姬》，本来以为是什么典中典的龙傲天漫，结果是男主魅魔漫","children":[]},{"text":"逆袭的夏亚\n声优本人都被骗了","children":[]},{"text":"昆汀的落水狗？看完感觉好像和落水狗没啥关系啊","children":[{"role":"回应者","text":"低俗小说也没人读小说"}]},{"text":"其实塞尔达第一部本来应该叫海拉鲁幻想：塞尔达传说\n结果发行时候出了点啥问题来着被把前面的海拉鲁幻想删掉了\n本来系列名应该叫海拉鲁幻想12345这样的 结果变塞尔达传说了甚至织梦岛根本就没有塞尔达登场","children":[]},{"text":"没人提枪王黑泽吗，这个枪王有点浮夸","children":[]},{"text":"fate stay night以为是菲特今晚你留下","children":[]},{"text":"末日三问吧，看到的时候以为和那个年代的超长标题辣鸡轻小说是一个调调","children":[]},{"text":"魂斗罗啊，这哪个字能看出来是个科幻题材的横版射击了？","children":[]},{"text":"民工女友我给我朋友安利，他说看到民工两个字就没性趣了","children":[]},{"text":"光速蒙面侠21\n看上去像是DC宇宙会有的超级英雄，实际上是讲橄榄球的漫画\n\n真人快打\n因为最初的作品中游戏内角色动作都是采集真人动作的照片，因此得名。实际上真人快打讲的是好几个世界的纠葛，且这部欧美作品其中的男主角是出身少林的中国和尚。","children":[]},{"text":"辛德勒的名单 我一直以为是希特勒的名单，希特勒列的暗杀名单","children":[]},{"text":"三块广告牌，以为是讲广告文学的故事\n利刃出鞘 以为是讲谍战打斗的故事","children":[]},{"text":"红烧天堂，第一眼看见这什么做饭类综艺节目","children":[{"role":"回应者","text":"红烧天堂是民间怪译吧，本名就是英文heaven burns in red，然后民间搞怪翻译成红烧天堂"}]},{"text":"黑客帝国，还不如就直接叫矩阵\n慕名去看完感觉完全被骗了jpg。当然可能是我看的时候现实里已经很多对片里那些东西的讨论了，完全没有新奇感......","children":[]},{"text":"菊次郎的夏天，以为小孩叫菊次郎","children":[{"role":"回应者","text":"就是故意的，最后才说大叔是菊次郎"}]},{"text":"孤岛惊魂\n根据1代背景翻了个孤岛出来，后续作品除了3代都跟孤岛没关系，直译反而是繁中的极地战嚎更贴切\n孤岛危机同理，只有一代是孤岛","children":[]},{"text":"误导性强还得看fc游戏\n以前盗版厂商蹭热度各种译名 飞天魂斗罗 水上魂斗罗\n\n还有忍者神龟7 (魔鬼总动员) 松鼠大战3(霹雳神兵)\n红蜘蛛(最终幻想) 马里奥10代 (成龙之龙)\n60人街霸 啥的","children":[]},{"text":"怎么没有人提奇幻贵公子 这名字对得住他那恐怖的内容吗","children":[]},{"text":"为美好的世界献上祝福！\n我当时以为这是致郁系的","children":[]},{"text":"末日时在干什么？有没有空？可以被拯救么？\n\n当时正流行非常长名字的垃圾轻改，差点被带过去了","children":[]}]}]</script>
<script>
'use strict';
const posts=JSON.parse(document.getElementById('preview-data').textContent);
const titles=document.getElementById('titles'),reader=document.getElementById('reader'),search=document.getElementById('search');
const previous=document.getElementById('previous'),next=document.getElementById('next');
let visible=posts.map((_,index)=>index),active=0;
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function renderTitles(){
 titles.replaceChildren();
 document.getElementById('list-count').textContent=`${visible.length}篇`;
 if(!visible.length){titles.append(node('p','list-empty','没有找到匹配的标题'));return;}
 const fragment=document.createDocumentFragment();
 for(const index of visible){const b=node('button','title-item'+(index===active?' active':''),posts[index].title);b.type='button';b.setAttribute('aria-current',String(index===active));b.addEventListener('click',()=>select(index));fragment.append(b);}
 titles.append(fragment);
}
function renderPost(){
 reader.replaceChildren();
 const position=visible.indexOf(active);
 previous.disabled=position<=0;next.disabled=position<0||position===visible.length-1;
 document.getElementById('position').textContent=position<0?'未找到帖子':`${position+1} / ${visible.length} 篇`;
 if(position<0){reader.append(node('div','empty-reader','换个关键词，看看其他题目。'));return;}
 const post=posts[active],content=node('div','content'),header=node('header','post-header');
 header.append(node('div','topic-label','每日大赛'),node('h1','',post.title),node('p','post-body',post.body));content.append(header);
 const heading=node('h2','replies-heading','回复');heading.append(node('span','',`${post.replies.length}条`));content.append(heading);
 for(const reply of post.replies){
  const article=node('article','reply');article.setAttribute('aria-label','一级评论');article.append(node('p','reply-text',reply.text));
  if(reply.children.length){const children=node('div','children');children.setAttribute('aria-label','子评论');
   for(const child of reply.children){const item=node('div','child');item.append(node('span','child-role'+(child.role==='作者'?' author':''),child.role),node('p','child-text',child.text));children.append(item);}
   article.append(children);
  }
  content.append(article);
 }
 if(!post.replies.length)content.append(node('p','empty-reader','暂无回复'));
 content.append(node('div','endnote','本篇已读到底'));reader.append(content);reader.scrollTop=0;
}
function select(index){active=index;renderTitles();renderPost();}
function step(delta){const position=visible.indexOf(active),target=position+delta;if(target>=0&&target<visible.length){select(visible[target]);titles.querySelector('.active')?.scrollIntoView({block:'nearest'});}}
search.addEventListener('input',()=>{const q=search.value.trim().toLocaleLowerCase();visible=posts.map((_,i)=>i).filter(i=>posts[i].title.toLocaleLowerCase().includes(q));if(!visible.includes(active))active=visible[0]??-1;renderTitles();renderPost();});
previous.addEventListener('click',()=>step(-1));next.addEventListener('click',()=>step(1));
document.addEventListener('keydown',event=>{if(event.target instanceof HTMLInputElement||event.target instanceof HTMLTextAreaElement||event.target.isContentEditable||event.altKey||event.ctrlKey||event.metaKey)return;if(event.key==='ArrowLeft'){event.preventDefault();step(-1);}if(event.key==='ArrowRight'){event.preventDefault();step(1);}});
renderTitles();renderPost();
</script>
</body>
</html>
