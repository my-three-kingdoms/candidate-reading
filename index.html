心思","children":[]},{"text":"羽棘(凯亚\u0026罗莎利亚)\n蒙德四星冰系酒友组，都带着点伤痛的过去，两位私交也算比较好吧，罗莎甚至知道凯亚真的喝醉了是什么样\n请一如既往地共同在阴影中守护蒙德吧","children":[]},{"text":"优菈加莫娜 落魄贵族x穷鬼占星师","children":[]},{"text":"托马和凌华\n忠犬仆人和他守护的大小姐真的很配不是吗","children":[{"role":"回应者","text":"我也\n托马和绫华真的很配！！\n他俩的设定就很经典了！"}]},{"text":"垩砂师徒组，理科生坠入情网故尝试证明","children":[]},{"text":"凝光钟离真的香！\n凝光想抓住钟离弱点，为己所有\n而钟离则是为数不多了解凝光过去穷苦的人\n“无论如何，摩拉总不会嫌多”凝光姐姐你看那里有个人形自走摩拉呢","children":[]},{"text":"申鹤和重云\n我要看重云在野外火气上涌然后申鹤帮他消除火气在送一个人偶倒模给他以防万一啊","children":[]},{"text":"一斗九条 他俩不管是站一起还是当初留言板都好嗑 还有一些奇奇怪怪的般配点 比如都不是人 都是最高 还都是追星族 互相看到对方抱着大立牌可太好笑了","children":[]},{"text":"甘雨烟绯，璃月半仙组\n绫华宵宫，稻妻冰火人\n最后一个拉郎cp公子优菈，看过他俩大招二人转真是念念不忘那披风和头顶标志。","children":[]},{"text":"神子和心海！智力的碰撞，同为智将，想看相爱相杀\n\n心海是真的可爱，而神子又是一个擅长欺负人但又不会让人感到膈应的角色，都是非人身份，都是巫女，都负责管理一个区域，又为同一个国家共事，又都是高智商\n\n算是既有共同话题又能免疫枯燥还能相互提升了吧\n\n将军是什么样的，大蛇生前又是什么样的，大概是她们最乐于讨论的话题了)\n\n虽然双方之前的领导者之间有过那场大难，但只要挖清根源，我相信这两位智者是能尽释前嫌的...","children":[]},{"text":"温迪和魈，花洲夜闻笛，除了剧情中的救赎意味，这俩人一个冷淡严肃一个活泼飘逸，性格碰撞起来也很有火花","children":[]},{"text":"阿贝多×凯亚，或者反过来也行\n一个脖子上有四芒星，一个眼睛里有四芒星。二者还都是既跟坎瑞亚有关联，也身处于西风骑士团的人\n\n阿贝多对凯亚毫无兴趣，画他三笔就完事。\n凯亚却不吝于夸赞阿贝多，甚至言外之意里，有自己也对他心动的意思——虽然凯亚总是喜欢信口胡诌。\n\n他们就算有所交集，也不可能是什么冗长的牵绊。如果有坎瑞亚与蒙德正面冲突的那一天，选择站在蒙德而挥剑指向故国归属的他们，或许会在战场上找到他们之间的默契吧。","children":[]},{"text":"钟离甘雨。有事秘书干，没事……反正加班的是甘雨，老爷子只需要尘世闲游就行了","children":[]},{"text":"心海x八重！\n同为巫女一红一蓝刚好凑cp！\n眼狩令结束后，通过八重堂相识(保不齐是五郎由于一直被调戏所以求助心海？)\n智慧的军师大战坏女人！结合两个人的资料-语音，互相本来也知道对方\n一番斗法难分高下，反倒是彼此惺惺相惜起来，感情逐渐开始变质？\n此时恰逢旅行者又带着雷神(影)出来玩儿，一边是曾经的敌对势力，一边是无数年来自己的眷属\n然而已经步入和平时代的今天……\n她俩只一个眼神似乎就确定了“一起调戏一下这个可爱的神明吧”作战方针？","children":[]},{"text":"钟离温迪，这俩人组合起来真的很搞笑\n还有迪卢克和琴，思来想去这俩人还真的挺搭的，门当户对还都是很负责任的性格，为了守护蒙德能付出一切，还夹着一点前辈文学","children":[]},{"text":"我选白鹭公主和白垩王子\n没别的，称号很配","children":[]},{"text":"感觉八重大人可以在无论任何男女cp中都占据上风“欺负”人。\n\n突然想知道钟离这种外柔内刚的和八重cp会怎么搞，感觉很刺激","children":[]},{"text":"迪卢克和公子。\n原因:\n一个开酒店的老板，一个他乡飘摇的浪子，住店来一杯都是不错的结缘基会！\n另外一个是冷静的火，一个是热情的水，属性互补，可以互帮互助刷圣遗物。\n一个是暗夜英雄，蒙德守护者，一个是家人至上，充当保护者的哥哥，在充当保护者上面，应该有一些共同话语。\n最后，都不缺钱的样子(一个供酒鬼嚯嚯，另一个是岩神的提款机)……","children":[]},{"text":"钟离和魈\n不管是游戏里还是剧情里 我觉得他们都是应该在一起的，体型差yyds，帝君一个手掌的宽度能盖住魈宝整个腰他们真的好般配\n而且我很俗，就喜欢这种救赎向的","children":[]},{"text":"公钟公！\n护浮世一隅的神，成纷争涡源的人。\n就那种凡人和神明、深渊和高天、流水和磐岩；鲸与龙、动与静、冬与春的对比张力当场把我砸得当场坠入深坑。\n\n“云端坠下的神与深渊爬出的人是否能相恋呢？”\n\n问就是他们how pal他们天造地设天生一对……塑料味的主线剧情和立场以及塑料的饭桌相聚饮酒共赏，都不在乎什么风言风语就只是随心而动。\n就是因为好假所以好嗑……我就要看不动的玄岩被激流冲刷开裂，我就要看人用最纯粹的感情与炽烈的血洒神那一身，让祂从此铭记一生。","children":[]},{"text":"琴x优菈(游击队长气势汹汹提着剑去找代理团长)\n一斗x九条(懂不懂追着要街头相扑的含金量啊x不是)\n班尼特x芭芭拉(那每次受伤都是去教堂芭芭拉治愈的吧","children":[]},{"text":"雷神神子，鸣神组yyds\n我的神明，我的殿下，500年的守望","children":[]},{"text":"钟离魈\n魈万叶或万叶魈\n讲真魈和万叶什么时候能认识一下呀","children":[{"role":"回应者","text":"魈和万叶一直都认识(指匹配声优岛崎信长和松冈祯丞)考哥.jpg\n正经来说我也很期待剧情里他俩能互相认识一下，感觉会相处得很不错"}]},{"text":"宵宫和魈。宵宫自来熟嘴像倒豆子一样说个不停，魈接不上话但是听得很入神，结果在旁人看来就是宵宫一个人在说话\n然后两个人一起聊烟花\n宵宫：你看你看，这个烟花炸出来是金鱼形状的哦！金鱼在稻妻可是寓意着balabala……\n魈：弱小，可怜又无助地被揪住拉去看烟花.jpg\n但是看的很开心","children":[]},{"text":"胡桃温迪，问就是姐妹贴贴(x\n蒙璃诗词大赛，谁才是提瓦特最棒的诗人？\n二柱家的调皮闺女遇上酒鬼二叔，会演绎出怎样的家庭荒诞喜剧？\n尘歌壶撩人天花板的恋爱头脑战，谁的情话能击穿对方的装甲？\n来自异乡的风，能否在蝶引下吹向更光亮的地方呢\n\n胡桃和温迪都有着一段比较沉重的往事，胡桃呢比较早熟，参透生死，心境到了很高的地步。而温迪呢，虽然表面不干正事，自由自在，但是就算作为自由之神，就算经历了这么多年，他的心中还是有解不开的心结，当年为了自由而死的少年以及同伴们。\n温迪和胡桃是可以在平时当欢喜冤家，当双方都emo的时候，都能够很好的开导对方，有点相似的灵魂碰到一起的感觉，就很棒","children":[]},{"text":"托马小心着火凯亚小心着凉\n都是在异国混的风生水起但仍会感慨故乡的异乡人，也都喜欢玩钱\n一个热爱小动物心灵手巧一个是蒙德小孩子们喜欢的大哥哥\n而且戴因在托马拾枝杂谈里话锋一转说到如果原本不信仰神明的人又信仰了神，是否也会得到接纳balabala 感觉意有所指","children":[]},{"text":"爷X渊上\n他说他喜欢爷诶！\n他抖M还会设安全词诶！\n他对历史知晓如此之多，给爷翻译还不当谜语人！\n这么好的人不捆回家怎么行！","children":[]},{"text":"散兵莫娜，大帽子和衣服配色挺般配的，两人性格对对碰，还都是星空派\n看他们日常互怼，诶，好玩儿～","children":[]},{"text":"公子和魈这两个各种意义上来说都是互相不对付的那一类，一边干架一边违背初心慢慢产生好感，却因为一明一暗的身份差异和寿命论导致最终还是分道扬镳，是我在别的圈经常吃的那种cp类型","children":[]},{"text":"九条和雷神，雷神是那种为了民众长久的幸福而背负骂名一意孤行的君王形象，而九条是那种因为相信雷神的信念，相信她能给民众带来幸福所以坚定的实施眼狩令的下属。\n我真的好喜欢九条这种坚毅果敢、心思细腻又忠心耿耿的女将军，尤其是她执行将军的命令收缴神之眼之后看到民众的痛苦和茫然，午夜梦回的时候会不会怀疑自己行为的正义性，痛苦的幸福真的还算是幸福吗？但是因为内心坚信神是爱人的，坚信雷神的决策是为了稻妻的，白天她仍然一丝不苟地执行眼狩令\n稻妻的民众现在已经得到了神明的注视，那可否再多分一点目光给那个从小就信仰爱慕她的天狗呢","children":[]},{"text":"钟离魈，对于钟离来说，魈是他为数不多经历了诸多岁月依然留在身边的“故人”，他作为岩魔神也好，璃月的帝君也好，现在的凡人也好，魈都是他“活着的历史”，是他一路上的见证人，将来也会一直陪伴他走下去。而对于魈，钟离是把他从被奴役的黑暗中解救出来，给他带来光明的人，也是为 区","children":[{"role":"回应者","text":"明明已经实地采风做出了很还原的街道、房屋和出租车，但一看到天桥底烧汽油桶的hobo和楼房里的公共洗衣房就绷不住了"}]},{"text":"《阿拉丁神灯》原本的那个童话，开头就说阿拉丁是中国的一个小伙子，整个故事发生在中国。","children":[{"role":"回应者","text":"阿拉伯文化里中国代表极为遥远的地方"}]},{"text":"“查一查饭店用中文要怎么写” “吃饭的地方”","children":[{"role":"回应者","text":"虽然但是，我觉得他们翻译的大概率是食事処……"}]},{"text":"全战战锤3震旦南方盘踞的僵尸叛军，旗子是标准的港式清朝僵尸，实际兵种全是西式的，领主的姓名也是西式的","children":[]},{"text":"全战三国的蜀国宣传片，对刘备以人为本的理念诠释的非常到位了。只是到最后结尾有个小小的瑕疵：刘备给诸葛亮递扇子的时候是单手递的，诸葛亮也是毫不客气一把接过再相视一笑。你要是把扇子换成一把战斧那就毫无违和感","children":[]},{"text":"傅满洲，作者是一从没来过中国的英国老白男，演员是拿胶带贴眼角的老白男，别说文化了，甚至从头到尾连一正经黄种人都没有","children":[]},{"text":"一些外国人理解玉皇大帝就是用玉石为身体的皇帝","children":[{"role":"回应者","text":"这算是翻译造成的误解，玉直译成英文就是jade，然而这词最常见的含义是翡翠..... 所以按他们理解，玉帝是名为翡翠帝皇的神明"}]},{"text":"某外国时尙品牌在过新年时想弄出白色的利是封(红包)当赠品，还好有一个妻子是中国人的洋人高层阻止了。","children":[]},{"text":"《冒险小虎队》的作者知道他的书在中国大卖后很开心，专门写了本中国题材的，结果这本没引进，因为内容都是刻板印象中的中国","children":[]},{"text":"命运对勇士低语，你无法抵御风暴。勇士低语回应，我就是风暴。——曹植《洛神赋》。","children":[{"role":"回应者","text":"作者去谷歌曹植洛神赋拿来画漫画，结果搜到央视解说拿来吹羽生结弦的词，前面引用曹植写的，后面是解说自己说的，然后作者把后面那段话当曹植写的洛神赋引用了"}]},{"text":"日本拍的西游记，整出了影史第一部女唐僧的魔改源头(从此日本人拍西游都是女唐僧了)，搞的国内友邦惊诧然后自己拍了86版西游记。还有中德美三开花究极魔改版，两伙人为了原稿火并然后交还给中国博物馆保管，最后一起上天庭在玉帝面前开庭打官司，程序正义到说不出什么味，里面观音负责扮演经典的好莱坞式花瓶女主谈恋爱热吻","children":[]},{"text":"有个来中国出差的老外归我接待，落地之后直接问我在北京哪里能吃到最正宗的左宗棠鸡","children":[{"role":"回应者","text":"左宗棠鸡是典型的美式中餐，当年赴美的华裔为了讨生活开饭馆，针对美国人的口味开发的改良中餐，当时左宗棠在美国很火，就蹭热度叫这个名字了"}]},{"text":"哥伦布的船上带了几个阿拉伯语翻译，因为他们听说中国人讲阿拉伯语","children":[]},{"text":"《师傅》，二周目可以宽恕各反派，但是宽恕贩毒的那个？一般中国人做不到吧。","children":[]},{"text":"包子头啊，这个刻板印象我是真的无力吐槽","children":[{"role":"回应者","text":"包子头 折扇 旗袍杈开到屁股，还要抬腿"}]},{"text":"莫名其妙的汉字纹身，很有名的一个是“汁”，像带金光的十字架所以很受欢迎","children":[]},{"text":"柯南里引用“运筹帷幄之中，决胜于千里之外”刘邦形容张良的话。青山可能只看过《三国演义》，说是刘备的名言。","children":[]},{"text":"美国地缘战略家在书中写到，中文的“俄国”音同“饿国”，证明了中国人对俄罗斯扩张的警惕","children":[]},{"text":"发福鞋。左脚鞋后面有一个发，右脚鞋后面有一个福，要是两脚都是福或者发还好，偏偏是发福。","children":[]},{"text":"外国剧情里对凌迟的解释是从手指开始切成一段一段把整个人切成段，虽然残酷度拉满但并不算传统凌迟吧","children":[{"role":"回应者","text":"这作者老兄应该是把凌迟和古代立本武士为测试佩刀质量进行的“试斩”仪式搞混了"}]},{"text":"整个卡尔瓦德东方人街和黑月的事情，按西方人习惯把姓和名字全倒装了：毛丽霞变莉夏毛，李操变曹李，魏阿龙变亚伦魏。","children":[]},{"text":"《安德的游戏》系列之外星屠异，里面描绘了一个叫做道星的外星球，倾注了作者对东方文化的理解，其中一对韩姓夫妇的名字真是看一眼都能让人昏过去","children":[]},{"text":"《军火女王》，传统艺能的“你们别看阿中厚道，他们肯定在非洲大杀特杀给自己牟利我跟你讲”，然后设计出来一个两把刺刀手枪正面屠杀掉一个装甲猎兵旅连烟都没掉的超人类兵王","children":[]},{"text":"《神探夏洛克》，有一集有个女的天天洗茶壶，说这是仪式，是中国文化","children":[]},{"text":"“子在川上曰，逝者如斯夫。”外国好像是这么个翻译：只要你耐心等待，敌人的尸体就会随着河流来到你的眼前。","children":[]},{"text":"《海伯利安》里面带中国元素的星球叫“青海-西双版纳”，抓破脑袋也想不出来这两个地名有什么特殊联系","children":[]}]},{"title":"伪球迷球荒，史上最精彩足球赛是哪场？","body":"全勤世界杯终于迎来了休息日，我已经超过1天没看球了，浑身感觉蚂蚁在爬，给我来一场吧，就一场。史上最精彩的足球比赛是哪一场？","replies":[{"text":"我看过最精彩的就是22年世界杯决赛..","children":[{"role":"回应者","text":"最近5届世界杯已经全勤看完了。"}]},{"text":"有高清录像的，可以看22世界杯决赛","children":[{"role":"回应者","text":"在磁力网上下载过，56G的，外语解说。"}]},{"text":"2014，荷兰踢西班牙","children":[]},{"text":"2122利物浦对曼城","children":[{"role":"回应者","text":"英超32轮那场吗"},{"role":"作者","text":"具体第几轮忘记了，随便搜下应该就有"}]},{"text":"荷兰对捷克","children":[{"role":"回应者","text":"04欧洲杯？"},{"role":"作者","text":"对，捷克逆转那场"}]},{"text":"以世界杯来说，看足球技术是2022阿根廷VS法国，看格斗技术是2014荷兰VS西班牙","children":[]},{"text":"这个时候，我就要拿出伊斯坦布尔……","children":[{"role":"回应者","text":"太过分了，就不要提伊斯坦布尔！！！！ 就不能让其消失在记忆里吗？ 让他们好好讨论世界杯不好吗"}]},{"text":"近一点的就是22年世界杯决赛，远一点的就是05年欧冠决赛","children":[{"role":"回应者","text":"呼叫米兰球迷保护协会"}]},{"text":"06荷兰踢葡萄牙","children":[]},{"text":"作为梅西球迷，不选22年决赛，选09年利物浦和阿森纳的4比4","children":[]},{"text":"前德国球迷，14年半决赛","children":[]},{"text":"我近些年看的最爽的的比赛是22-23欧冠半决赛曼城踢皇马第二回合，极致的掌控力压迫力，很久没有那种强强对决压迫力拉满的攻击场面了","children":[]},{"text":"巴萨vs巴黎的大逆转","children":[]},{"text":"我喜欢看德国7：1巴西 是不正常么","children":[{"role":"回应者","text":"这只是单方面的屠杀，不如22世界杯决赛强强对决压迫力拉满"}]},{"text":"02年韩国踢意大利","children":[]},{"text":"要不你看看02年韩国队西班牙意大利葡萄牙的，好看，太他妈好看了","children":[{"role":"回应者","text":"好奇那年葡萄牙有佩佩么"},{"role":"作者","text":"没有。当年有菲戈，鲁伊科斯塔，保莱塔"}]},{"text":"17年4月23日 巴萨vs皇马","children":[]},{"text":"我说一个 上半场3：0 下半场干回来 利物浦那场","children":[]},{"text":"阿根廷vs法国 \n阿根廷vs佛得角 \n阿根廷vs埃及","children":[]},{"text":"22年决赛，2：0、2：2、3：2、3：3 反转反转再反转，代入阿根廷球迷视角，戏剧性拉满","children":[]},{"text":"09年欧冠  切尔西VS利物浦第二场  \n\n18年世界杯 法国VS西班牙那场\n\n22年世界杯决赛没看，但看过的都说精彩","children":[]},{"text":"我来说一个非常好看的打架场次\n06世界杯荷兰葡萄牙\n你罗哥那时候太青涩了，还不懂得世间险恶","children":[{"role":"回应者","text":"讲道理，青涩也不至于当全英公敌，不过当了全英公敌还能征服英超只能说无可挑剔了"}]},{"text":"巴黎5比4拜仁\n曼城4比4切尔西\n曼联13比14格林斯比","children":[]},{"text":"06年，阿根廷与塞黑的比赛，有当届最佳进球\n 同年的德国与意大利的半决赛。\n12年欧锦撒，西班牙与意大利的小组赛\n14年  德国与巴西的半决赛\n16年  欧锦赛决赛\n21年欧锦赛  意大利与西班牙的比赛\n24年  欧锦赛决赛\n\n再古早的，98年西班牙和尼日利亚的比赛。\n再往前就看看集锦吧\n\n年纪大了，联赛和欧冠很少看了，主要看欧锦赛和世界杯了。","children":[]},{"text":"98年巴西荷兰，06荷兰葡萄牙天下第一武道会，06法国巴西，18法国阿根廷，22法国阿根廷国家队层面都挺好看的，其他比赛俱乐部的太多了","children":[]},{"text":"2005年欧冠决赛\nps：我米兰球迷","children":[]},{"text":"98年英阿大战，要素拉满","children":[]},{"text":"国家队层面：98年的英阿，新闻学要素拉满\n俱乐部层面：11-12赛季西班牙超级杯第二回合，技术含量拉满\n独一档：22年世界杯决赛","children":[]},{"text":"2006年世界杯淘汰赛英格兰大战葡萄牙那场，疯狂出牌，鲁尼小小罗反目成仇","children":[]},{"text":"我始终觉得最好看的是直播遇见的好对决，22决赛 阿根廷佛得角，都是直播看的，和看录播天差地别","children":[]},{"text":"我说个冷门的吧，\n98年西班牙对尼日利亚的比赛，奥利塞赫的进球第一次让我感受到了足球射门的真正速度。","children":[]},{"text":"伊斯坦布尔之夜，米兰球迷永远的痛","children":[]},{"text":"10年巴萨VS阿森纳首回合你也可以看一下","children":[]},{"text":"22年决赛肯定是最佳，另外18年俄罗斯踢西班牙那场淘汰赛也不错","children":[]},{"text":"上界决赛，我tm阳着强撑看完，值  \n2：0，法国就这cjb？\n2：2，卧槽这是要翻，加时赛阿根廷怎么挡黑又粗\n3：2，卧槽35还能加时赛绝杀？\n3：3，卧槽总决赛帽子戏法？","children":[]},{"text":"印象最深的是利物浦AC米兰了","children":[]},{"text":"98年阿根廷和荷兰也挺好看","children":[]},{"text":"1986年阿根廷马拉多纳手球绝杀英格兰，无疑是世界杯历史上最精彩的比赛，因为此战过后，阿根廷一路夺冠，马拉多纳从此成为了足球历史上第二位球王，无疑给阿根廷国家队和后来的阿根廷球员树立了良好的榜样，以供后人瞻仰和学习。","children":[]},{"text":"98年英格兰阿根廷\n00年法国意大利\n14年荷兰西班牙\n22年法国阿根廷","children":[{"role":"回应者","text":"00年意大利对荷兰\n托尔多超神那场"}]},{"text":"记忆里还是当年齐秃顶你个肺的冥场面……","children":[]},{"text":"说个比较近的，曼联vs里昂","children":[]},{"text":"嗯，我电脑里一直存着2014年7比1的录像……","children":[]},{"text":"08 年欧洲杯，德国 vs 葡萄牙，小组赛磕磕绊绊勉强出线的德国队让人捏把汗，没想到是藏了招梅策尔德踢自由人，克洛泽和巴拉克靠身体和球感碾压对手，邦邦进头球把葡萄牙整不会了，小猪当年展示了踢边锋的能力，葡萄牙的反扑也很凶猛\n\n同届欧洲杯，半决赛德国 vs 土耳其，两队展现跑不死的钢铁意志，德国战车的极致体现，巴拉克在这场比赛里燃尽了，后来打西班牙明显状态不佳\n\n顺便提一个片段，当届欧洲杯土耳其在补时阶段最后读秒绝平克罗地亚，比利奇的队伍两分钟经历天堂和地狱，心态失衡\n\n还有那年的荷兰被分到死亡之组，但是前两场小组赛碾压意大利和法国提前晋级，范尼在中场边线的马赛回旋也是经典，结果出线后被更能跑的俄罗斯击败了，阿尔沙文一鸣惊人\n\n2014 年世界杯小组赛荷兰打西班牙，范佩西的鱼跃头球相当经典","children":[]},{"text":"居然没人说多特和拜仁的欧冠决赛，节奏就是快，拿球就是往前干","children":[]},{"text":"22年时间决赛，\n没有白熬夜好吧，\n最精彩的决赛，甚至没有之一。","children":[]}]},{"title":"你心目中故事性最强的三届S赛","body":"英雄联盟S赛里，你心目中故事性最强的是哪三届？","replies":[{"text":"最令人动容：s12drx\n最热血：s8ig\n最无脑爽：s13t1","children":[]},{"text":"S7：魔王陨落\nS12：老将圆梦\nS14：LPL最后一战","children":[]},{"text":"S赛的话我选S7，不仅仅是冠军的故事，包括整个赛事，SKT的末路王朝，MSF的奇迹之战，FNC的0-3逆袭，SSG的宿命轮回，S7给我感觉是最有史诗感的一届S赛\nS冠的话选S12DRX，S12DRX的夺冠历程是那种最适合拍电影的，从冒泡赛开始每个bo5都可以展开精彩情节，最后决赛更有一种战胜天命的收束；S13T1适合小说，毕竟来个夏天连输垫底那一出就成你飞大男主了","children":[]},{"text":"s12最后一舞\n\ns13四强很想你","children":[]},{"text":"5.6.12吧","children":[]},{"text":"爽剧拍老李，一般励志drx，同人bl剧fpx","children":[{"role":"回应者","text":"fpx：像()和()这么好的兄弟再也不会有了"}]},{"text":"第一s12无悬念，第二s13，第三我倾向s7，配合s6食用更佳","children":[]},{"text":"s12绝对是第一\n黑马逆袭的含金量","children":[]},{"text":"故事性s12的drx是无可争议的第一。登神这个mv更是顶级。\n第二我给s12+s13的t1吧。\n第三的话给s7吧。","children":[]},{"text":"只说故事性S12断档级第一，DRX如梦似幻的旅程不管看几次都会感慨万分。\n其次是S7，世人皆苦的悲剧故事，从主题曲到宣传风格到比赛内容到场外直接给悲剧性拉满。\n再有的话……S13S14连一块的话可以算，或者说之前几年全部都是这两年的铺垫的话那这两年的故事性就很强。\n不算连着的话我觉得S8故事性也很强，胜利归于勇敢者的故事。","children":[]},{"text":"很少看lck，只完整的看过s3的ogn总决赛，那年第五把的盲选+孙亚龙和贝拉的解说真是印象深刻\n只讲lpl的话：\ns7 lpl黎明前夜，我至今都记得那年的绝望，s赛首次落户中国大陆，鸟巢决战把大伙热情推到顶点结果是两个lck打比赛\ns8 lpl首冠，虽然决赛是打欧美捞比\ns11 edg在无人看好的情况下怒斩当时感觉天下无敌的dk夺冠(那年我周围没有一个人认为edg会赢，因为领先1w经济被翻的记忆太痛了，而且那年的dk真的很强)，我心目中lpl最有含金量的冠军(虽然只有3冠)  \n\n补充：s11那年好多人立各种离谱的flag，edg夺冠以后，包括但不限于：裸奔、扔子写字、倒立洗头等等，导致我朋友圈有些不看lol的人在怒喷伤风败俗","children":[]},{"text":"s12老头与羊驼的交锋；s6天命在我的skt与坚毅不倒的猛虎；s7王朝崩塌，新王加冕","children":[]},{"text":"S10 DWG 网吧队夺冠\nS12 DRX 从入围赛BO5打起来\nS13 T1 我觉得S13的T1比S14的还有观赏性，完美","children":[]},{"text":"drx 24t1 ig","children":[]},{"text":"S7,S12,S14\nS8除了是LPL首冠，没有太多故事性。","children":[]},{"text":"S12 S7 S10","children":[]},{"text":"制作水平和精彩程度比较高的S7、8、12、13\n开始后面全是大飞爽文了《重生之我是LPL严父》","children":[]},{"text":"S7 王朝崩塌 不败的skt就此落幕。\nS12 弑神剑魔\n差一档的就s14吧。\n反正一路碾压的这种基本很难谈故事性。因为没有曲折反转的经历。","children":[]},{"text":"s赛12 7，其他都差不多。但是综合全年来看一定是s11。s8、s9两连冠，s10ig、fpx进不去世界赛，dwg夺冠。s11rng，edg重组，一个拿msi一个拿s，对s7最好的回扣。","children":[]}]},{"title":"毛利兰该怎么塑造才能和灰原媲美？","body":"在《名侦探柯南》里，毛利兰应该怎么塑造，才能和灰原哀相媲美？","replies":[{"text":"进主线，无他法。勇者在外面打生打死的时候你村里的青梅每天扶一万个老奶奶过马路也比不上同队法师扔个火球打敌人个破绽。","children":[]},{"text":"毛利兰怎么塑造都会是一坨\n一部主线是推理的推理漫画里存在一个和推理半毛钱关系都没有同时不支持男主角事业的女主，怎么看怎么抽象\n你再用尽全力塑造她也就是下一个井上织姬而已，灰原和柯南这种命运纠缠的宿命感毛利兰实在难以望其项背","children":[{"role":"回应者","text":"讲道理\n织姬尸魂界一起去了\n虚圈被动\n血战贡献了一个重要助攻\n怎么都能算个参与奖吧\n小兰\n主线和她毫无关系 有关系都被干妈一脚踹飞出去了 \n真还是有差别得"},{"role":"作者","text":"倒也是()这样一比起来毛利兰的主线参与度就更抽象了"}]},{"text":"一个智力担当 一个武力担当呗\n不过老是被救有点不好看 而且阿笠博士妙妙工具太给力了 越来越长后战斗力也刷新了就尴尬了","children":[]},{"text":"能不能变小","children":[]},{"text":"真想塑造毛利兰就不要把组织写的那么大。\n但这不可能，青山刚昌还指着捞钱呢。\n所以这个问题无解。","children":[]},{"text":"我觉得其实就很简单一个问题，兰最大的问题就是青山把兰不知道柯南的身份当成了底层逻辑\n作品刚开始连载的时候拿这个吊人，演变到现在已经是积重难返，把自己架起来了\n一个对男主角所有的事情都不知情，也帮不上忙的女主角，她就不可能是女主角，连带着男女主角的感情也失去了可信度，因为所有的大事件都与你无关，这感情怎么可能是能令人信服的\n所以这就是为什么很多人喜欢蕾姆胜过艾米莉亚，486对艾米莉亚的情感是不可信的，而蕾姆对486的情感是可信的\n\n但话又说回来，一旦兰知道了柯南的身份，那么整个作品除了少年侦探团将不再有任何所谓“日常感”，而青山就是靠着这点日常感在水剧情，没有这点日常感这作品拖不了这么长\n所以这个问题无解。当小兰第一次怀疑柯南，青山最终选择把这段掩饰过去了的时候，兰的形象薄弱化就已经是不可避免的结局。哀只是一个必然的结果，如果这个作品没有哀，也会有黑鸡基德安室等BLCP(实际上也不少)替代哀的位置","children":[]},{"text":"人设本身有点退流行的同时主线参与度还相当有限\n神仙难救，神仙难救啊","children":[]},{"text":"救不了啊，这角色青山就喜欢在无关紧要的地方塑造完美，但是在非常重要的地方拉胯。\n她“漂亮”“善良”“身材好”“暴力中有着温柔”“超好运”“武力强”“善解人意”“坚强？”“怕鬼等等说实话打出来才发现好像都是些笼统的特点\n但是“不喜欢推理”“不认同男主理想”“经常怀疑男主出轨(前期)”“盲目依赖男主(拉窗帘)”“分不清轻重缓急闹情绪(伦敦)”“自己狂催的事情却模棱两可(休学)”等等\n相比优点，缺点更致命。去掉不可以动某些的底层逻辑缺点，剩下的问题都太具体，不是人设上的那种(不恰当举例:哀前期动不动就消极寻死)，优点太模棱两可，一说善良第一反应居然是导致全员ooc的满月，模糊与清晰导致角色观感极差。","children":[]},{"text":"首先把武力点到和京极真同等级的看不见上限然后化身无敌浩克击毙所有来敌\n心虚逃离现场的人？殴打！直到他再也不敢跑路并且肯吐露隐藏的信息！\n被揭穿后豹变的犯人？殴打！让他从此往后都觉得只要活着就是美好！\n想偷东西的小偷？殴打！给他留下心理阴影从至此后想偷东西要先发几张旅游中奖券上供！\n黑衣组织？殴打！只要你连子弹都能徒手抓住，那就没人敢正面与你为敌！\n说真的，我挺喜欢犯泽里小兰的强者气场的","children":[]},{"text":"很难的啦\n兰相比于哀性格和设定上都太缺乏张力了。","children":[]},{"text":"往武力够强能恰到好处或者巧合的在危急关头力挽狂澜就行，可惜这种角色在柯南里有很多","children":[]},{"text":"和黑衣组织boss战至最后，小哀昏迷不醒，阿笠行将就木，小五郎重伤倒地，一众警官都在血泊中挣扎，柯南万策尽矣，同样垂死的boss掏出改进版4869一口满血，众人绝望之际，小兰站出来:\n\n“卍解”。","children":[]},{"text":"这个问题不在灰原哀，有没有她都一样。 问题在于兰处于底层逻辑的进不了主线。\n一到主线就什么都不知道，什么都做不了。 \n定位尬在那了，不能让她进主线，所以一进主线就隐身。\n越隐身越进不了主线，越进不了主线越隐身。\n加上本身的恋爱关系也因为柯南常驻小学生形态难以推进。","children":[]},{"text":"不进主线的角色怎么样都不行，尬在这了。\n虽然我不理解为什么兰一定不能知道柯南的身份，我觉得琴酒不知道是可以的，为什么兰也不能知道，有很多种方法可以让她进主线并且提供武力担当(京极真这个高达就没必要上线了)","children":[]},{"text":"我看狩龙人这种呵护白月光到踢出主线的应对方法就是给女主单开一条主线","children":[]},{"text":"武力提升到和京极真那种机械降神的水平就行了，自有大儒汴京","children":[]},{"text":"那么多年主线死活进不去，难救，我看青山也不想让她进主线，先不管能不能完结，怕不是完结了她都不知道新一和柯南是同一个人","children":[]},{"text":"照着隔壁美雪一样塑造就完事了，可惜塑造不得","children":[]},{"text":"死啊，死了不就行了吗？\n不管谁赢不赢，起码肯定不会输","children":[]},{"text":"像 M6 一样终极牺牲一下就好啦","children":[]},{"text":"小兰这角色比较大的问题是柯南底层逻辑是不让她加进主线，所以想改的话唯一的办法是把她做成一个女版京极真，完全游离于主线外面，她的几次高光，引爆摩天楼的高空吊带踹玻璃，剧场版的躲子弹都是纯武力表演，青山把她做成一个女武夫确老是让她被保护自然很割裂","children":[]},{"text":"小五郎只要涉及警察和家人就会有高光\n\n而毛利兰唯一出路就只有做贝尔摩德干女儿","children":[]},{"text":"在一个以解谜推理为卖点的作品里，如果一个角色没有任何秘密，没有任何观众读者想深挖的东西，那他/她绝对没有魅力的。\n尤其柯南里有一句经典名句：secret makes a woman woman","children":[]},{"text":"一边造某些生物最爱的强武力独立大女主人设一边关键时刻嘤嘤嘤新一快来救一下的时候已经没救了好吧，不深入主线的警局相亲中心哪怕一天到晚搁那复读标签也比兰现在这个左右互搏强啊\n按说其实也就是和三小只/警察局那样单开一条弱推理支线的事，咱不走感情线来点帝丹高中好闺蜜事件簿啥的不也挺好","children":[]},{"text":"我看你们都不行啊，要来就来个大的！毛利兰直接加入黑衣组织！！！","children":[]},{"text":"把小兰的战斗力提升至和京极真差不多的水平就好了，要和福尔摩斯华生比cp感，那自然就是狄仁杰元芳啦！","children":[]},{"text":"无解，人物基础背景设定从逻辑层面上就决定了这种差别，不懂为啥非要媲美，中国有句古话，吃得苦中苦，方为人上人，人家童年经历什么劫数另一边什么劫数，说句直话，如果愿意人生互换，再来谈该不该媲美，否则公平何在？总不让亏都让一个人吃了吧。","children":[]},{"text":"没救了，毛利兰的定位早就两头堵了\n女主角要么高度参与主线，伴随主角成长\n要么作为“万灵药”是最终奖励\n\n然而现在是既不进主线，又太近导致担当不起“万灵药”定位","children":[]},{"text":"其实就是步子拉大了扯到跨，怎么调整都不舒服。隔壁黑羽快斗的青子定位和兰一样的，还有个抢跑的魔女，但是因为整体篇幅比柯南少太多就没有惨遭塑造","children":[]},{"text":"我不太理解为什么许多人决定让兰作为武力担当就可以加强兰在故事里的作用。\n\n在一开始的几章里，工藤新一就是具备武力的，尽管他选择的是足球。而柯南的足力增强鞋只不过是补回来这部分武力。可以看出在老贼的眼里，一个缺少武力的侦探是残废的。\n\n我们来参考一下其他的助手加侦探的组合。福尔摩斯就别提了，华生不负责武力。Gosick里的维多利加确实体力很差也没有武力。但久城一弥的定位是为安乐椅侦探跑腿的角色，以及维多利加的救赎者。他的作用是将维多利加带出高塔而非负责无双。包拯与展昭，狄仁杰与元芳。这两个确实是一个负责武力一个负责脑子。但展昭与元芳脑子都是很好的。而且更重要的是两个故事里有武侠元素。武侠元素撑起来的故事空间才是他俩大展身手的前提。\n\n仔细看柯南里的打斗，实际上可以发现他们的打斗与神探狄仁杰里的打斗是两码事。柯南里的打斗，除了剧场版里毁天灭地的足球外。所有的打斗都是“故事到高潮了，打一场让观众过个瘾吧”这样的地位。武力这件事情没有嵌入到世界观里，而是作为一个演出效果存在的。或者有时因为编剧蚌埠住了，拉高一下武力来机械降神解决事件的(没错，我说的就是足球还有磁悬浮那个狙击)。看剧场版小兰的高光时刻。唯一的作用就是冲出来打一下。这已经被人喷太刻意了，太端水了。\n\n反过来看神探狄仁杰。世界观里就是有飞檐走壁的高手。李元芳的武功高强无时无刻不体现在剧情里。\n\n最重要的是，柯南这个故事定位是恋爱喜剧(不会真有人把他当正儿八经推理故事看吧？)毛利兰作为青梅竹马。她是需要和柯南发生喜剧冲突的。就不可能是李元芳与狄仁杰这样的关系。","children":[]},{"text":"(被迫)不知道柯南=新一就直接判死刑了，虽然有过几次怀疑，但毕竟被解除了，那就等于还是不知道\n那说啥都没用，不知道柯南身份的人是没有资格进主线的，只能当吉祥物了\n还有就是跟隔壁对比的话，美雪全程几乎都至少参与案件，而且跟兰最大的区别是，哀的专属剧情，大部分兰根本就不参与，也根本不知道这些事情，而隔壁速水玲香的专属案件，美雪几乎都是在场的，这就导致玲香终究不可能在感情戏上做到跟美雪平起平坐\n但是哀的专属剧情已经多到了可能比兰专属还多的程度，兰还不进主线，于是只能尬住咯  \n当然更客观的原因是，隔壁金田一再怎么说也是做偏硬核的推理单元剧，柯南是带推理要素的恋爱轻喜剧，要推党争的，所以只能这样啦","children":[]},{"text":"要整大活都可以整,\n比如先让京极真被害,查来查去发现凶手在主角团里,\n下一幕英理跳脸、小兰制服警视厅众人扬长而去.\n娘俩要登上组织顶点然后研制什么奇奇怪怪的药把柯南变回来.\n\n什么情况小兰能比新一先找到凶手,\n很简单,自己当凶手.","children":[]},{"text":"没有进主线，不知道柯南=新一，并且大部分时间都很不靠谱的毛利小五郎，在涉及到他亲家人亲友师徒的案件时一样有好的塑造，不进主线不知道身份也很难做借口\n就是青山设定的20年前的属性跟不上时代了又不更新版本，昭和女友可以啥都不懂啥也不做在家当望夫石，现在不行了","children":[]},{"text":"小兰本来就是主线的通关奖励，就像塞尔达传说里不会有塞尔达一样","children":[]},{"text":"不知道青山最后会不会弄个\n把兰和最终boss的关系结合起来，比如小时候的兰其实和boss有几面之缘，在下雨天把伞送给他，或者在最落魄的时候送他便当鼓励他什么的\n从此兰就成为了boss心中的隐藏的白月光，哪怕是酒厂也仅仅只有一两个人知道什么的","children":[]},{"text":"要怎么塑造都不行吧，现在兰对剧情的参与度算在路人那一档吧。\n\n与其强行塑造兰不如一场大战后NPC统统退场，新一回首发现只剩下兰来得干脆。","children":[]},{"text":"其实可以参考幽白的莹子和牡丹，一个是被瞒着的心上人，一个是一起冒险的的助手，莹子的观感就挺好的唉我也很喜欢幽助和牡丹的互动","children":[]},{"text":"不如说毛利兰牺牲一下，直接化身死去的白月光，让新一永远铭记在心\n然后柯南就可以永远不变回去，好好当他的柯南了","children":[]},{"text":"首先把故事写短点……\n\n然后让兰从车子里跳出来抱住灰原的那次之后，下一篇章就让她了解到真相，加入主线\n\n后面就看青山的本事了","children":[]},{"text":"100话以前最壮烈的死去不就赢了\n谁也赢不了一个死人","children":[]},{"text":"毛利兰的人设太平凡和普通了，柯南发展到今天高人气的角色基本上人设时髦值都比较高，不管真正塑造如何至少能让人觉得很帅很酷。而毛利兰人设实在太普了，太缺乏戏剧张力了，所以给人的感觉就是这个角色实在太无聊了。","children":[]},{"text":"我觉得早期哀的人设完全不像是现在的青山可以写出来的…太完美了童年哀登场的第一集印象太深刻了完全成了小哀俘虏，早期青山的角色就是更有灵气一点吧，安室也是，卧底期间真是又帅又狠，包括小兰怀疑柯南那段时间我也觉得比现在有角色魅力多了，只能说现在名柯的角色塑造纯靠吃以前老本，小兰没有像小哀那样有震撼出场+身世buff已经落后太多了，真要比肩小哀的话起码得从出场开始重新改设定吧毕竟早期设定就是邻家青梅和从黑暗组织叛逃的女人这个设定沟壑太大了","children":[]},{"text":"设定得武力值够强就行了，早期物理还没膨胀的时候走一文一武路线那会兰风评就挺好的，后来怪物扎堆就显得兰姐泯然众人还有可 差不多的火纹人会做出即使不打竞技也一眼看得出的区分)，增加类似于大乱斗三代的有播片有剧情+横版过关的单机模式，收集要素变回手办+增加介绍\n击拳热斗新作或者wii版移植——求你了next level games再带我冲一次罢(哭)","children":[]},{"text":"想玩老滚6，但就目前星空给我的100多小时游戏体验，我的心情又很复杂……","children":[{"role":"回应者","text":"老滚6属于无论如何都会有，而且等不了几年就会有的所以就不算了"}]},{"text":"三a黄油","children":[{"role":"回应者","text":"什么时候能有ue5做的黄油啊"}]},{"text":"旷野之息的物理交互加上老滚5的人文交互，旷野之息可以更进一步到王国之泪的级别，老滚5也可以换成真正的网状叙事，但只到第一步也可以，我认为这可能是目前技术水平下开放世界的最终形态了。","children":[]},{"text":"太空游戏，自由枪骑兵的探索感 + X4的沙盒 + 家园的RTS舰队战 + 行星登陆","children":[]},{"text":"修仙背景的暗黑LIKE游戏\n本体是挂机收菜游戏\n只有洞府建筑装饰和各种时装宠物 打坐修炼突破瓶颈\n赛季是各种小世界的位面投影 赛季奖励也只有时装\n这样每个赛季进去爽刷 研究BUILD\n没事干的时候回来建造洞府放置挂机","children":[]},{"text":"装甲核心6级别的高达游戏","children":[{"role":"回应者","text":"这个 算是有ace系列代餐吧？"}]},{"text":"抗日题材的开放世界游戏，想手撕鬼子","children":[{"role":"回应者","text":"抗日战争确实是个挺好的题材二战FPS有战地可以借鉴，希望黑神话成功然后越来越多的国内厂商尝试这个领域吧"}]},{"text":"用怪猎世界的底子做的XX/崛起","children":[]},{"text":"和破晓一个画面水平的伊苏或轨迹","children":[]},{"text":"更二次元可操控角色更多养成要素更足的王国之泪\n不是hd2d的正常画面的可以操作角色更多的勇气默示录bp系统正作\nxb2 remake","children":[]},{"text":"有怪猎或者只狼水平战斗系统的老滚5","children":[]},{"text":"每栋楼房都可以进而且有对应功能/任务/剧情对话的gta","children":[]},{"text":"正统的牧场物语……起码要有重制矿石镇那个画风和剧情","children":[]},{"text":"哈利波特，但野炊级开放世界和场景交互","children":[]},{"text":"完整版异度装甲","children":[]},{"text":"地平线1的剧情文案，对马岛的视觉剧情感染力，然后更爽更刺激一点的战斗，美末2的细节技术力(这个我没玩过，看大家吹的)。然后还是相对线性一点的游戏类型","children":[]},{"text":"rts版绝地潜兵1，用巨构做地图的横扫千军系rts，二次元全境封锁，戈德堡多面体地图战棋","children":[]},{"text":"3a画质的泰拉瑞亚，还能收集各种角色人物卡，最好还是仙侠题材。","children":[]},{"text":"wow世界观的单机3a\n另外好想玩每个一眼未完成内容的地方都做完的2077\n还有月姬r里编，这个说实话大概已经不想玩了，只剩下想看着它做出来算是了一桩心愿的心态了……失望，彻头彻尾的失望","children":[]},{"text":"肉鸽版王国之泪，这个我是真的想  \n如果再加一个那就是吃鸡版帕鲁","children":[]},{"text":"想看育碧像光荣到处接ip做无双一样，到处接ip做罐头，有好多ip感觉适合也想玩。","children":[]},{"text":"反恐act\n类似鬼泣，但是反恐题材\n主打一个非致命武器\n主角的武器是电棍、盾牌、防暴叉、双拐这种东西，但也有枪和刀\n枪和刀虽然好用，但是会削敌人血量\n非致命武器不会削血量，但是会累计眩晕值\n眩晕值满了，就能制服敌人\n如果没有制服敌人而是削血把敌人打死了，就会扣分","children":[]},{"text":"老滚和龙信的合体游戏","children":[{"role":"回应者","text":"龙信的开放世界和老滚的战斗系统是吧"}]},{"text":"黑白复刻，要融合帕鲁的战斗系统(即不是回合制而是改成内置CD，和动画的战斗一样是即时战斗)和工业模式(真正的要靠PM烧火做饭而不是在那抽象野营)\n\n同时低米线甚至可以抓NPC(你黑白不是讲人和宝可梦平等吗)剧情上是黑白1+2整合版(2的内容融一点做二周目，谁还敢说你二周目水)然后DLC可以再开发一下N相关的剧情，可以分N的过去和未来两篇","children":[]},{"text":"太阁立志传·全世界版，大航海时代ol单机版，魔兽世界黑暗之魂版","children":[]},{"text":"艾尔登法环，但是育碧罐头版\n魂游试了一堆都玩不下去，\n什么时候来个法环美术的罐头，让我试试。","children":[]},{"text":"刀剑神域\n从小学开始梦","children":[]},{"text":"无缝大地图，人物动作自然不僵硬的老滚5","children":[]},{"text":"1.(近)未来科幻题材，大都市背景的开放世界游戏，且至少存在两栋内部有大量可探索内容的摩天大楼。目前最接近的是2077，但依然差了很远\n\n2.fs的箱庭探索设计+仁王2的战斗系统+血源的美术+刷子内容\n\n3.3A级galgame","children":[]},{"text":"地球OL\n地球完全1比1复刻+70亿人口+几千个主流物种(包括水产)+地球完全1比1复刻+地球自转+太空完美复刻。\n这样除了吃的和体感的，其他所有东西我大部分都能体验。\n先假设能解决ZZ问题，不知道这种游戏需要什么样的机能和硬盘。","children":[]},{"text":"封神榜主题的刺客信条","children":[]},{"text":"VR版战神三\n\n想要手撕众神！","children":[]},{"text":"第一人称版的幽灵行动，或者真正开放世界的地铁离去","children":[]},{"text":"一个完全专注于战斗的游戏，什么怪都至少有三种或以上的处决演出，弹反弹刀这类动作同上，怪物所有类型的动作同上，可惜根本不会有","children":[]},{"text":"更单人向的魔兽主题游戏吧，魔兽的职业模式简化+Warframe那种可组队可单干的可氪金提升的模式，而不是强绑定团本，而不是没几个给力的队友不行，还甚至要动不动为了装备手法吵架骂人的。","children":[{"role":"回应者","text":"那其实感觉有点像暗黑4？"}]},{"text":"想要大表哥规格的闯关东背景开放世界RPG\n抗日背景的战地\n配上龙信级别动作系统的老滚\nPOE复杂度和暗黑3爽度的刷刷刷爽游\n完全开放世界的怪物猎人\n想做的梦太多都说不完","children":[]},{"text":"策略，战场，fps三者融合的游戏\n类似全面战争那种，但是战场上可以扮演小兵或者载具","children":[{"role":"回应者","text":"选指挥官后，你就可以控制ai队友攻击哪个点。画行动路线。\n然后本身还是FPS，想坐载具坐载具，想当小兵当小兵。"}]},{"text":"我也想玩内容量超大的3a黄油当然东亚审美限定，西式审美的黄油玩不动","children":[{"role":"回应者","text":"那不就是博德之门3\n把游戏目标改成睡每一个队友"}]},{"text":"深海迷航 类型的生存探索游戏  更大的地图 更多的怪物 以及最最最重要的移动基地","children":[]},{"text":"我以前一直想玩的应该是流星蝴蝶剑模式的金庸群侠传","children":[]},{"text":"自己可以拼装宇宙飞船，类似生存游戏盖房子那种可以随意扩展的宇宙飞船。然后在宇宙中探索，并且真的有设计好的东西可以探索的。不同的生物，星球环境。\n\n最早是玩孢子产生的这种想法，但孢子飞船探索部分做的一般。游戏也有点太老了。\n\n然后最接近的是无人深空，但无人深空的星球过于雷同。不过无人深空的货船建造系统基本满足我设想的随意建造这块。可惜那个船不能想怎么开就怎么开。","children":[]},{"text":"古风乙女魂like银河恶魔城","children":[]},{"text":"龙信战斗+老滚开放世界+魂系美术+生软队友塑造+crpg世界观，jrpg主线(类似迷宫饭和废都物语)","children":[]},{"text":"超级宝可梦，就阿尔宙斯那种盘外招+pm对战，对战过程中能用玩家动作干涉战局，然后pm要有特性(阿尔宙斯没有很烦人)，mega啊z技能啊极巨化啊钛晶啊什么的都能招呼上，有动作要素有策略要素，剧情再正常一点就再好不过了","children":[]}]},{"title":"你们有没有夹在喜欢和难受之间的xp？","body":"有哪些xp让你在喜欢和难受之间来回横跳？","replies":[{"text":"扯头发\n无论是在床上还是斗殴\n我很喜欢床上扯头发的，仿佛驯养一匹野马的那种野性的强制\n我也很喜欢斗殴里面扯住别人头发然后往一个方向砸的纯粹暴力\n\n但是我每次看到这类情节都会幻痛头皮……","children":[]},{"text":"NTR\n小头占上风的时候很喜欢，贤者模式大头占上风的时候恨之入骨","children":[]},{"text":"觉得吸血鬼咬人舔血很涩，但是晕血，但是很涩，但是晕血…","children":[]},{"text":"百合破坏\n小头占上风的时候很喜欢，越喜欢的动画看的百破就越起劲，?贤者模式?大头占上风的时候恨之入骨，和ntr无疑，道德上有问题","children":[]},{"text":"身体改造？那种将清纯美少女变成木柱身材给我感觉真的很涩，但这个tag经常和猎奇放一起","children":[]},{"text":"ntr\n表界作品我纯爱战神恨不得杀光所有牛头人，哪怕背景路人被牛了也恶心\n里届作品苦主女主黄毛我都能带入","children":[]},{"text":"喜欢过激play但厌恶恶堕。","children":[]},{"text":"エロ処刑，又香又臭","children":[]},{"text":"调教，我喜欢调教里一些比较重口的玩法，但超级讨厌私车公用","children":[]},{"text":"讨厌恶堕 但最喜欢恶堕中不停挣扎反抗的","children":[]},{"text":"永久束缚，属于觉得很涩但很让大头很难受","children":[]},{"text":"喜欢人棍，但根本不想看到现切，炸熟之类的玩意儿。\n\n通常一起出现的屎尿屁，我屎尿可以，屁反而不行\n\n还有作为足控，现在太多足控作品都有脚臭元素，可我真的和讨厌啊","children":[]},{"text":"时停相关吧，或者说任何女方处于无反应状态的\n\n喜欢是意识层面上真的很吃这套\n\n难受是道德层面来说这种xp注定我没办法在现实层面实现\n并且我的道德观也觉得这是种很阴间的xp，己所不欲勿施于人嘛\n\n各方面来说都挺心情复杂的，小时候用了这种素材一次就一路跑偏了其他类型的完全用不了","children":[{"role":"回应者","text":"时间暂停是每次看之前都觉得这个题材很带感，但是实际看就觉得女主跟死鱼一样很没意思"}]},{"text":"我是足控但是欣赏不来挠痒，总感觉破坏构图。简单上手把玩一下那种就挺不错","children":[]},{"text":"近月2.2亚十礼线\n\n我对二代出妹线没什么意见，但它写的角度非常变态非常÷，在精神层面上很好冲，然而冲完没忍住呸一口再走，或者冲着冲着就没忍住给气笑了，哇俩出生","children":[]},{"text":"死反派\n看反派死亡前后的变化真的很过瘾，但真死了就很空虚  \n\n曾经看过一个guro本，魔女自己分身几十个互相杀着玩，结果不小心把最后一个也杀了，完蛋","children":[]},{"text":"扶她虐屌。这个可以吧，喜欢扶她。但是虐屌难受。","children":[]},{"text":"监禁、凌辱、调教、奴隶\n\n但是这一系关键在于日常到非日常的反差和现实感啊，就是得女主像个正常人才有意思。\n搜tag找到的几乎画面都很过激而且迅速母猪化，那就没意思了。\n写得好的话，其实不需要任何过激描写，但是这种很少。","children":[]},{"text":"精神控制系的吧，在ai角色扮演时，其实我良心上的确觉得纯爱是更好的也更积极的，但是经常压力一大，懒得循序渐进就直接上精神控制(而且精神控制确实是我的xp)，这样虽然直接获得了结果，但总感觉仿佛自己又做错了什么","children":[]},{"text":"父娘，但是父那方用强的就会不想看","children":[]},{"text":"皮物吧，感觉画的色的很色，画的太过激了就变成G向了。","children":[]},{"text":"futa，我喜欢正常大小甚至小小鸟的，但是绝大部分futa全是非人类巨物","children":[]},{"text":"guro吧，大概到断肢的程度都还挺喜欢的但是内脏破损甚至人体改造就冲不动了","children":[]},{"text":"guro吧，应该是最叶公好龙的一个了","children":[]},{"text":"露出play\n那种深夜露出散步的play，那种害怕被发现拼命躲藏的但是又瘾大还想玩被羞耻感所掌控的感觉真的非常色，尤其是带有自缚拘束玩法的更是狠狠加分(经典神作塞蕾卡)\n但是如果真的到了暴露身份的地步，最后彻底社会性死亡的结局，反而又会难受到完全冲不动(像是品川老师的作品)\n又或者是欧美系的那种，毫无羞耻感的光明正大的裸奔类型，或者那种艺术人体彩绘的，反而一开始就产生不了什么性趣","children":[]},{"text":"田径部少女\n\n画这个题材的老师都很极端，要么就是平平无奇的短发美少女，要么就是跟刃牙一样肌肉块块分明。\n只有很少一部分才能描绘出兼顾女性柔美和运动系薄肌的角色","children":[]},{"text":"虫X，我很喜欢异种X但不喜欢很多种虫子","children":[]},{"text":"人棍\n理智上知道不能看\n道德上说没问题","children":[]},{"text":"足控(二次元限定)\n我表姐的脚巨臭无比，当时给我十几岁的幼小心灵造成了极大的震撼，从此我对三次元的脚彻底祛魅了\n但是二次元不一样，二次元美少女的脚都是香的","children":[]},{"text":"我的大头很讨厌和服之类的看起来就很累赘的衣服，但是我的小头觉得这是种物化/谄媚感所以很喜欢。小头兴起的时候大头瞬间会冒出来讨厌的情绪","children":[]},{"text":"伪娘，多人。\n回归大头只会觉得恶心","children":[]},{"text":"喜欢巨根/超根这种非常生殖崇拜的题材()但是这种很多都是扶她但是不喜欢扶她()","children":[]},{"text":"冰恋。\n好孩子不要搜，实际上我自己对这个xp也是难受和喜欢都有，且难受居多。","children":[]},{"text":"圆润风骚但脸称不上美的角色。就是角色没那么好看，但这种不好看又是原生态的接地气的，搭配上肉肉的体态和风骚的神态，让人莫名心潮澎湃，但贤者时间时又会懊悔：唉下次还是整点好看点的吧然后陷入微妙的轮回","children":[]}]},{"title":"哪个版本的黄蓉演得最好？","body":"目前为止各个版本的黄蓉里，你觉得哪一版演得最好？","replies":[{"text":"李一桐第一还有什么好说的？","children":[]},{"text":"朱茵李一桐并列吧","children":[]},{"text":"94版朱茵最好，唯一一版相对来说几乎没有抹黑黄蓉，没给黄蓉降智和倒油，没怎么给反派加戏洗白，且颜值高的版本。\n\n李一桐那个可以说(除了83版)史上智商最低版黄蓉，也不知道有人吹什么最好。\n\n17黄蓉连欧阳克几个姬妾都打不过，被抓了，只能喊[救命啊救命啊，有没有人啊]，你管这叫黄蓉？\n\n也不知道17吹天天营销个什么符合原著，还有黄蓉各种嘴杨康，促进杨康黑化，把杨康变坏莫名其妙甩锅到黄蓉头上，\n\n还有华筝提前登场，黄蓉吃醋变成哭哭啼啼恋爱脑跑回去，各种现代言情台词，17版的台词更离谱，什么[为什么越爱一个人，心就越痛呢][恋爱，就是最毒的毒药]，各种塞黄蓉嘴里。\n\n17黄蓉还有诸如想个计策被杨康识破，看不出一灯出家了只想拉着郭靖一起死，然后在那哭哭啼啼，父亲被冤枉了，还在那恋爱脑各种倒贴郭靖，完全没有原著黄蓉的那种骄傲，降智剧情多到令人发指。连原著黄蓉过家家玩泥娃娃这种明明表现黄蓉天真烂漫的情节，17居然都能魔改成黄蓉哭哭啼啼苦情戏，我是真不看懂。\n\n吹17符合原著黄蓉的，真的看过原著和17吗？17也就前几集还凑合，中后期剧情就开始魔改血崩了。黄蓉容貌，武力，智商，全方位削弱，可以说是现代言情苦情超低配版黄蓉。\n\n剧情人设最符合原著的就是94和03，但是03周迅懂得都懂，，所以目前最好的黄蓉就是94版，几乎没有抹黑黄蓉的点，几乎没有任何加戏洗白反派，把黄蓉绝大多数讨喜的点都还原出来了，就是剧组穷了点，很多剧情拍得稍微简略了，但是在一群魔改版本里，这版已经是鹤立鸡群的存在了，领先至少一个身位。\n\n17单拎黄蓉人设和演技出来，还未必比得过08版的，08版黄蓉的智商和武力，估计能把17版吊起来打。\n\n最后，还是推荐看原著。","children":[{"role":"回应者","text":"写这么多真是难为你了，可我还是最喜欢李一桐版本的"},{"role":"作者","text":"我比较厌蠢，尤其角色还叫黄蓉，看到满嘴喊救命救命的，真是和黄蓉根本没法联系到一块去"}]},{"text":"你要说演的最好的话,那真的就是94/03二选一.......\n\n你要说最像的话那我觉得17还能加入讨论","children":[{"role":"回应者","text":"17最像就不可能，可以竞争智商武力最低版本的黄蓉。。"}]},{"text":"我只能说\n94朱茵\n现在的目光追剧依旧能看\n演技\n剧情\n颜值都在线\n我不知道有啥好讨论的","children":[]},{"text":"70后表示翁美玲就是黄蓉本蓉","children":[]},{"text":"喜欢林依晨","children":[]},{"text":"朱茵第一，这版稍微弱化了黄蓉的智的方面，但是总体不伤大雅\n周迅第二，这版是所有黄蓉中女诸葛方面表现的最好的，她的问题一个是公鸭嗓，一个是造型师有时候会下线\n李一桐如果就停留在白衣出场那段，她就是最好的，但是后半段整个垮掉了，当然这个是编剧的锅，但总体还是不尽如人意\n\n林依晨是个恋爱脑，那版射雕就是个披着射雕皮的唐人偶像剧，瞅着跟隔壁仙剑1串场过来似的\n翁美玲整个就一砵兰街十三妹，和黄蓉毛关系都没有","children":[]},{"text":"我还是喜欢翁美玲，非原著党，我只看电视剧，翁美玲就是黄蓉。","children":[]},{"text":"反正查良镛同志最喜欢周迅那版，某些版本不要拖原作者出来蹭","children":[]},{"text":"所有版本都看过\n17\u003e94\u003e08\u003e03\u003e83。","children":[]},{"text":"八零后只认翁美玲，朱茵很好但是她还在，所以","children":[]},{"text":"94吧，其实综合演技服道化和剧情还原程度，03也相当有竞争力，但是周公子和李亚鹏两个人的原声大碟实在太出戏","children":[]},{"text":"李一桐 笑眼女孩我的最爱","children":[]},{"text":"朱茵。","children":[]},{"text":"03第一，周迅的嗓音在我这别有一番特色，不怎么扣分","children":[{"role":"回应者","text":"同感，演技是最好的，也很会演少女。原声虽然不少女但我觉得很有特色，有种脆弱感。"}]},{"text":"最丰满黄蓉~~~林妍柔","children":[]},{"text":"抛开嗓子，周迅的黄蓉是最灵的，估计就是她的嗓子太出戏了所以减分比较多","children":[]},{"text":"喜欢古天乐版神雕的黄蓉","children":[]},{"text":"周迅最好。。。朱茵。。不知道为啥那么多人吹朱茵版。。。。。真看不下去。\n而且朱茵皮肤黑，腿又短，真欣赏不来。。。脸确实好看就是了，但真心没什么气质。。。。","children":[{"role":"回应者","text":"你说别的缺点就算了，周迅不也是又黄腿又短 声音还难听"}]},{"text":"我有滤镜，我只认翁美玲","children":[]},{"text":"朱茵\u003e李一桐\u003e其他。","children":[]},{"text":"80后表示83版翁美玲就是心目中的黄蓉！\n其次是朱茵","children":[]},{"text":"桐蓉儿，朱茵都挺好，周迅被鸭嗓子拖累了","children":[]},{"text":"喜欢胡歌那版的，虽然魔改得太厉害了","children":[]},{"text":"周迅是演技最好的。声线确实扣分。","children":[]},{"text":"我选李一桐。\n朱茵各方面都顶级，但有一点太扣分了，她演的时候总是往翁美玲靠，比如玩头发的姿势，明显在学翁美玲。翁美玲版本太糟了，所以导致我对朱茵的印象也不太好。\n所谓有滤镜的老观众，无非就是没看过书先看了83版的那一批人。83版作为剧也可以称一声经典吧，但太魔改了，尤其黄蓉，和书里根本不是一个人。对书里黄蓉先有印象的人，很难对翁美玲的演绎有好感。","children":[{"role":"回应者","text":"摸个辫子就模仿翁美玲？？摸辫子被翁美玲申请专利了？？所以米雪摸辫子也是模仿翁美玲？这些人都是模仿翁美玲？？"}]},{"text":"先入为主。在印象中没超过原版，一律不如原版。\n所以，我只喜欢朱茵。","children":[]},{"text":"随便你们怎么说，我们80后只认翁美玲","children":[{"role":"回应者","text":"别们，我82的，首选李一桐次选周迅然后是朱茵。\n\n你代表你自己就好。"}]},{"text":"朱茵，少有的看了原著再看剧不觉得违和的。古灵精怪俏皮颜值服装个方面都无可挑剔","children":[]},{"text":"颜狗必须是朱茵啊","children":[]},{"text":"张纪中神雕里的黄蓉","children":[]},{"text":"你说郭靖83还能比一比，黄蓉就只能是94版了\n如果加上神雕的话我觉得是白古那一版的黄蓉看着最舒服","children":[]},{"text":"只论外表形象 周迅=李一桐\u003e其他\n加上声音 李一桐\u003e其他\n再加上剧情人物塑造 周迅\u003e其他，剩下的各有各的垃圾最垃圾的应该是83","children":[]},{"text":"94版郭靖黄蓉都是最好的选角，朱茵的黄蓉活泼机灵很到位，翁美玲也不错只是被乔帮主拖累了。张智霖的是唯一一个不傻不憨不愣又不失纯真的郭靖。","children":[]},{"text":"我选李一桐，完美符合我对黄蓉的想象","children":[]},{"text":"长相来说是朱茵和李一桐。\n但朱茵版黄蓉那股傲娇劲让我惊为天人。\n所以在我这里朱茵第一，李一桐第二。\n补一句，朱茵版黄蓉，感觉就算以当下的审美都是超惊艳的","children":[]},{"text":"讨论剧情台词感觉很难分出个高低，都不是十全十美的，而且那更多是导演编剧的比较了。单看女演员颜值气质表现吧就\n\n朱茵最好，李一桐在我看来是低配朱茵，都是笑得很甜的款。喜欢这一挂的人自然会把这两人拍前面点。\n然后是翁\n讯哥儿，但凡不要用原声都好点，还有她声音搭个李亚鹏声音真的灾难。\n林依晨没法评价，我没看完。","children":[]},{"text":"周迅演的是真好，可惜开口毁所有，时至今日我都不明白导演和制片人为什么会允许她自己配音的","children":[]},{"text":"完全看不上翁美玲版，朱茵也一般\n\n李一桐和新版的到还不错","children":[]},{"text":"喜欢魏秋桦的中年黄蓉  有缺陷 有机智 有大义.","children":[]},{"text":"03版如果主角用配音就是最完美的射雕了。","children":[]},{"text":"不能因为年纪大的人不看这个帖子就无视掉啊\n\n你们年轻人根本不可能懂得83版对85年前出生的我们意味着什么\n\n所以你可以加一个年龄区间，再去讨论","children":[{"role":"回应者","text":"黄蓉是喜欢戏弄人，但是她是个是非分明，知道什么人该狠狠的戏弄，什么人是调皮的戏弄，什么人该尊敬。83，翁根本就是个作精，和黄蓉有毛线关系？\n\n83可以说影响力，可以说全民热度。但是请不要说翁是黄蓉。"}]},{"text":"年轻版94射雕，年长版95神雕","children":[]},{"text":"年轻版的选朱颖，老年版的选古天乐里面那个。","children":[]},{"text":"李一桐最符合原著","children":[]},{"text":"朱茵的紫霞和黄蓉两个角色，恋爱感太无敌了","children":[]},{"text":"周迅要是整个配音，在我这儿就是最好的","children":[]},{"text":"任你批的天花乱坠，我也不能动摇我心中翁美玲黄蓉本蓉的地位分毫。","children":[]},{"text":"周迅，有智力有灵气，嗓音反正我听多了觉得还好","children":[]}]},{"title":"有哪些BGM封神的动漫名场面？","body":"BGM和场面本身都顶级，而且彼此契合度高的动漫名场面，你有哪些想分享的？","replies":[{"text":"斩服少女里一到关键时刻就会有的BGM尤其是会长和妈妈的出场曲","children":[{"role":"回应者","text":"爆衣神曲 跟鬼母"}]},{"text":"86的LilaS和Avid,看完的那会把这几个片段循环了一整晚","children":[]},{"text":"高达seed里基拉开着自由从天而降","children":[]},{"text":"Clear mind！！！！  \n加速同调连光都她妈的可以超越吔  \n聚集的群星化为一体时  新的羁绊将照亮未来  化作光芒闪耀的道路吧！\n超越极限加速同调！\n进化之光！流天类星龙！","children":[]},{"text":"来自深渊的日出神曲和登岛神曲","children":[]},{"text":"末日三问结尾女主男主告白","children":[]},{"text":"命运高达在雨夜里出击，任务是讨伐“叛徒”，BGM名叫恶魔的契约","children":[]},{"text":"PP，第一季，聊天室杀人魔，那个杀人犯把榨汁机打开，ED响起，一身鸡皮疙瘩","children":[]},{"text":"cb 24集\nI closed my eyes but I keep seeing thi 事业线在惊涛骇浪中推进时总能在感情线上作为后盾支持她的温暖港湾，确实是很不错的女婿人选。","children":[]},{"text":"很难不投明日香学姐","children":[]},{"text":"第一季就站官配了，不知道为啥就是没喜欢高黄，然后看了久三年后，果然高坂还是不行，久美子和黑江或者奏我都能嗑到，但高坂，我只能说如果我朋友恋爱脑到背刺我，别说好闺蜜，朋友都做不成","children":[]},{"text":"黄前久美子和平泽忧！！","children":[]},{"text":"黄前久美子x仙人球盆栽","children":[]},{"text":"久美子比赛前和秀一鸡互相打气，踩脚要碰拳那段小动作可太戳我了，这才是青梅竹马啊，那种独属于彼此的小默契。","children":[]},{"text":"明久 久奏 真久都能磕","children":[]},{"text":"我从第一季开始就是秀久党了","children":[]},{"text":"我是久伞党，原因很简单，我最喜欢这两个角色","children":[]},{"text":"久美子×我","children":[]},{"text":"实名支持高黄 看过小说 但我依然是动画党 永远战边高黄","children":[]},{"text":"我觉得第二季后半明日香和黄大叔的CP感已经爆了","children":[]},{"text":"虽然我也是bg党，但还是被久一年明久的感情戏打动了(算是姐妹情？)","children":[{"role":"回应者","text":"黄大叔姐控四处找姐姐罢了(大雾)"}]},{"text":"翻看了下第一季，发现久美子和秀一的小互动都好自然，就是那种亲梅竹马之间不言而喻的默契和信任，有种打从心底相信“对方无论如何都会陪在自己身边”的感觉。正因如此夏日祭久美子面对青梅关系被动摇时的手足无措实在太有味了，意识到总缠着自己插科打诨的青梅可能不会理所当然地一直陪着自己。这就是青春啊","children":[]}]},{"title":"你听过最惊艳的名字是什么？","body":"你听过的最惊艳的名字是哪一个？","replies":[{"text":"初中隔壁班有女生 名叫管箫；\n本来姓管是不太好起名字的  但是两个竹制的乐器放一起  一下子就有了画面和声音 内涵也很高洁典雅；惊为天人","children":[{"role":"回应者","text":"挺能吹"}]},{"text":"我女儿班上有个叫陈连舟的小朋友。\n我第一次听的时候就觉得蛮好听，以为出自“风雨离骚秋暮行，荃兰墨妙连舟重。”\n结果是因为他爸爸姓陈，他妈妈姓周。陈恋周……","children":[{"role":"回应者","text":"生的不是娃，是狗粮"}]},{"text":"一个50多的农民大叔，叫齐凤程，当时听的时候感觉他家老爷子肯定很有文化。","children":[]},{"text":"江疏影","children":[]},{"text":"花满楼，感觉这名字是武侠小说界起的最好听的名字了吧","children":[{"role":"回应者","text":"温瑞安小说里直接拿词牌格当名字 苏幕遮苏梦枕……"}]},{"text":"小学有个同学叫司马宇航，很惊艳，到现在还记得。","children":[{"role":"回应者","text":"这和宋宇航 张宇航有什么差别"}]},{"text":"张一弛。一张一弛，文武之道。感觉别人父母好有文化","children":[]},{"text":"之前有两位同事都是复姓，一个上官丕剑、一个欧阳鹏飞。","children":[]},{"text":"高中一个女同学叫初日，到现在我都没有遇到第二个姓初的","children":[]},{"text":"霍去病\n辛弃疾","children":[]},{"text":"小学同学叫“海云亭”，记到现在","children":[]},{"text":"神龙政变五王：张柬之、崔玄暐、敬晖、桓彦范、袁恕己\n感觉古代文人起的这些名字个个都霸气侧漏","children":[]},{"text":"柳如烟，之前刷抖音总是会有一些小说视频的恶毒女配用这个名字，但其实还真不错，发音声调都很顺口，而且描绘的景也挺让人产生遐想的","children":[]},{"text":"高中隔壁班班长，长得帅成绩又好，父亲姓龙，母亲姓游，叫龙游于渊。","children":[{"role":"回应者","text":"龙游渊就很好听，加个于就是画蛇添足"}]},{"text":"柳啸野 女生 她爸文化人","children":[]},{"text":"黄梅星辰  公司团建碰到的妹子  我目不转睛盯了一路","children":[]},{"text":"鹿游原","children":[]},{"text":"大学时候对象的同学叫 凤鸣歧","children":[]},{"text":"野逍遥，我高中同学","children":[]},{"text":"操千曲，闻弦歌而知雅意，操千曲而后晓声。逆转拯救这个姓。","children":[]},{"text":"胡杨柔芷","children":[]},{"text":"以前福建附一医院的一个医生  慕容慎行","children":[]},{"text":"原来玩翻唱的群里有个女生。西安的。长的漂亮。条子好。歌也唱的棒。群里在西安聚会。聊天时说到名字。先都以为是开玩笑说的。直到把身份证拿出来。。。杨笑天。。。我人都麻了。。","children":[]},{"text":"看过一个小女孩的名字叫鹿饮溪","children":[]},{"text":"唐堂正正，陈着冷静。这俩还是一个班的。但我觉得一般。\n\n说个正经的好名字，姓唐，叫唐楷。","children":[]},{"text":"高一班里同时有两个名字，一个叫叶潇然，一个叫唐逸凡，妥妥古风男主的名字，但是这俩人形象一言难尽，挺抽象的","children":[]},{"text":"吴羡好     我觉得挺好听的","children":[]},{"text":"我一个博士师兄，叫徐徐霜降","children":[]},{"text":"是朕，一个学妹的名字","children":[]},{"text":"高中隔壁班女生姓叶，叫叶香尘，很有诗意。","children":[]},{"text":"雪暘，因为她出生的时候太阳刚出来，那天下了一晚上的雪","children":[]},{"text":"我有个同学叫寇枭 我一直觉得他这个名字太酷了","children":[]},{"text":"没见过，但是从别的地方看到过让我感到最惊艳，最具有中国式浪漫的，就是那个天生聋哑人的李观棋。","children":[]},{"text":"我妹他们同学，张尚明烛","children":[]},{"text":"娃班上有个叫屹川的，感觉是一股清流了。","children":[]},{"text":"我就服这种家长，明明给你个少见又好听的姓氏，各种想，最后取了个让人笑掉大牙的名。我上高中这一届就有三个神名：梅哲、季博、张弓长（就说他爹妈得有多不爱起名）。然后今天我才知道，有个叫乔智奥的兄弟，之所以起这个名是因为他妈姓赵。我还以为是个什么英文名音译过来的呢，这名儿取得太有水平了。","children":[{"role":"回应者","text":"我弟兄老婆也姓赵，他孩子也是戴智奥，我就说以后肯定一堆人叫他戴罩"}]},{"text":"龙飞利，女孩，应该取自易经，飞龙在天，利见大人","children":[]},{"text":"反而笑这个字用的好的话会很惊艳，我小学有个同学叫“白云笑”，我也姓白，这是我见过同姓里面最好听的名字","children":[]},{"text":"还记得初中时候，放考试排名的大榜上，看到一个名字叫石含玉，当时就觉得他父母一定是挺有文化的","children":[]},{"text":"工作上碰到一个人叫 万卿，当时真觉得很好听","children":[]},{"text":"我初中还是高中一同学来着，女生，叫缪 女 子。真妙啊。","children":[]},{"text":"我高中学姐叫龙施雨，shiyu这两个音挺常见的，但是姓龙和这两个字还是很惊艳的，我大学学长姓那，叫那时雨，也很好听","children":[]},{"text":"以前初中时候的美术老师，滕青红。名字青红，她又是美术老师，职业相称。青红两字与滕姓相连，很容易联想到青藤上长满红花的意象","children":[]},{"text":"以前看到一个高中女生的名字叫“兰亭秋”，感觉又好听，又有意境","children":[]},{"text":"林在山，路生梅。这两个名字记到现在。","children":[]},{"text":"我女儿姓方，叫方晴好，来自于 水光潋滟晴方好","children":[]},{"text":"我奶奶的名字\n她叫黄凤珍，你调转过来就是读真凤凰","children":[]},{"text":"同班的一个女同学姓修，单名一个羽字，本身也是那种长得白白净净性格温柔安静的女生。后来知道他爸爸单名一个离字，修羽，修离。","children":[]},{"text":"我大学女同学叫和秋遇，秋天生的，和你在秋天相遇。","children":[]},{"text":"现实里没有，但以前在网上看过一个贴子，印象深刻。楼主说自己认识一对姐弟，姐姐叫刘一弦，弟弟叫刘一柱，看起来平平无奇甚至有点俗，但关键他们有个很早过世的母亲叫张华年，姐弟俩名字是根据李商隐的诗“一弦一柱思华年”改过来的，这就太令人震撼了，也不知道真的假的。","children":[]}]},{"title":"黑神话之前，国产最佳单机游戏？","body":"在《黑神话：悟空》出来之前，你心目中的国产最佳单机游戏是哪款？","replies":[{"text":"我心目中的唯一答案：天地劫系列\n天地劫系列最喜欢的又是幽城幻剑录","children":[]},{"text":"戴森球计划，也是最有国际范的游戏，游戏性、画面、技术力都很有实力。很多大公司都解决不了的同类产品优化的问题，5个人的小团队就能解决。\n\n做游戏就是这样，有大佬带队才能出厉害作品。5个人就敢做宇宙直飞无缝切换，程序员手搓黑洞，太牛了。","children":[]},{"text":"幻想三国志2 很老很老的游戏","children":[]},{"text":"秦殇，铁甲风暴，生死之间2，自由与荣耀2，戴森球计划","children":[]},{"text":"戴森球，可以无缝飞入大气层没有黑屏","children":[{"role":"回应者","text":"玩过阿特拉斯星链，戴森球某些方面比育碧这个大厂做的游戏表现效果都好"}]},{"text":"戴森球，缺点是不是每个人都玩得来这种游戏","children":[]},{"text":"戴森球，这才是能面向世界市场的游戏","children":[]},{"text":"古剑3吧，至少皮向3A大作看齐了\n戴森球游戏类型还是小众了点","children":[]},{"text":"在我心里的话，仙剑1吧，戴森球游戏很好可惜我玩不明白，甚至云都云不明白","children":[]},{"text":"仙剑奇侠传3吧，放在那个年代是国产游戏3A大作，完成度高，剧情引人入胜","children":[]},{"text":"想了一圈，可能还是仙剑四吧","children":[]},{"text":"动物迷城，虽然严格来说还只是EA作品，但完成度已经太高了。","children":[]},{"text":"戴森球：黑神话，你才是挑战者","children":[]},{"text":"古早东西，流星蝴蝶剑\n现代的，戴森球","children":[]},{"text":"来个冷门的，国产galgame，真恋~寄语枫秋~。\n当年买的实体收藏版，送了一大堆游戏配件，。\n比如说，一个剧情是女主跟男主上课传纸条，然后有一个密封的信封封面写在这个时候打开，信封里面就是游戏里传的小纸条，字体都是手写体。\n还有像门票、相框这些东西，就很有感觉。我到现在都觉得这才是实体收藏版游戏应该有的东西，而不是一本设定集或者音乐CD了事。\n买高价的实体游戏，就要发挥实体的优势和特点，让游戏更“好玩”。","children":[{"role":"回应者","text":"这个当年Steam背景很贵专门买了个回来合徽章"}]},{"text":"轩辕剑3外传天之痕","children":[{"role":"回应者","text":"这么多年国产游戏最打动我的也是这一款"}]},{"text":"古剑奇谭3吧，虽然缺点一大堆但是真的算很不错的国产了，特别是结尾bgm千秋真的太神了","children":[]},{"text":"古剑奇谭3和天命奇遇2并列吧，都有硬伤主要。\n仙剑轩辕剑就太老了，只能是十多年前的巅峰","children":[]},{"text":"古3，戴森球技术牛逼是牛逼，但我玩不来这种类型。","children":[]},{"text":"炎龙骑士团2，幽城幻剑录。","children":[]},{"text":"rpg还是仙剑1印象最深，slg阿玛迪斯战记，动作类的流星蝴蝶剑，rts傲世三国，策略类的三国群英传","children":[]},{"text":"秦殇 秦殇的配音现在都属于降维打击了","children":[]},{"text":"说个古老的，圣女之歌吧，当年很有感觉可惜后面也IP烂掉了","children":[]},{"text":"古剑三要是投资翻一倍的话能比现在还好的多，可惜受制于成本很多没发挥出来","children":[]},{"text":"我还是更喜欢刀剑封魔录","children":[{"role":"回应者","text":"这游戏是做的真的精致，我小时候觉得比暗黑2还好玩"},{"role":"作者","text":"主要顶级搓招体验，我现在没事还玩玩"}]},{"text":"古剑三虽然当时在国产游戏里已经算是顶尖作品了，但是很明显卖相还是其他方面和世界顶级同类型游戏有着巨大差距，这也就是为啥说黑神话悟空是第一款3A，内核先不讨论，至少黑猴卖相上确实可以。而抛开rpg动作游戏放大到全体游戏类型来说，绝对是戴森球没有之一，戴森球做到了同类型游戏世界顶尖的水平，游戏各个方面几乎没有瑕疵","children":[]},{"text":"古剑3吧，主要给的剧情分","children":[]},{"text":"戴森球计划，断档第一","children":[]},{"text":"没出第三年的侠隐阁","children":[]},{"text":"潜伏之赤途/隐形守护者\n\n只属于我们自己的游戏","children":[]},{"text":"秦殇\n我甚至玩了1年多网游版的天骄","children":[]},{"text":"仙剑4  还有  太污绘卷\n\n仙剑差不多算是意难平 因为我高中开始玩到前几年才有时间去通关\n\n太污是不知不觉杀了我80个小时时间  刚出那会是最新鲜最好玩的  其他的大部分是10来个小时就没了 再也没有重新开档的兴趣","children":[]},{"text":"戴森球\n在某些方面打破了我对国产游戏的成见","children":[]},{"text":"剧情来说是古剑奇谭1和仙5前，游戏性来说是戴森球","children":[]},{"text":"戴森球，做到了同类游戏里面的顶尖水准","children":[]},{"text":"还得是戴森球计划, 国产里真没比得上的","children":[]},{"text":"戴森球真的断档第一。\n\n因为它不是“优秀的国产游戏”，刨去国产加成仍然有同类型顶尖水平。","children":[]},{"text":"我个人感情来说是绝代双骄123","children":[]},{"text":"只有戴森球了，这个够格，其他都差点意思","children":[]},{"text":"在我玩戴森球前我觉得是侠客风云传，玩了戴森球之后就觉得是戴森球了，太厉害了戴森球","children":[]},{"text":"二十年前的武林群侠传","children":[]},{"text":"风色幻想SP封神之刻","children":[]},{"text":"错过了仙剑1，后来玩玩不下去，我觉得是天之痕最好吧，任何年代、再过几十年各种技术迭代后来看都是好游戏。\n\n我的标准就是这种不会被时代淘汰的游戏才是最经典的好游戏。西方游戏的类似标杆就是辐射1\u00262，博德之门1\u00262，日本游戏的比如塞尔达时之笛。","children":[]},{"text":"老游戏我心目中的国产最佳是三国战纪1/2","children":[]},{"text":"古剑一，早期国产单机黑暗时期的破晓作品。也不糊弄，可以看见诚意在里面。整体质量也是不错，BGM也很不错。","children":[]},{"text":"文字类 潜伏之赤途  放在几十年游戏的经历里面也是神作中的神作\n经营类 戴森球，的确不错，我很几乎不玩这类游戏，玩的下去就是不错\n武侠类 云和山的彼端/仙1\nARPG 刀剑封魔录，这ip应该拿出来做魂like，很有那个调调\nRTS 傲视三国","children":[]},{"text":"当然是戴森球，因为无论什么文化背景的人都可以玩","children":[]},{"text":"戴森球，不卖情怀不搞噱头，没有什么民族主义文化加成，纯靠设计和技术力取胜，放眼全世界跟同品类游戏对比都有一战之力，我心里无可争议的国产最佳","children":[]},{"text":"刀剑封魔录，不仅国内，放眼古今中外，刀剑封魔录都是我心中t0的游戏","children":[]},{"text":"早年的话 流星蝴蝶剑\n近期 艾希 暗影火炬城","children":[]}]},{"title":"你最喜欢哪个原神四星角色？","body":"原神里，你最喜欢哪个四星角色？包括目前已实装的所有四星角色，以及下版本实装的米卡。","replies":[{"text":"雷泽，萌新时期靠他一点点砍出来的，他的日配也正好是我最喜欢的CV","children":[]},{"text":"莱伊拉，真的蛮漂亮的，是我第二个纯看脸拉起来的四星","children":[]},{"text":"芭芭拉，但是也很喜欢菲谢尔","children":[]},{"text":"对萝莉无感的我，唯一喜欢的萝莉也是4星里最喜欢的角色就是瑶瑶","children":[]},{"text":"秋秋人 不只好看而且还很强","children":[]},{"text":"珐姐，建模配音很难不心动","children":[]},{"text":"凯子哥，但是也非常喜欢罗莎莉亚姐姐","children":[]},{"text":"当然是旅途中邂逅的第一位朋友 安柏小天使","children":[]},{"text":"烟绯超喜欢日配的反差感，性格和有点倦怠的眼睛都长在我xp上(((有种介于社畜和享受工作的奇妙感觉x","children":[]},{"text":"小鹿，建模和配音都很棒，手感也是一级，玩起来很舒服","children":[]},{"text":"重云，减CD 加攻速 有附魔 多么全面的一个角色啊就是没有一个能进的队 真是憋屈","children":[]},{"text":"喜欢行秋！身上那股侠气很让人向往。","children":[]},{"text":"小砂糖和小艾咪。","children":[]},{"text":"早柚，日配真的很戳我，尤其是等级太低跑路过程中被意外打死的时候","children":[]},{"text":"行秋，旅途当中遇到的第一个让我惊艳的角色","children":[]},{"text":"我是强度党，强度我能当饭吃，所以我选行秋","children":[]},{"text":"烟绯，我当初一见钟情的角色","children":[]},{"text":"小米卡。支持可爱金发小男孩谢谢喵。","children":[]},{"text":"凝光，原神里最喜欢的角色","children":[]},{"text":"香菱开荒全靠她","children":[]},{"text":"小艾咪天下无敌外观人设剧情配音玩法强度全都完美","children":[]},{"text":"行秋，我侠肝义胆的小少爷。\n\n四星剧情里我最想看的就是他了，想多看看古华派的事，以后希望有个华山论剑的小活动","children":[]},{"text":"我喜欢九条姐姐","children":[]},{"text":"女仆天下第一！","children":[]},{"text":"外形最喜欢的是坎蒂丝，既然只能选一个还是选凝光了","children":[]},{"text":"真的好喜欢琺姐，那配音，那傲娇，那身材，那若隐若现的小裙子，那功能+辅助。。有点一拳的龙卷感觉。","children":[]},{"text":"云先生我的梦里都是你啊","children":[]},{"text":"珐姐好看！！我拍照拍最多的四星。","children":[]},{"text":"烟绯到现在还是我唯一一个火c，当初为了抽她命座应该是历经了三个池子，小律师这种活泼灵动的少女实在是太可爱了","children":[]},{"text":"小柯莱，因为看过原神漫画，实机与其相比很惊艳。","children":[]},{"text":"芭芭拉冲呀","children":[]},{"text":"安柏给了单皇冠和阿莫斯，等二命就补e的皇冠","children":[]},{"text":"小烟绯，毕竟带着我长大的，有感情这次抽护摩还出了四风，这不就是缘分(\n我还喜欢早柚小艾咪珐妹，但只能选一个那只能选一起长大的烟绯了","children":[]},{"text":"好兄弟托马","children":[]},{"text":"烟绯，喜欢小律师的性格和美术设计，粉毛碧瞳我好喜欢，手背腰身的白色鳞片还有垂下来的角，既点明非人血统又很俏皮可爱。最重要的是，1.4版本入坑抽了双神尤菈，再加上手感极佳操作简便的烟绯，度过了一个非常舒适的新手人生","children":[{"role":"作者","text":"其他原因的话，就是剧情人设加成，尘歌壶导引任务，逐月节厨王争霸，层岩更不必说。总之就是让人喜欢上一个角色，剧情还是很重要的。"}]},{"text":"猫猫，毕竟是从新手期一直陪伴我的人，我没抽过钟离","children":[]},{"text":"砂糖，软妹可爱捏","children":[]},{"text":"凯亚！！！\n希望剧情好好写，期待坎瑞亚戏份","children":[]},{"text":"班尼特，从开始陪我到最后的永远的伙伴","children":[]},{"text":"诺艾尔，是她拿着白影剑一路护我到渊下宫那个大日车舆底下给八重神子刷升级材料，她是我种门驾驶员了，满精月卡大剑和西风大剑各一把，37.2词条的脚斗士4套装，而且她的邀约任务那个拿着玫瑰花和爷在一起躺下草坪上的感觉特别戳人","children":[]},{"text":"小鹿，实装这么晚也没啥剧情但是喜欢他的人还挺多","children":[{"role":"回应者","text":"小鹿剧情虽少但精是邀约里唯一一个我反复看了好几次的，太有意思了"}]},{"text":"北斗上上下下里里外外完完全全长在我xp上","children":[{"role":"回应者","text":"我也是第一个想到的北斗大姐头"}]},{"text":"丽莎姐姐，就是很喜欢可以让我酥酥麻麻的大姐姐嘛","children":[]},{"text":"百岁珊！一眼万年的美女www\n四星里还有一个特别喜欢的是菲谢尔，日配超级加分，皮肤也很棒","children":[]},{"text":"97忍！","children":[]},{"text":"芭芭拉小姐！我喜欢你","children":[]},{"text":"红毹婵娟，庄谐并举\n云堇","children":[]},{"text":"长枪盾击真的很帅好嘛，总是感觉坎蒂斯能暴躁地跳上去斗盾跃击+贯星长枪\n而且坎蒂斯异瞳还是埃及女战神的造型真的暴杀我，偏偏还是温柔和蔼可亲的大姐姐\n\n要死了，坎蒂斯和迪希亚的臂甲都好戳我","children":[]},{"text":"天权凝光，富甲一方；明眸善睐，桃羞杏让；目达耳通,白了千当!","children":[]},{"text":"小律师真的可爱，待机动作也很有意思，层岩剧情又聪明又高情商。","children":[]}]},{"title":"周杰伦以前的专辑哪个最差？","body":"周杰伦以前的专辑里，你觉得哪张最差？","replies":[{"text":"本来个人第一反应是惊叹号，但是去专门翻了一下专辑，发现十二新作里常听的只有2首(明明就，哪里都是你)，而惊叹号有5首(迷魂曲，mine，琴伤，水手怕水，超跑女神)\n所以最垃专辑我投十二新作一票…","children":[]},{"text":"最新的最差","children":[{"role":"回应者","text":"就和WOW版本一样，当前版本最烂"}]},{"text":"惊叹号最差劲吧","children":[]},{"text":"惊叹号？好像这张专辑存在感比较低","children":[]},{"text":"牛仔很忙以后没有喜欢的，当然是越新的越差，反正不差钱了，就是玩儿～","children":[]},{"text":"那必须惊叹号了，太惊叹了","children":[]},{"text":"惊叹号跟十二新作二选一吧，后面的床边故事跟哎呦不错反而不错","children":[]},{"text":"七里香之后走下坡路，一张比一张差","children":[{"role":"回应者","text":"夜曲缓缓打出问号"}]},{"text":"老年人表示：越旧越好 越新越差","children":[]},{"text":"惊叹号 这个不用论吧，床边的故事至少还有告白气球撑着脸面，还有说走就走这种不错的快歌。诶唷，不错哦 还有算什么男人，手写的从前，听见下雨的声音。十二新作也有明明就 红尘客栈，大笨钟。惊叹号真不行，就Mine Mine 还不错，别的都没啥让人能记的点。","children":[{"role":"回应者","text":"明明就和红尘客栈不是很拉吗这种歌随便换个歌手一样能写一堆出来啊\n反观惊叹号里的迷魂曲，mine mine，超跑女神，琴伤，虽然乍一听挺奇葩，其实还是有周杰伦的灵气在的。皮影戏也能当个低配本草纲目听听"}]},{"text":"惊叹号，整张专辑没有一首歌喜欢听","children":[]},{"text":"公认是惊叹号吧，真的没一首出彩的。。。当时听都觉得周杰伦抽风了","children":[{"role":"回应者","text":"我觉得皮影戏可以"}]},{"text":"公认的惊叹号，热恋时期的作品","children":[]},{"text":"叶惠美往后我都不大喜欢- -。。虽然后续有几首还不错，但是没有整体优质的","children":[]},{"text":"惊叹号，惊叹号我就只喜欢水手怕水","children":[]},{"text":"惊叹号和十二烂作选一个","children":[]},{"text":"十一月的萧邦","children":[{"role":"回应者","text":"肖邦这么多经典的歌曲！！你确定最差？"}]},{"text":"对我来说那还真不是最新的最差，而是惊叹号","children":[]},{"text":"从十一月的萧邦觉得下滑了，从牛仔很忙后面觉得垮到一张专辑里面得挑个别的几首歌听。","children":[]},{"text":"惊叹号的皮影戏，水手怕水，公主病还可以，不过确实在一众里面算不能打的","children":[]},{"text":"把最新的几张专辑翻出来听了一遍，我感觉是床边故事最糟糕，整体上没有前面的专辑让我有更多好感。","children":[]},{"text":"十二新作，惊叹号我喜欢的歌还不少","children":[]},{"text":"魔杰座开始下滑 惊叹号到底了","children":[]},{"text":"惊叹号，后边的反而都有不错的歌","children":[]},{"text":"十二新作和惊叹号二选一吧，虽然挺喜欢惊叹号里水手怕水、超跑女神、minemine、迷魂曲这几个的，不过十二有公公偏头痛我会更偏爱十二新作，只能委屈惊叹号垫底了。","children":[]}]},{"title":"你在办公室都吃过哪些瓜？","body":"你在办公室里都吃过哪些瓜？","replies":[{"text":"以前我在办公室经常吐槽老板，后来办公室竟然有一个嫁给了老板。尴尬了","children":[]},{"text":"某领导天天找我麻烦，然后别人跟我八卦他贪污腐败，后面判了13年。。。说真的开心了好久","children":[{"role":"回应者","text":"放一挂鞭炮庆祝一下"}]},{"text":"其他科室主任，还是博士，把科里医工的肚子搞大了，关键她老婆非常漂亮，手术室的护士。医工还把孩子生了下来。后来夫妻两个辞职回老家，那个医工追到老家，据说后来和平相处了。","children":[{"role":"回应者","text":"医工好看吗"},{"role":"作者","text":"护工能好看到哪里去？就是平时陪护病人的。能有她老婆好看？"}]},{"text":"一整个办公室五个女人三个和总经理关系不一般","children":[]},{"text":"我办公室里一个男生和一个女生搞在一起，见过男生朋友圈发老婆孩子给他过生日，也见过他在地铁上贴着那个女生暧昧，还见过那男生在微信里喊那个女生宝贝。那女的又胖又矮又丑。每次那女的加班，男的必在。俩人每次故意前后进公司，但是奈何和我一路的，我碰到过好几次。互相带早饭，带咖啡。","children":[]},{"text":"吃散伙饭的时候，听当事人本人讲述的。\n背景一：领导女(也是我的领导），挺漂亮的，已婚，两口子在同一公司，有个孩子，经常看到领导微信晒幸福。\n背景二：同事男，不算高，白净，微胖，带眼镜。刚毕业没多久，新加入团队。\n有一次同事在大厅等接待，女领导和他老公正好路过，顺便帮他办了接待。\n领导的老公这次见过这个白净微胖的同事后，不知道从哪找到了同事的联系方式，开始联系同事，周末还杀到了同事老家楼下送礼物。还让同事向前张开五指，然后十指扣住，后掌啪啪撞击，问，你知道这是什么意思吗？同事吓惨了，咬死了说兄弟情……后面还骚扰了同事几次。同事就一直躲，最后不了了之。\n同事离职的时候，请团队的兄弟们吃饭(无领导)说出来的。真人真事。\n领导老公的一些特征，1米9左右，络腮胡，很壮。","children":[]},{"text":"小私企，老板跟市场部女的搞上了，钱没谈拢，女的掌握着公司官网的账号，结果把老板的果照发官网上了。","children":[]},{"text":"财务和研发基层领导搞到一起了，在办公室找刺激被人发现了。最后财务她家人到公司拉横幅","children":[]},{"text":"曾经偶然间看过两个女同事的聊天软件，两人都结婚出轨。关键是我只看了这两个，两个都出轨，可能女人出轨的概率比你们想象中的大得多，只是各位男主角不知道而已。但我也没跟任何认识的人提过，没有声张过这些事情，跟她们说话的态度也没有任何的变化，我并不想对别人的生活造成任何的影响，就纯看戏。毕竟这种事情可能会出人命。","children":[]},{"text":"我一个同事姓葛，扬州，在南京做医药的，之前被公司财务大姐包养，吃喝嫖赌样样占，找了个扬州富婆上岸了","children":[]},{"text":"我的瓜啊 把大7岁的同事姐姐处成炮友 后来发漏骨信息发错到了工作群里","children":[]},{"text":"一个离异带娃女下属，每天晚上搞直播，榜一大哥不知道被骗了多少钱还是怎么得罪了他，每天来我们单位周围巡逻扬言要弄死她；另外天天有人给单位固话打电话，说她欠了钱要她还钱。\n\n还是该女，有一天来了三个人把我堵在了办公室，问我能不能开除她，我听了半天云里雾里，后来才搞清楚，原来是该女前一天晚上约男人唱K，被男人老婆抓现行，俩女的在ktv打起来了，该女用盘子把原配眉骨给开了，原配去医院处理，结果老公和我这女同事人直接不见了，这原配也不说报警，第二天头上缠着纱布带着自己的妈和公爹三个人来我们单位找人，质问我为啥不管理该女……生生哄了一个点才放我离开。","children":[]},{"text":"之前公司来了个实习的妹子，天天黑丝短裙小高跟，后面跟老板搞在一起了，再后来老板娘知道了自己跑公司来当财务把那妹子开了，还是没用离婚了，老板和那个妹子经常发朋友圈秀恩爱，两个人差了二十岁左右","children":[{"role":"回应者","text":"妹子颜值咋样"},{"role":"作者","text":"挺好看的，身材也很顶"}]},{"text":"我哥同事一男一女在办公室晚上搞起来了，被监控录下来了，领导把两个人辞了，结果发现那个男的和领导老婆还有一腿，而那个领导也想骚扰那个女的，知道的时候我都蒙了。","children":[]},{"text":"我以前公司一个女领导和新来的男研发人员搞一起了，当时有车间夜班开叉车员工去仓库取料看见他两，后来这事被女领导老公就是公司销售经理知道了，男研发人员就突然被离职了","children":[]},{"text":"我们公司的副经理，把刚来半年的，财务科负责开票的小姑娘给睡了，不过那个小姑娘也是不自重的那种，怎么发现的呢，她的手机坏了拿给我帮忙看看，然后就在相册里看见她自己的L照，还有两个人完事后，她拍的副经理L睡的照片，当然都是她不知道的前提下。而且也不知道是不是我的错觉，她也试图勾引我来着，当时我是办公室主任，她穿着短裙坐在我的桌上看我帮她弄报表，姿势风骚的很，反正我是忍住了，只是偷拍了几张照片而已，估计我们那个副经理是没忍住。更炸裂的是，这件事过去没多久，她就结婚了，估计她和副经理上床的时候，一直都是有男朋友或者未婚夫的。","children":[]},{"text":"部门老大女的 52岁退休反聘已婚丁克\n男的27\n在一起了 开始还挺好 后面男的估计受不了了外面去面试 问题靠睡上来的没真才实能外面也不要啊\n还在那待着","children":[]},{"text":"以前的组长，很阴险的一个人，他老婆也是同公司的，我们部门跟他老婆的部门中间隔了2个部门，隔了还不到10米，他跟他老婆部门一女的有染，出轨那个女的跟他老婆的办公桌还是挨着的，有一天中午上班看见他脸上红红的，跟我另一个同事说被老婆发现了被扇了一巴掌。","children":[]},{"text":"我在办公室吃过的最大的瓜...\n\n嗯...足足20多斤！","children":[]},{"text":"之前寒假兼职过网管 太炸裂了 那个女的30岁出头 一下子谈了三个 那天是我和他搭班 她三个男朋友都来了 他一会去A区陪 一会去包厢陪 一会去最远的C区 给年幼的我看呆了","children":[]},{"text":"已婚来上班，后来怀孕生子，4个男的做亲子鉴定才确认生父的","children":[]},{"text":"我以前和一个设计院的进行技术沟通，声音巨好听，听声音就感觉是那种高分年轻女大的声音，但总是电话联系没见过面\n\n一次和设计院的设总聊天，突然问到那姐，设总听后哈哈大笑说她快退休了。。还专门补了一句：声音特有欺骗性是吧？","children":[{"role":"回应者","text":"之前干项目有个代理大姐，声音巨甜，项目采办经理没见过想入非非，结果人都退休了。"}]},{"text":"隔壁部门招了快毕业出来实习的小姑娘，做团队助理，四月份招的吧，六一的时候和和他们经理去上海出差，回来支行没多久就不见人了，我以为离职了，结果说是回家养胎呢，人家姑娘家里来人了，堵了那个经理的门，后来商量好了，怀孕了就结婚，十月份的还发了拍婚纱照","children":[]},{"text":"我爸单位一个比我小两岁的小伙和一个比我大一轮的已婚女同事搞在一起了，女同事老公也是一个单位的。后来女的老公觉得孩子都那么大了而且俩人其实一直都是挺默契各玩各的他自己在单位也有个红颜知己所以就那么睁一只眼闭一只眼凑活继续过吧。\n谁知道那个小伙上头了直接在他们部门团建的时候扑通一下来了个下跪求婚，把大姐一下子拿住了，也非嫁他不行了，说啥都得离婚然后嫁给他。\n俩人孩子也上小学了。","children":[]},{"text":"我一女同事，95 的，上着班好好的，突然就离职了，原因说去南方发展，都不信，因为从来没听她整理过。最后才传出来 单位一把想潜她，她不从，直接辞职了，主要是漂亮身材还好。","children":[]},{"text":"当时为了怕文件丢失，我和同事们在自己的电脑前安装了监控，开机就会自动启动，有一天周末，领导和组里女同事加班，要用我电脑，他们办公室play的视频从头录到了尾...","children":[]},{"text":"58岁的老板，老婆常年在香港，公司前台，隔壁公司前台，楼下前台都给他生了一个","children":[]},{"text":"我当年刚上班时，有一次偷听到几个女同事讨论说一个刚分配的男大学生被某女领导包养，我在旁边办公室听的津津有味，细节说的很传神，我还想入非非呢，后来才知道，她们说的那个男大学生是我","children":[{"role":"回应者","text":"那你到底有没有被包养啊"},{"role":"作者","text":"我其实也想等着人家宠幸我，实在不想努力了，也想走点捷径"}]},{"text":"有一个瓜是我们当时公司的保安大叔说的，就是有一个男的，已婚，和另外一个女的，未婚，都会加班的挺晚才一起下班，男的开车带女的，出了公司门口，就直接开到对面的工地草丛里，大概半个小时才开出来\n还有一个是当时我们参加一个活动，找了一些年轻的兼职，结果没过几天，其中一个女生居然来上班了，那种学校刚毕业的，然后听另外的经理说，这个女生和总经理搞在了一起，当时我还不太信，没过两天我看到这个女生在总经理面前撒娇发脾气，当时我都惊呆了，感觉如果没有那层关系，一般刚进公司的女生怎么可能会对总经理做这种事，更炸裂的是，后来这个女生和我们一个男同事又在一起了，直接就住在男同事家里了，不是男同事租的房子，是直接住到男同事家里，爸妈都在的那种，不过后来他们也没有走在一起，找了一个更有钱的","children":[]},{"text":"真事，有次晚上加班，对面另外一个部门姐姐看片，我从她后面窗户反光看的一清二楚，还快进着看","children":[]},{"text":"以前在国美上班，客服有一个四川的妹子，20多岁，长得很清纯，人也很文静，穿的很朴素，平时基本不化妆，身材很一般，基本是平板身材，结婚了跟老公异地。有一次我一个很好的兄弟说他把这个女的给睡了，说这个女孩子瘾很大，中午一小时吃饭时间都要拉他去隔壁酒店开房来一炮，有时候是直接开车去梧桐山脚下吃饭，吃完饭把车开到一个偏僻的地方直接在车上搞。我开始还以为他开玩笑的，因为那个女孩子平时看起来挺文静的，又很低调，就安心做事。压根就不像那种水性杨花的女人，没想到这么大的反差，我兄弟总结的是:穷胸极饿。","children":[]},{"text":"单位一个20多岁的小姑娘和一个快50的男的搞上了，小姑娘漂亮又水灵。男的也是帅气的一批，很爱打扮且则很会打扮。后来被大家知道了，小姑娘考走了，然后在新的单位又找了一个虽然20多岁但花花公子的男朋友","children":[]},{"text":"当年在广东上班，住公司宿舍四室两厅，六个人。 两个男的一间房，两个女的一间房， 我一间房， 另一个女的一间房， 一次团建之后，那女的喝醉，我背她进房间， 从那之后，每天晚上微信往来， 一个星期左右，每当夜深人静大家都睡着了，她就邀请我过去切磋切磋。 在那之前，我们经常在办公室互怼，相互看不顺眼。 在那之后，给我打扫房间，给我收拾晒干的衣服。后来她男朋友来了，介绍给我认识，她带着男朋友，我带着女朋友，一起吃了个饭… 这样的关系，维持了两三个月","children":[]},{"text":"有天去早了，发现公司一男的和保洁阿姨从小仓库出来。","children":[]},{"text":"我们这的两个同事搞一起了，他媳妇打电话过来大骂，闹的全单位都知道了。最后男的离职了，女的还在单位呢，平时极其低调（以前各种张扬）。","children":[]},{"text":"半夜11点半，我们办公室一个87年的男的跟一个02年的女的在办公室，关灯把门反锁了，我不知道，半夜会办公室拿衣服，一顿敲门，最后敲开了，女的在门后面躲着，后来我以为他俩再也不会去了，结果相反，被我发现之后，他俩之后天天去。","children":[]},{"text":"我们以前房地产项目部，我们组，有一天晚上大家吃夜宵回来，凌晨大家一起送女销售的回住处（租的私人房），撞到已婚老总从一个已婚女组长（他说不舒服没参加我们夜宵）送别下离开，当然他们没发现。。。。那女组长天天经常跟老公秀恩爱，还自立独立人设什么的","children":[]},{"text":"单位里一个谣言传的有鼻子有眼，说7月份新来的男的，只用两个星期，就把某个已婚女的睡了。我过了接近一周才反应过来，整个7月份，不论男女，特么就我一个新来的！后来才知道，人家说的是单位另外一个分区的……","children":[{"role":"回应者","text":" 须弥读的话还是生论派吧，去野外研究动植物还挺有意思的(反正二次元世界没有蚊虫","children":[]},{"text":"我选提纳里吧，反正有柯莱陪我一起挨骂","children":[]},{"text":"提纳里吧，脾气好\n卡维太穷了，导师都这么穷学生岂不是更惨","children":[]},{"text":"因论派对一切历史皆 抱有怀疑，所以不需要导师","children":[]},{"text":"想选珐露珊前辈，天天缠着她问问题","children":[]},{"text":"妙论派。不仅贴合三次学术背景还能近距离观察大佬做设计\n才不是贪图卡维美貌呢","children":[]},{"text":"三次元知论派学子表示只能选艾尔海森……笑着活下去.jpg\n\n但小提的选修课会被我选爆","children":[]},{"text":"选多莉，拿了那么多灌装知识又不用，说明肯定有更猛的底牌","children":[]},{"text":"选小提！感觉跟他说话不会费劲，也可以直来直去的，有问必答还会细心观察你的状态，对学生非常关心的样子。说话可以可以只考虑学术","children":[]},{"text":"提纳里因为他是生论派的，我是养猪的。我可以吃掉他的论文","children":[]},{"text":"明论派莱伊拉。可惜她并没有教师的派头。莫娜做明论派的导师感觉不错，但我记得她好像没有在教令院读过书？一直跟着魔女会的“老太婆”学习，那莫娜应该是从属于魔女会。\n因论派目前还没有自机角色，剧情比较多的就只有一个提尔扎德，而且他也不像能做老师的样子。仔细想想，因论派也确实不太好出角色，在这个世界树能被修改的世界上，把历史作为毕生的追求实在不是什么明智之举。","children":[]},{"text":"提子，有耐心有学问要求严科目也好玩，下能田野考察上能怒怼校董(多特雷：？)，听课的时候还有大耳朵可看(可幻rua\n\n导师界的白月光","children":[]},{"text":"选卡维，对学生会非常真心实意的好好对待吧","children":[]},{"text":"珐露珊   想尽办法骗她说喵","children":[]},{"text":"珐姐 我自己本来就是汉语言文学的\n而且我现实里特喜欢年龄大的女老师\n提瓦特里也喜欢珐姐","children":[{"role":"回应者","text":"珐姐可是甜妹"},{"role":"作者","text":"年龄大指经验多啦"}]},{"text":"三次算是知论和因论都有学。\n到提瓦特当然要学特色的素论啦\n\n导师选海哥，反正答辩已经过了，完全不想考虑毕不毕业，我只想每周组会看看导师的胸和腿和脸，说不定还能私下蹭一蹭饭","children":[]},{"text":"往前五百年我想选博士","children":[{"role":"回应者","text":"博士：这次的实验材料 就靠(shi)你了"}]},{"text":"肯定提纳里，一年这么多篇论文，随便打打工蹭一蹭就毕业了","children":[]},{"text":"丽莎阿姨我可以\n快来指导我吧～","children":[{"role":"回应者","text":"想体验酥酥麻麻的感觉"}]},{"text":"我选妮露法\n问就是学生毕业多灾多难如此导师也没有放弃她","children":[]},{"text":"卡维，好善良，肯定不会卡我毕业","children":[]},{"text":"必海哥 哪怕他让我重修论文重写()","children":[]},{"text":"我估计就选卡维了，性格好相处，本身学术能力也够高，穷点就穷点，最后论文搞不出来说不定给卡维卖卖惨就毕业了","children":[]},{"text":"我玻璃心，受不了太毒舌的批评，同时又菜，需要严格的同时情商不低的导师\n\n且不想和导师一起喝西北风\n\n所以选提纳里，虽没有大富大贵，但至少有稳定岗位和居所","children":[]},{"text":"我选卡维，感觉卡维是那种我要是毕不了业他比我还着急的那种，没钱就没钱吧，毕业最关键","children":[]},{"text":"那肯定是知论派珐前辈 符文学和古机关超棒的好吗\n当然一百年前的不老前辈更棒","children":[]},{"text":"只看老师那必然卡子哥莱伊拉这种，善良随和相处想必不会太难综合学科考虑那我选赛诺","children":[]},{"text":"我选珐露珊 我嘴比较甜","children":[]},{"text":"卡维或者珐姐吧毕竟专业对口，再来一次罢了。他俩风格感觉会和我的毕设导师很像，生怕我憋不出论文毕不了业，时刻关心论文进度，遇到瓶颈计算陷入死胡同了暗戳戳给提示，两个都是须弥傲娇系代表人物，口是心非心最软","children":[]},{"text":"真要选肯定选卡维的啦，小提应该是错了一些很离谱的错误会骂你但是学期末会curve成绩，赛诺是平时很严格打分还可以但是你去help session会很耐心给你讲错题的，卡维就是上课不枯燥作业量可以接受分给的很松就算是早八课也能秒没。海哥的话 反正我不敢选！","children":[]},{"text":"高中时候最喜欢同时也关系最好的老师就是班上同学都很怕的那种(不怒自威型)。当时把“让这个看起来大家都怕的老师认可并且看重我”作为目标，那门课直接起飞。\n\n海哥虽然看起来冷酷但是骨子里是惜才型的。包括他对卡维的仗义应该也有部分是因为卡维是他们系的天才。","children":[]},{"text":"赛诺吧，大风纪官天天出门，我比较喜欢被散养","children":[]},{"text":"当然是海哥\n\n高岭之花对男女都没兴趣 不用担心衣冠禽兽\n\n自己都是个摆王下班就溜，不用担心导师抓着你996\n\n会站队有脑子，不用担心被排挤和经费不给批\n\n话少，可以把和导师的社交降到最低\n\n同为摆烂派的我的梦中情导","children":[{"role":"回应者","text":"什么都好就是可能毕不了业"},{"role":"作者","text":"艹了！\n那我天天晚上去他窗前做模型"}]},{"text":"我选莱依拉，将心比心她应该不会留太多课题","children":[]},{"text":"当然是海哥，不需要无意义的社交。而且他给硬性指标下来，我按指标完成就好，目标明确，效率喜人。","children":[]},{"text":"提纳里，这样就可以找科莱抄作业了()","children":[{"role":"回应者","text":"讲道理以一般人水平，柯莱求你抄作业还差不多。"}]},{"text":"卡维请他喝酒灌醉了应该就能毕业了","children":[]},{"text":"要选就选卡维，因为卡维不懂的会跟艾尔海森讨论，艾尔海森不会拒绝卡维，那我相当于有两个导师","children":[]},{"text":"我选艾尔海森老师，首先我很喜欢知论派的研究内容，其次我希望我的导师可以当我不存在，我也希望可以当我的导师不存在，我俩互不干涉。还有不得不相处的时候，如果我的答辩是依托答辩的话，艾尔海森老师还会奖励我惩罚我，用看垃圾的眼神看我","children":[]},{"text":"除了摆烂人，本科以上选导还管啥关系处不处得好啊，学术指导能力强不用social\u003e一切好吧，心理承受能力够的话必然首选海哥，平时摆烂不用社交，没有乱七八糟的周会研讨会，充分时间自学自己探索喜欢的方向\n但对你的论文和观点一眼就能看出问题，随口说的几句话就是能创新突破的点，还愁什么找不到方向而且按照这个方向只要写出来了，院审校审盲审闭着眼睛过","children":[]},{"text":"散兵现在不也在须弥吗？我想让他来当导师，就是想看他心里烦得要死但是又被迫教书带学生的样子","children":[]},{"text":"卡维，卡维可是能一个干完整个团队活的狠人，有他在根本不怕课题出差错。\n而且人美性格好，天天待在一起幸福感拉满。\n日后毕业有啥困难，卡维也会二话不说直接帮我解决。","children":[]},{"text":"我必选散兵，然后举报他学术造假","children":[]},{"text":"必然是卡维，绝对天使导师\n\n大概率不会骂你，对你和气友善有问必答，外加关心学生身心健康……\n最重要的是如果我做不出来，他甚至可能会自己主动帮我做，绝对不愁毕不了业","children":[{"role":"回应者","text":"禁止pua导师！"}]},{"text":"如果单纯从高校读博选导师来看，必选小提：年轻且有精力指导学生，性格不错会手把手带人，人脉够广，上到大贤者下到禅那园，经费足项目多，圈里圈外吃得开，在生论派的领域内已经自立山头了，每年发paper做横向，组里人手也够，只要跟着做，毕业不成问题，甚至毕业之后留在须弥教令院的可能性也大。","children":[]}]},{"title":"魔法少女转生，你选什么属性？","body":"如果能转生成魔法少女，你会选哪个汉字或单词作为自己的“属性”？基本遵循同级潜力相同法则，例如选 weather 比较全能，但在单一属性方面就比不上 thunder 或 sun。","replies":[{"text":"冰， ldren":[{"role":"回应者","text":"三千世界刀是三天刀的升级，在怪物猎人F里登场的\n全名叫“三千大千世界无双刀”"}]},{"text":"霜之哀伤，火之愉悦","children":[{"role":"回应者","text":"霜之哀伤，火之高兴。"}]},{"text":"帝陨，群星之怒","children":[]},{"text":"BIG FUCKING GUN","children":[]},{"text":"一把带来毁灭的武器","children":[]},{"text":"寡妇制造者 简单粗暴","children":[{"role":"回应者","text":"下联：老巫榨汁机"}]},{"text":"寒冰破魔枪","children":[{"role":"回应者","text":"红莲落神枪！"}]},{"text":"圣光将熄\n配合ICC的背景，真不戳","children":[]},{"text":"博德之门里的 苍白的正义","children":[{"role":"回应者","text":"冰风谷还是博德来着？"},{"role":"作者","text":"好像是冰风谷，那时候头一次遇见一件装备有这么多文字的背景描述。尤其是这件装备还是那种一看不起眼，一看背景和特效非常叼的那种"}]},{"text":"我不太喜欢那种谁谁谁的XXXX，感觉有点尬\n我感觉最帅的一个是霜之哀伤，一个是最后的轻语，这俩名字都既雅致而且又暗含了一点武器的效果","children":[]},{"text":"苍白的正义\n\n这是一柄传奇的神剑。“正义苍白而谦逊，但绝非无力之物”\n铸造这把剑的目的只有一个：毁灭邪恶。虽然它是如此强大的武器，'苍白的正义'却有个相当平凡的出身。\n这把朴素的剑是由一位名叫雷诺的人所铸造，他是一个虔诚的提尔信徒。雷诺花了三十年的时间将加工金属的技术练到炉火纯青，也因此他能制造出毫无缺点的刀刃。就在雷诺完成这把简朴的武器后，他立刻便将之奉献给提尔教会。收到这把剑的牧师将它放在修道院的祭坛上。他要求教会中的弟兄们与他一同向提尔祷告，愿赋予这把剑神圣的力量。然而弟兄们却从来都不碰这把剑，甚至从不提到它。十年后，当其他牧师们都已放弃对这把剑赋予神力，发起的牧师伊丹，却持续默默地祷告著。又过了二十年，提尔依旧没有显示任何神迹。前来拜访的海姆牧师嘲笑伊丹盲目地信仰著这把剑。这时，伊丹突然起身走向祭坛，轻柔地将尘封已久的剑从祭坛上拿下。\n海姆的牧师问伊丹，你是不是终於恢复理智了。伊丹回答说，自己一直都很清醒，然而过去却对提尔企求了错误的事物。他说提尔早在很久以前就完成了这件事。\n海姆的牧师放声嘲笑伊丹的这番声明，并叫他的贴身护卫拔出剑来。海姆守卫手中的华丽武器，护手上镶嵌著珍珠、刀刃上刻满了符文，还镶有一堆细小的红宝石。海姆的牧师笑著说，你的武器就像是一般士兵带的刀，跟我们的比起来实在逊色多了。\n伊丹平静地握住剑柄，将剑挥向海姆守卫的武器。海姆牧师的笑声很快地消失了，他只能死盯著守卫的断剑瞧。当伊丹放下剑，海姆牧师不发一言地呆力在原处。伊丹说：\n“正义跟虚荣、虚有其表的力量相比，本来就是逊色而苍白的。然而我却期待提尔能在这把剑上，以闪电或火焰来彰显其神迹。我早该想起这把剑是如何交到自己手里的……只是由于单纯的博爱与谦卑。正义适用在每个人身上，不论贫富贵贱，不论知识高低。不论在农夫的田里或战场上，正义无所不在。”\n伊丹把剑交到当地的武器店里，订作了一个木制、包裹皮革的护手。接着他便把剑交给了一位新任的圣骑士，并教导他永远要记得人类心中慈爱与良善的潜能。","children":[]},{"text":"凶刻[时雨]\n凶针[水祸]","children":[]},{"text":"魔剑阿波菲斯","children":[]},{"text":"风暴管束者只有风暴才能击倒大树，FNNDP","children":[]},{"text":"有坚不摧之力 最实在的武器","children":[]},{"text":"逸龙剑_抉择，生死轮盘_玩命","children":[]},{"text":"二哥的充气小伙伴","children":[]},{"text":"洛萨之锋莫名觉得帅\n\n钟剑斧壶塔 琴鼎印镜石 再就是这种单个看一般 连起来成套的也很帅","children":[]},{"text":"霜之哀伤\n要论格调，灰烬使者比霜之哀伤还差一层","children":[]},{"text":"说到炫酷名字立刻想起一个老游戏就是幽城幻剑录~\n\n法术和物品的名称都特别狂霸酷拽还很有文采，堪称高端装逼了\n\n法术：\n幽剑冥引\n玄凛冰煞\n瞬霎神仪\n天将奔烈 n":[]},{"text":"在b漫看到一个弱智翻译，把live house翻译成了生活馆我还想了半天生活馆是个啥","children":[]},{"text":"《人间失格》(原作名：《人間失格》)","children":[{"role":"回应者","text":"人间失格完全就是塞翻。如果说失格作为动宾结构的汉字词还能猜出“失去资格”，人间这个词简直就是莫名其妙。日语里的人间是指人，和汉语的人间不一样。对于没怎么接触过日语文化的人来说，人间失格从头到尾都没办法理解“失去做人的资格”，甚至连失格都搞不懂是什么意思。"}]},{"text":"点名批评怪物猎人冰原的翻译，怒飱恐暴龙翻成煌怒恐暴龙(设定是老年龙属性溢出，哪里煌怒了)，地啼龙翻成天地煌啼龙(日文汉字就是地啼龙，而且能力只有影响地脉，天在哪？)，还有溟龙强行变成溟波等等，但是最恶心的翻译还要属于赤龙(日文官方汉字也是赤龙)翻成冥赤龙，官方设定集明确赤龙这个名字就是为了对标黑龙，如果用赤龙没人会怀疑其禁忌的定位，结果到现在还有一群人不认为赤龙有禁忌的能耐一大半都得归功于这个擅自加戏的翻译组。","children":[]},{"text":"守序中立：普通に=普通地","children":[]},{"text":"星星叫","children":[]},{"text":"刑吏查略特","children":[]},{"text":"乱马严重影响阅读的b漫翻译，明明是两个人发生矛盾解决矛盾感情有所进展的剧情，乱马对小茜一口一个biao子","children":[]},{"text":"紫罗兰永恒花园 ，明明是人名，竟然意译，堪比美国总统灌木丛","children":[]},{"text":"哥哥打地地","children":[]},{"text":"Last of Us 美国末日","children":[]},{"text":"虽然不算最差吧但我不是蛮喜欢把Aquaman翻译成海王\n原因就在于Aquaman这个词本身就跟王没有关系，之所以翻译成海王是因为亚瑟的另一个身份是七海之王。但是持有Aquaman这个名号的也不单单只有亚瑟一人，像少正里亚瑟就把名号给海少继承自己专心当七海之王了，但这个时候Aquaman如果还被翻译成海王就很莫名其妙了。","children":[{"role":"回应者","text":"我当时就吐槽，原本一直是叫水行侠的，突然有一天就变海王了，最关键的是这导致他哥Ocean Master的翻译变得很难绷了，海霸王？"}]},{"text":"逆裁4的“布英该友画”，“布应该植说”二人组和逆裁5里的“泥矢定乐”。虽然知道是谐音梗，但是看到以及读出来这些名字，每次都会觉得很难绷。","children":[]},{"text":"环游记系列，奇缘系列，总动员系列","children":[]},{"text":"以前用网易云的时候，是哪首英文歌，全翻译成文言文那种，看得我直皱眉，應該是I hate u I love u或者young and beautiful吧","children":[]},{"text":"虽然都看习惯了，但其实卡卡西，依鲁卡和阿斯玛就很奇怪，完全是日式角色却像欧美角色那样直接音译\n卡卡西和依鲁卡照译是山案子/鹿惊和海豚，这两个不用我还能理解，可是阿斯玛有个很不错的译法叫游马啊","children":[]},{"text":"《兽娘动物园》\n\n把“けものフレンズ”翻译成“兽娘动物园”，“动物朋友”信达雅全齐多好，“萌兽之友”差点但好歹符合直译，这一个和原意差了十万八千里远的译名是怎么想出来的？！看见宣传图是兽娘，又看见简介里提到“动物园”，于是就直接暴力拼接到一起搞个擦边球标题党，搞得这番像是有软色情内容似的，断送了不知道多少潜在粉。","children":[{"role":"回应者","text":"这个还可以理解吧，毕竟你也不想用搜索引擎的时候搜“动物朋友”给你弹出来一堆动物世界之类的寓教片吧"}]},{"text":"火影四战里懒与金银角对战时，他的两个名叫冷与热的帮手被音译为萨摩伊和阿赤伊，看得我不太舒服。火影里有很多忍者都是类似冷热这种单字的搭档，所以看到这里绷不住。","children":[]},{"text":"看夏娜的时候 一直有一个名词 弗莱姆黑兹 我搞不明白是什么意思 直到后来看了小说 才知道是火雾战士","children":[]},{"text":"22世纪杀人网络","children":[]},{"text":"超弩级","children":[]},{"text":"太  空  战  士","children":[]},{"text":"《女仆咖啡厅》","chil "我要和命运战斗然后赢","children":[]},{"text":"想到会有人说Blade没想到大家都在说Blade 这个结局每次重温的时候都会流泪 不过最喜欢的大约是555 终于找到了梦想的巧 穿破了那层命运隔阂的黑网……","children":[]},{"text":"忘不掉的faiz","children":[]},{"text":"我还是好喜欢build的大结局，拯救世界却被世界遗忘的战兔看到龙我的那一刻真的太好哭了这个世界上总会有人记得你","children":[]},{"text":"虽然论剧情空我永远是我心目中最佳没有之一 但是如果说结局，我真的是从剑崎盯着绿色血液若有所思开始痛哭到最后 明明是最好的解法，没有人为此死亡的结局，为什么我的心却这么痛","children":[]}]},{"title":"最爱周杰伦哪一首歌？","body":"只选一首，说出你最爱的周杰伦歌曲。","replies":[{"text":"《同一种调调 》，当时有个女生叫调调……","children":[]},{"text":"本草纲目(踢腿中)","children":[]},{"text":"七里香\n那年穿过学校的操场，我看这她在围栏上方向我招手，笑靥如花。\n校园广播的，正是首发的七里香。","children":[]},{"text":"七里香 这首歌出来的时候正好暑假在画室和初恋一起练素描 听着电台放这首歌 到手中的铅笔在纸上来来回回这一句就特别觉得这首歌怎么能这么好听 以后每到夏天我都会特意拉出来听一下再次感受一下17岁那个夏天的风","children":[]},{"text":"鬼鸡","children":[]},{"text":"为什么就我喜欢东风破？","children":[]},{"text":"都喜欢，最喜欢的就选娘子吧。毕竟B站他的合集第一首就是娘子我听的最多。","children":[]},{"text":"那只能选当年全班都会唱的《七里香》了","children":[]},{"text":"太多了，不同时间段在心中都有不同的第一，最近很喜欢《雨下一整晚》，所以我暂时选这首","children":[]},{"text":"夜曲一响，杰伦领奖","children":[]},{"text":"后视镜里的世界","children":[]},{"text":"稻香，手机铃声就是这首","children":[]},{"text":"没有人喜欢手写的从前吗","children":[{"role":"回应者","text":"来了家人"}]},{"text":"故事的小黄花，\n从出生那年就飘着","children":[]},{"text":"只能选一首就一路向北吧\n\n喜欢的太多了，真要说不喜欢的还能全说出来","children":[]},{"text":"夜曲，初中的时候天天听","children":[]},{"text":"竟然没有暗号吗？那么好听的歌。","children":[]},{"text":"老歌迷了必须选东风破","children":[]},{"text":"第一张专辑最好听，黑色幽默","children":[]},{"text":"青花瓷！\n天青色等烟雨，而我在等你，简直太美了","children":[]},{"text":"《不能说的秘密》，没有之一\n最美的不是下雨天，是在雨里躲过雨的屋檐","children":[{"role":"回应者","text":"假粉丝啊你…\n最喜欢的歌词都记错了。"}]},{"text":"第一次听周杰伦是在网吧里放的爱在西元前，当时惊为天人歌还能这样唱的？","children":[]},{"text":"自导自演……\n大家去听一听","children":[{"role":"回应者","text":"这首我也觉得很不错，不过同专辑我还是最喜欢说了再见"}]},{"text":"热门的太多人提过了。来个冷门的，不能说的秘密，最近发现贼好听。","children":[]},{"text":"以前喜欢最长的电影，然后喜欢半岛铁盒，但热恋中的应该喜欢园游会，这个太甜了","children":[]},{"text":"轨迹\n\n晚上下班，走在回家路上，就很喜欢听。","children":[]},{"text":"菊花台\n小学那会儿有了电脑听的第一首歌","children":[]},{"text":"借口。。。和初恋分手那晚在广场上刚好放的这首，，","children":[]},{"text":"印第安老斑鸠，不太喜欢那些情情爱爱的","children":[]},{"text":"学生时代是稻香，现在是以父之名","children":[]},{"text":"怎能少了八段旋律谱春秋，《乱舞春秋》真是神作了，巅峰的周杰伦、方文山、钟兴民全力之作。\n\n但我还是选择入坑曲，《爱在西元前》","children":[]},{"text":"四川人\n最喜欢稻香","children":[]},{"text":"最爱龙拳\n以敦煌为圆心的东北东，这民族的海岸线像一支弓\n太帅了","children":[]},{"text":"献世 写给陈小春的 自己唱很有感觉","children":[]},{"text":"反方向的拱","children":[]},{"text":"东风破  永远的神","children":[]},{"text":"我摊牌了\n《娘子》","children":[]},{"text":"夜曲一响 上台领奖\n\n不过大家都听腻了","children":[]},{"text":"那害得是《七里香》\n小学的校园广播就是周杰伦的歌循环，早上的起床铃响完，第一首就是《七里香》 眼睛还没睁开就能听见“窗外的麻雀”\n晚饭过后到晚自习中间的自由活动时间放的是《外婆》PS：外婆真的很好听，也是属于前奏无敌的那类","children":[]},{"text":"目前嘛…《时光机》\n\n唉…青春","children":[]},{"text":"没有断了的弦吗，听着太有感觉了，我觉得这歌都没有主副歌之分了，每一段都是那种舒服的感觉，前奏也是有魔力，感觉可以听一整天","children":[]},{"text":"稻香\n“童年的纸飞机， 现在终于飞回我手里”","children":[]},{"text":"双刀(还有其他同好吗？虽然我唱不下来)","children":[]},{"text":"这首歌叫做《星晴》","children":[]},{"text":"一句珍重，也有苦衷，也不想送","children":[]},{"text":"《青花瓷》\n\n“天青色等烟雨，而我在等你”这句神来之笔 又古香又好唱.","children":[]},{"text":"消失的旧时光一九四三","children":[]},{"text":"爱在西元前啊 听的第一首 在东风卫视的娱乐在亚洲首播","children":[]},{"text":"只选一首的话那就是 简单爱\n初中时元旦表演第一次听到，非常喜欢。","children":[]},{"text":"太难选了，我先去每张专辑筛选1-2首  \nJay:黑色幽默\n范特西:安静\n八度空间:半岛铁盒\n叶惠美:晴天 以父之名\n七里香:七里香\n十一月的肖邦:夜曲 一路向北\n依然范特西:听妈妈的话\n我很忙:阳光宅男 蒲公英的约定\n魔杰座:稻香\n跨时代:烟花易冷\n惊叹号:无\n十二新作:红尘客栈\n哎呦，不错哦:手写的从前\n床边故事:不该 爱情废柴\n其他:周大侠 霍元甲\n\n然后筛选前三:稻香 夜曲 晴天\n那就《夜曲》吧","children":[]}]},{"title":"2000年后中国最好的音乐人","body":"2000年后中国最好的音乐人是谁？周杰伦、刀郎、汪峰、陶喆、许巍、华晨宇、徐梦圆、孙燕姿，还是其他人？","replies":[{"text":"你可能不知道周杰伦有多强。\n就说 北京奥运独唱  千山万水","children":[{"role":"回应者","text":"然后呢？人成龙也独唱了啊，刘德华也独唱了，周华健也独唱了，这三个还唱了北京欢迎你，是不是更有排面啊"}]},{"text":"汪峰的其实不错","children":[]},{"text":"当然是华语乐坛领军人物花花啦","children":[]},{"text":"虽然汪峰经常闹笑话，不过2000年后的摇滚他确实算半壁江山","children":[]},{"text":"我记得我小时候听凤凰传奇听的很入迷\n朋友跟我争执，she才是唯一的神，五月天才是唯一的神，田馥甄才是唯一的神，李宇春才是唯一的神，张靓颖才是唯一的神，华晨宇才是唯一的神，抖音才是唯一的神…..\n\n我就是喜欢凤凰传奇罢了，五月天我也不讨厌，she我也买过专辑，田馥甄也有几首歌再收藏里，李宇春的演唱会我还陪朋友去过，张靓颖也有我喜欢的旋律。\n\n他们有很多神\n我只是喜欢音乐而已","children":[{"role":"回应者","text":"或者喜欢的是共鸣\n我也一样"}]},{"text":"客观来说，周杰伦的确是00年代独一份的，什么陶王林，在周杰伦的统治力面前都黯然失色\n刀郎+凤凰传奇属于另辟蹊径了","children":[]},{"text":"周杰伦，这个不需要争论","children":[]},{"text":"个人意见陶喆","children":[]},{"text":"音乐圈包含严肃音乐吗？\n\n钢铁洪流进行曲 的作者可以排上名吗？","children":[{"role":"回应者","text":"当然是你的选择啊 \n 当那一天来临 我更喜欢这个"}]},{"text":"我不选周董，02年那会买的周董磁带感觉音乐曲风很新奇，但06年往后就很少听了。\n我觉得这段时间唯一称得上音乐流派的只有民谣，从老狼 矮大紧开始，后来有许巍，朴树。\n要说代表人物，我选许巍，有民谣有摇滚","children":[]},{"text":"一首夜曲拿了多少奖\n\n刀郎你挑一首？\n\n最佳新人奖，最佳金曲奖，刀郎有多少个啊？\n\n截止第30届金曲奖落幕，周杰伦一共拿过15次金曲奖。具体如下：\n\n1、2001? ? 第12届? ? 金曲奖最佳流行音乐演唱专辑奖? ? JAY。\n\n2、2002? ? 第13届? ? 金曲奖最佳专辑制作人奖? ? 范特西。\n\n3、2002? ? 第13届? ? 金曲奖最佳流行音乐演唱专辑奖? ? 范特西。\n\n4、2002? ? 第13届? ? 金曲奖最佳作曲人奖? ? 爱在西元前。\n\n5、2004? ? 第15届? ? 金曲奖最佳流行音乐演唱专辑奖? ? 叶惠美。\n\n6、2007? ? 第18届? ? 金曲奖最佳单曲制作人奖? ? 霍元甲。\n\n7、2008? ? 第19届? ? 金曲奖演奏类最佳作曲人奖? ? 琴房。\n\n8、2008? ? 第19届? ? 金曲奖最佳年度歌曲奖? ? 青花瓷。?\n\n9、2008? ? 第19届? ? 金曲奖最佳作曲人奖? ? 青花瓷。\n\n10、2008? ? 第19届? ? 金曲奖演奏类最佳专辑制作人奖? ? 不能说的秘密电影原声带。\n\n11、2009? ? 第20届? ? 金曲奖最佳年度歌曲奖? ? 稻香。\n\n12、2009? ? 第20届? ? 金曲奖最佳音乐录影带奖? ? 魔术先生。\n\n13、2009? ? 第20届? ? 金曲奖最佳国语男歌手奖。\n\n14、2011? ? 第22届? ? 金曲奖最佳国语专辑奖? ? 跨时代。\n\n15、2011? ? 第22届? ? 金曲奖最佳国语男歌手奖? ? 跨时代。","children":[]},{"text":"刀郎怎么可能比得上周杰伦，周杰伦的受众是雅俗共赏，而刀郎就一直就被批评太俗，不被那些自称雅的人接受。","children":[]},{"text":"刀郎比结巴贡献大，刀郎带出来了云朵","children":[]},{"text":"人民日报还是央视点评？华语乐坛常青树周杰伦","children":[]},{"text":"最好这个没有评判标准，争不出结果的。我只能说我最喜欢的应该是孙燕姿","children":[]},{"text":"要我选我肯定我选凤凰传奇","children":[]},{"text":"你可能不知道那些70 80 90年代的旋律苦情歌大半都是翻唱日本人的歌吧，另外跟你说一下周杰伦的作品是吧古典、爵士、说唱、r\u0026b等非常多的音乐形式融合进华语流行乐的第一人，学了十几年音乐圈鄙视链顶层的古典乐，乐理知识不能说超过只能说吊打基本几十年全流行乐圈的音乐人和歌手。\n随便找个冷门歌，00年发行的娘子，没有用任何中国乐器，音乐形式用了古典和爵士，完美演绎了中国风。建议你去搜一下你心中的80 90年代音乐人里的大牛李宗盛是怎么评价娘子的。\n\n00年之前港台的苦情歌也就那b样了，别不懂装懂啊，做音乐技术才是第一生产力，就这帮翻译官整点[没有乐理知识的大众能听明白的]传唱度高的旋律和填词，配和周杰伦比吗，周杰伦之前有人能做到把原本的“高端音乐形式”普及到普通人也能理解的程度吗","children":[]},{"text":"我选周杰伦\n因为他说过：不要让韩流越来越猖狂.华流才是最吊的","children":[]},{"text":"别人一首歌能红一辈子\n有些歌手你说他就那几首歌\n你说你最喜欢周杰伦哪首歌 那寄吧答案几十楼不重样的","children":[]},{"text":"杰伦，汪峰","children":[]},{"text":"2002年最强的是阿杜力压周杰伦，然后还有she和飞儿乐队。大部分时间都是周杰伦，周董作曲这方面有点无敌。","children":[]},{"text":"如果只讲流行音乐的话，那肯定答案是周杰伦。\n\n2021年，苹果发布的大陆地区播放量前100的歌曲里面，周杰伦有54首。\n\n排名前50的，周杰伦有44首。\n\n前10周杰伦有9首。\n\nQQ音乐好像没有年榜，不过周榜前十，周杰伦经常也是占了一半以上。\n\n我觉得听众已经给出了答案。","children":[]},{"text":"传唱度、知名度\n肯定是周杰伦\n\n好不好的，这种没个标准","children":[]}]},{"title":"原神哪位男角色最斩男？","body":"你觉得《原神》里哪位男角色最斩男？成男、少年都可以，外观、故事、文化背景、同人考据等让他吸引人的点都能聊。","replies":[{"text":"角色人设塑造角度的话男角色里个人会比较偏好带点喜感(或者无厘头)的，比如欧洛伦、菲林斯这样的。","children":[]},{"text":"法尔伽？","children":[{"role":"回应者","text":"怎么个说法，是帅里又带点中二那种性格掰人吗？()"}]},{"text":"成男：莱欧斯利，建模、服设、气质、玩法、剧情都挑不出一点毛病，男同全斩了，直男也对肘拳的角色有点兴趣。少年：班尼特，抛开强度不谈，就我班这个乐观小太阳性格，男同通杀，直男见仁见智，至少四星不会那么招人恨。","children":[]},{"text":"队长，丑角，公鸡，风拳，雷锤","children":[]},{"text":"大团长，看完动画就回坑抽了个1+1","children":[]},{"text":"莱欧斯利，一个男角色没抽的我为了体验莱欧斯利开了个小号抽他。","children":[]},{"text":"法尔伽。双持大剑真的很帅吧骑士团大团长，北风狼骑士，真的很符合我对完美骑士的想象游戏外各种物料也给的很足，虽然强度拉了点但是不管是人设美术背景故事个人都可以打满分，双剑真的很神来之笔惊艳，凡铁之剑，斩魔之锋！","children":[]},{"text":"男同也是男，莱欧斯利班尼特艾尔海森","children":[]},{"text":"老登？队长？钟离依然是房间里的大象","children":[]},{"text":"龙王，只有轮椅加强度都超模的角色，我才可能去抽男的","children":[]},{"text":"钟离万叶，坐标南通","children":[]},{"text":"钟离，队长，团长。少年的话万叶","children":[]},{"text":"有男性魅力和担当的，也就是经典游戏主角类型。队长要出我真all in，莱欧、钟离、凯亚和法小弟也不错","children":[]},{"text":"队长吧，希望在我退坑之前能肘赢复活赛","children":[]},{"text":"法尔加这个传说满足了男生的三个幻想，双持大剑，为国捐躯，以一敌百","children":[]},{"text":"100%队长，钟离就算了，剧情给人的冲击力远不如卡皮塔诺。然后是博士，菲林斯，万叶","children":[]},{"text":"男斩男不是斩男同的话。实力强、稳重可靠、阳光哥们、会来事、低调谦逊。其中要极致就需要光环，首推钟离、卢姥爷。非自机就是队长。","children":[]},{"text":"公子，莱欧斯利，菲林斯，提纳里，早期的魈不分先后。","children":[]},{"text":"队长啊，谁不觉得队长帅，覆面太权威了","children":[]},{"text":"钟离，莱欧，队长，这种算能兜底，做事靠谱，气质上有点年龄感的角色挺让人有好感的，长得也不错，艾尔海森后续没去卖南通的话其实也能算进去。漏了灯哥和团长，这二位也可以","children":[]},{"text":"公子和凯亚，还有渊上，看起来不靠谱，但做起事来专注认真，灵活不死板，生活上不会无聊，工作上可以放心。","children":[]},{"text":"我最喜欢的男角色是白术，白术传说的剧情我真的很喜欢","children":[]},{"text":"强度是最好的催情药，所以是龙王","children":[]},{"text":"最喜欢的男角色是灯哥(主要还是大招太帅了，跟克洛琳德一个级别)","children":[]},{"text":"我是乐子人，我选菲林斯","children":[]}]},{"title":"ACG里有哪些“人生最棒的一天”桥段？","body":"ACG作品里，有哪些桥段能体现“你以为这天是又一个很平常的日子，多年之后才发现，这其实是你人生里最棒的一天。这样的一天永远不会再有了。”的字面意思？不要求主角之后一定吃瘪，悠哉度日、尽兴生活的时光也可以。","replies":[{"text":"无职男主被送去当家教那一天吧，那天也算是男主最后一天父母双全阖家欢乐了"," 纠结点在贝斯和键盘，海铃+大祥和rupa+tomo感觉都不错(","children":[]},{"text":"初华、一里、祥子、律、凉","children":[]},{"text":"波奇 虹夏 mio saki 小孩姐","children":[]},{"text":"nina 波奇 虹夏 大祥 这四个人感觉已经银河战舰了，base就随便来一个富婆soyo吧","children":[]},{"text":"先选波奇祥子基本两个固定位\n\nba感觉没有特别突出的，海铃总归适配性比较好吧实力也足够很稳健的选\n\n鼓的话也是感觉没特别突出的，486虹夏都赢一手交际能力，可以稳定团队关系，立希这种就太压力了\n\n因为波奇固定位所以选虹夏可能更优一点吧不然可能发挥不出来\n\n最后最重要的主唱，nina实力和风格都很硬，性格可能有减分，另外商业化上可能受限\n初华有商业成绩证明，而且吉他水平也ok，相当于赚一个乐器(nina的吉他水平比较初学)，另外会作词作曲，性格也是加分点\n以及祥子固定位那初华有羁绊加分\n\n于是就是 初华祥子 波奇虹夏 双羁绊 外加贝斯海玲也是原配 这样的组合","children":[]},{"text":"只考虑水平选的27 tomo 立希 海玲 波奇，选出来后感觉这队伍怕是持续不了三天得散","children":[]},{"text":"主唱：nina\n吉他：一里\n鼓手：立希\n钢琴：琴吹䌷\n贝斯忘了选，就长期素食吧\n\n琴吹䌷和素世是乐队金主，也能帮忙维护队内氛围\nnina和波奇酱的音乐才能相当高\n立希负责作曲和乐队事务，虽然经常压力人但也是一个照顾人的好手","children":[]},{"text":"主唱nina\n吉他英雄波奇\n贝斯雇佣兵海玲\n鼓手有点难选，没有明显差距的话还是虹夏妈妈吧\n至于键盘，按照中之人来的话肯定是选大祥老师，但是从动画里设定的拿奖来看应该是小智更强一点吧？","children":[]},{"text":"投了个27 波奇 mio 大喵 大祥的\n谁能忍住不投波奇，就像忍住往复仇者联盟里放加菲猫","children":[]},{"text":"丰川祥子伊地知虹夏长期素世三角初华后藤一里\n银 河 战 舰","children":[]},{"text":"nina(节奏吉他版) 、波奇 、凉、486、大祥 银河战舰起飞","children":[]},{"text":"银河战舰：大祥 初华 波奇 海玲 虹夏\n大祥键盘兼职团队经营，初华出道早比小孩专业性强一些，吉他波奇秒了，贝斯传奇雇佣兵，鼓大家水平差不多需要虹夏麻麻拧绳\n\n还有些比较有意思的组合\n灯，波奇，木头，凉，tomo\n最安静的team，前三个无交流，凉事不关己，tomo不主动交流\n\nnina，mmk，soyo，立希，大祥\n最吵的team，每天都在上压力和爆爆爆，soyo是来缓和气氛的真的吗\n\n初华，爱音，mio/rupa，虹夏/486，紬壮壮\n情商组，一定是最和谐的team","children":[]},{"text":"要说吉他水平的话猫猫应该和波奇差不多，但猫猫太随性了对比波奇，一个是现场开爆一个是化身吉他英雄救场(还救了两次)，表现上面还是波奇更强。\n键盘肯定是大祥老师了，白祥能拧绳，黑祥能干事，怎么都不亏。\n主唱上面喜多和nina两个要说的话nina肯定表现更好，喜多的表现更多在吉他方面，除非还要个节奏吉他不然光比主唱还是差了一截的。\n鼓手这个很难选，五个里面三个拧绳一个上压力还有一个纯利益相关，不过看在化学反应上面还是选虹夏更好。\n至于贝斯，那肯定还是雇佣兵的强度最高，素世遇到祥子容易炸团，虽然有虹夏能管住凉但选虹夏是给波奇打辅助的，再去管凉多少有点为难虹夏了，mio嘛，最稳定但强度上还是差了一点。","children":[]},{"text":"我要选一个作曲王乐队：桃香/仁菜/大祥/凉/立希，一天写10首歌不成问题  \n\n有点地狱的补充说明你要问仁菜在这里面是干嘛的，答案是她是提供作曲素材的","children":[]},{"text":"波奇 律队 海玲 tomo 27 嘻嘻我就是要组银河战舰吖","children":[]},{"text":"梓喵 soyo 喵姆 大小姐 27 \n感觉会很有趣","children":[]},{"text":"主唱：井芹仁菜\n吉他：后藤一里\n贝斯：长期素食\n键盘：丰川祥子\n鼓：虹夏妈妈","children":[]},{"text":"Vo.三角初华\nKey.Tomo\nBass.长崎爽世\nGt.虾仁芹菜\nDr. 椎名立希\n\n键盘压力鼓手作编一坨，鼓手大骂吉他弹得一 {"text":"感觉不如JOJO6双标狗神父有压迫感，神父真的把主角团杀到只剩一人还重启了整个世界。","children":[]},{"text":"宿傩到后面真是谁都上去打几拳，想起一个up吐槽猪野靠七海的刀当关系户 在场上蹭了半天kda还啥事没有 ，五条/鹿紫云一:早知道我们也带七海的刀上去打了  \n我觉得宿傩还不如大结局之前的玛奇玛，吉良吉影和动画金闪闪有压迫感 众所周知咒术是搞笑漫画，其他搞笑漫画的反派可能不如宿傩有压迫感","children":[]},{"text":"别说弗利萨了，还不如比克大魔王能，跟鹤仙人55开吧","children":[]},{"text":"同样堆尸战还不如a5札克战咧","children":[{"role":"回应者","text":"a5也强不哪去了，最终BOSS扎克差点让泽度一个路人单刷了要是公平竞技甚至打不过男二零儿"}]},{"text":"宇智波鼬吧","children":[]},{"text":"FGO中的提亚马特和ORT","children":[]},{"text":"感觉不如隔壁老板半夜找残疾人装b","children":[]},{"text":"压迫感其实挺难量化的...\n要不直接跳到纯白女王吧.","children":[]},{"text":"普罗多恶魔在哭啊\n\n你见过几个最终boss是达到目的了爽了不打了自己走了还很合理的","children":[{"role":"回应者","text":"麻仓叶王？"}]},{"text":"还不如那帕有压迫感","children":[]},{"text":"宿傩战先比过隔壁鬼灭之刃的那个被人诟病“又臭又长”的最终战吧，那个好歹是真的能让人觉得悲壮的，正方一个小丑都没有，反派无惨虽然是个low比但是好歹不会小丑到让人发笑","children":[]},{"text":"感觉不如seed克队 边嘴炮边废掉流星自由的武装 最后把自由拼到重残才击杀掉 这还是克队有线粒体过短的debuff 没有这个debuff完爆剧场版那些王国废物","children":[]},{"text":"杀戮都市里的滑头鬼","children":[]},{"text":"弗利萨 沙鲁 布欧 甚至老比克的压迫力都更足把","children":[]},{"text":"黄猿，大熊\n香波地群岛的时候真给我看懵逼了，没想到来一手就地解散","children":[]},{"text":"这宿傩打不死归打不死，但是大把角色都能跑上去秀一个绝活对他造成伤害，这些阿猫阿狗一起上说不定都把宿傩堆死了。真论压迫感应该参考蓝染，主角团实力不够的站他面前的资格都没，遑论更进一步的造成伤害","children":[]},{"text":"我感觉宿傩还没地狱老师的那个宿傩给人的压迫力高，更别说绝鬼和霸鬼两个BUG了，一个靠夺舍鬼的意志来剧情杀，一个靠亲情感化来剧情杀。","children":[]},{"text":"说正经的：\n《死神》乌尔奇奥拉\n《钢炼fa》金·布拉多雷\n《最终幻想7》萨菲罗斯\n《亚尔斯兰战记》蛇王扎哈克","children":[{"role":"回应者","text":"乌4和大总统是真的打的史诗级"}]},{"text":"感觉不够不死不幸里的桑(太阳)一手指头碾的，这黑太阳出场的时候真的是压迫感十足，整个主角团上上下下十几号人豁出命来也就勉强多拖几分钟的时间，好让不幸跑路去下一次轮回重新开始。","children":[]},{"text":"不是说宿傩没有压迫感，但宿傩的压迫感有很大成分来自于你知道他获得了作品外作者的加成，意图如此之明显以至于越看越回避不掉这点\n\n然后作品糟糕的观感以及劣质的画风也拉低了压迫感的体现，所以整体来讲夸宿傩的压迫感会是一件很别扭的事\n\n我印象里比较深刻的反派，一个典型例子当属户愚吕弟\n\n这个例子一度影响了我对其他妖怪类角色的看法“压迫程度不足以手都没动就对围观群众或者环境产生效果？不行啊。”","children":[]},{"text":"虽然很多人都说宿傩是数值怪，但是我还是觉得他是机制怪，伏魔御厨子能做到一定程度的免伤，甚至还有即死空间斩\n而且主角团要一个一个上也是一种机制(只能单刷不能组队)","children":[{"role":"回应者","text":"byd还开了凯撒竞技场是吧"}]},{"text":"宿傩打起来感觉跟我初中小弟拿着我的毕业账号去pk法环怪npc一样，明明设定上能轻松过就是要被怪秀一套连招，与此同时还特别嘴硬“是我状态不好啊”“这个动作没看太清”","children":[]},{"text":"普奇神父\n脸皮厚度令人绝望(物理) 都会激动一下，他真得好帅","children":[]},{"text":"一开始没有xp的概念，觉得大家都是电子手办而已……后来地底岩层的剧情出来，xp直接变成魈的样子，155抽强娶回家……\n之后陆续觉得小心海好可爱，小可莉好可爱，小温迪好可爱……","children":[]},{"text":"纯看XP的话，我是丽莎阿姨的狗她叫我小可爱，她心里有我，黑丝大胸熟女，这谁能顶得住？\n新皮肤太诱人了大白腿，嘿嘿。\n喜欢的蛮多的，一一举例的话不如塞个图鉴了，但鉴于其他XP强度蛮高的，也就丽莎现在强度低吧，不过平时大世界打打激化也还不错","children":[]},{"text":"大概是全五星火c系角色吧。\n开服用迪卢克e剑三连，暗夜英雄正义人。\n之后是胡桃蝶火燎原，嗷嗷嗷嗷嗷嗷。\n然后是宵宫，外向开朗放烟花，(暂时的)最大火c。\n第二次复刻才拿到可莉，蒙德团宠，夏日海岛的快乐小魔女。\n最后是沙漠佣兵一姐，炽鬃之狮，须弥希望工程代言人、赞助者，教令院贤者候选，代理大风纪官(风华节限定)，沟通沙漠与绿洲的联络人，时尚女性，资深彩妆爱好者迪希雅","children":[]},{"text":"唯一单推是绫人，我是神里绫人的狗，要绫人天天抱着我。(叉腰)\n喜欢所有水系的角色，好感大部分男角色。\n女角色：归终是我的白月光！\n其他的话：宵宫，莱依拉，坎蒂丝，心海，芭芭拉瑶瑶等。\n男角色：我是神里绫人的狗。(为此我能接受一切他的一切毒点，不能先手上水，没有角色适配他的短轴，大招80，至今没有水九条)虽然一直都在被狠狠pua，但是绿剑波乱雾切都满精。我花了一年时间接受了绫人的强度，倒也不是弱，毕竟是强度的最大公约数，平平淡淡才是真的感觉。\n其他的话，目前实装的有挺多，托马，魈，温迪，阿贝多等。","children":[]},{"text":"喜欢的很多，挨个说一下\n\n蒙德\n安柏：最初的伙伴，火红色的小天使\n\n丽莎：永远喜欢这样又会撩我，又睿智又强大，跟她在一起除了躺平被调戏之外就是无比轻松惬意的大姐姐\n\n温迪：自由之神，剧情满分，蒙德主线结束后对旅行者说的那段永远不要忘了旅途最初的含义满分\n\n琴：有能力有毅力又甘于奉献的完美团长，蒙德大家庭的慈母兼严母\n\n迪卢克：正义人，暗夜英雄，哪个设定都非常带感\n\n菲谢尔：永远喜欢热爱幻想的少年少女，皇女海岛漂流记！——二次元的味道就这么来了。以想象力得到神之眼和伙伴的感觉特别棒\n\n班尼特：可爱，健气，永不服输，最倒霉的人拿到了最强力的模组\n\n大团长法尔加：光靠文案和寄回来的信就让人喜欢上的一个角色，豪爽，善良，幽默，大将之风，英雄豪气又包容宽和\n\n璃月\n北斗：气场十足，豪迈仗义，重视朋友，很值得依靠的大姐头\n\n刻晴：“我很赏识你，不笃信，不盲从，有质疑就说，有想法就做，随时保持独立思考，有问题就问出来，没有答案就一直追寻下去。毕竟没有人能够保证自己是绝对正确的”——基于同样的原因我也很赏识你，刻师傅。另外真的很好看\n\n烟绯：智性恋无法拒绝，精致而善良的年轻小白领，人治的璃月党需要这样讲道理，通过辩论和文字维持正义与秩序的人\n\n瑶瑶：懂事又可爱，小天使，萝卜和兔子的元素很喜欢\n\n萍姥姥：真正看穿一切的智者，睿智又通透，年轻时候还很好看，给我们做了尘歌壶，几乎完美的奶奶\n\n申鹤：对主角真的很好，而且很爱吃面。恩，我也爱吃\n\n稻妻\n八重神子：很屑很可爱，又有魅力又有张力。被调教的很舒服，也很喜欢和她共事的感觉\n\n荒泷一斗：可爱的大男孩，好兄弟，个人传说任务和层岩巨渊里的剧情表现都拉满\n\n久岐忍：能文能武能做饭，什么都懂，而且善于照顾人，太喜欢这种会照顾又靠谱的人了\n\n托马：潇洒可爱，智商情商超高。火锅游戏很可爱\n\n宵宫：夏日祭的女王，英雄状态的宵宫姐姐。非常动人，小时候没遇到姐姐这样的朋友，长大了就请姐姐带我走吧\n\n须弥\n坎蒂丝：强大而温柔，出手又极富力道，真喜欢这样的姐姐。对冒犯者的惩罚刑罚也十分戳人xp\n\n拉娜：展开森林书的天使，热情善良，从维摩庄开始展开了一幅葱翠自然的画卷","children":[]},{"text":"砂糖，她真的就是单纯的可爱，一直都是红着脸蛋凯亚，罗莎，很喜欢一些蒙德冰系酒友组，就是有那种成年人的苦涩味道在里面的感觉，有时候一看他两就觉得痛，剧情还延续那份重担，远远没有达成美好结局啊，都是心里藏着事没法坦诚相待的那种行秋，我一直觉得二少爷有点中二臭屁hhhh很喜欢这种侠义少爷的人设北斗，单纯的就是被邀约任务给迷住了，怎么会有北斗姐这样的大姐头罩着我啊，也是有着悲惨童年的人啊(好家伙，你游四星真的文案一个比一个好，细品下来都好喜欢)","children":[]},{"text":"断层xp达达利亚，迫近的客星就一见钟情，但是当时原神和鸭鸭节奏都太多就一直没入坑，直到须弥版本朋友拉我玩，也是为了他才决定入坑，刚好赶上复刻，抽到之后发现中配英配都太好听了，不管是外表还是内在都很有魅力他是我玩下去的最大动力，每天都带着鸭鸭环游提瓦特。\n然后是万叶，没入坑只看立绘就非常喜欢的第二个角色，入了坑才发现他跟鸭鸭是好队友，温柔强大，稻妻剧情真的太高光了，接无想的一刀的时候实在是太帅了当时的感觉只有震撼和感动，他和友人的故事把我看哭了\n还有提纳里，小提有种平易近人的温柔，靠谱又亲切，虽然会吐槽你但是也会帮助你，而且他的耳朵和尾巴看起来真的好好摸！！！","children":[]}]},{"title":"手操轮回系主角，哪部作品速通最容易？","body":"轮回系作品玩法很多：PVP类如《夏日重现》，PVE类如《Muv-Luv》，肉鸽类如《旧寒蝉》，解密类如《石头门》，魂类如《魔圆》。如果手操主角，相当于开局拥有全部必要情报，哪部作品的副本速通难度最低？《重启咲良田》《不灭钻石》《复活的鲁路修》这类超能力战斗系不算轮回系。","replies":[{"text":"理论上解谜类的石头门是不是最简单的","children":[{"role":"回应者","text":"游戏手操我能行，你让我跳上千次时间穿越我肯定不行"}]},{"text":"人狼村之谜？\n毕竟原作就是速通，直接背诵三周目全文可破，唯一问题是小千不会帮我","children":[{"role":"回应者","text":"人狼不可能速通的。你三周目能速通需要干净利落地解决疯老头，以及登山各种体力活。你第一次重生的话没经历过成百上千次loop，面对杀人不可能那么冷静的。大概率被疯老头反杀"}]},{"text":"最简单的是小圆，当然，只限本篇","children":[]},{"text":"黑暗塔，直接一枪崩了自己，而且这是唯一的破局方法","children":[{"role":"回应者","text":"这方法没用吧！这么多次轮回里面没准哪一次被梅林用幻术让罗兰再次看母亲的事，罗兰一个冲动给自尽了，也最多让罗兰又回到枪侠同伴死光，独自一个人寻找黑暗塔的路上\n罗兰没有号角，是没法通关黑暗塔的！"},{"role":"作者","text":"所以要在成为枪侠之前自杀啊，一旦绿色世界被毁，卡就开始转动了，这样做什么都没用了，说到底我觉得号角根本没意义，只要罗兰开始找黑衣人就等于他又要开始轮回了，每卷小说的故事本身就可能发生在不同的轮回里，就靠一个号角怎么可能斗得过黑暗塔啊"}]},{"text":"凉宫，第一周目就开学习会赶作业","children":[]},{"text":"海猫？直接毙了元寿和八十八直接通关","children":[{"role":"回应者","text":"通不了关的，都是伪书"}]},{"text":"那还是海景房，因为你只要说服一个人就能结束轮回了。","children":[]},{"text":"手操香蕉，我直接许愿无法预测的命运舞台","children":[{"role":"回应者","text":"那你的闪耀能贯穿首席和克洛吗"},{"role":"作者","text":"被打爆了！"}]},{"text":"星际拓荒吧，毕竟这是真的一开始就可以速通的","children":[{"role":"回应者","text":"星际拓荒的话，全情报玩家不知道来不来得及先过DLC(反正全情报能活着通关)再通本篇结局"}]},{"text":"开端\n陪我妈看完了我的评价是让我上我最多死三次，甚至不用上帝视角","children":[{"role":"回应者","text":"错，开端的问题是带着全车人活下来没法通关，一觉醒来又回到车上了你必须得把公交车司机和脑瘫锅姨的心结解开"}]},{"text":"re0，直接去找莱茵哈鲁特，完。","children":[]},{"text":"肯定是9-nine啊，只要死得够多就行","children":[{"role":"回应者","text":"9nine问题是你暴露太多会被敌人发现不对劲然后敌人也能搞出轮回和攻击本体"}]},{"text":"夏日重现很容易he，开局攒小舟军团就能平推\n但是要连着波稻转生一起救的pe还是有点难","children":[]},{"text":"在全情报的前提下，最简单的我觉得是3days\n原作要求你经过大量的be集齐必要的信息，才可以让主角想起前世，明白自己为什么可以轮回进而破局，这要是开局就知道了的话直接通了","children":[]},{"text":"轮回系主角？\nszb亚里莎或 性格","children":[]},{"text":"我的话，是奇蛋。像那种大场面，网管巨人，虽然也不错但是真看得太多。","children":[]},{"text":"巨人第一集真的是各种意义上的满分开局……\n能在短短一集直接把人的情绪激发到最高潮\n可惜了。。真的可惜了……\n尤其是大结局让第一集最震撼的一幕当场变成笑话……","children":[]},{"text":"其实我觉得5ds第一集真的非常牛逼，影视剧般的成熟气息。\n\n后面是很精彩但是没第一集内味了。","children":[]},{"text":"星际牛仔的第一集。\n一定要说是最优秀可能也谈不上。不过作为单元剧，第一集就是一个完整且优秀的故事，再加上时髦的人设和超强的制作，一下子就很有让我看下去的欲望。\n话说我一度以为那个拉丁裔大姐姐是女主，结果。。。","children":[]},{"text":"火影忍者第一集，不管是完成度还是情感调动都很出色，十几年后的今天再看依旧很好看","children":[]},{"text":"痞子认为自己永远都无法超越的0079第一集最后六分钟","children":[]},{"text":"FSN吧，阿尔托莉雅被召唤出来的月球名画刻入DNA了属于是，\n\n不讲作画，特效什么的，就是铭记于心的那种，","children":[]},{"text":"虽然是个单元剧，但是我提名《虫师》，这光，这树一个完整但带有小遗憾的GE故事","children":[]},{"text":"回转企鹅罐，结尾生存战略接哥哥独白接亲妹妹","children":[]},{"text":"我觉得《phantom》和《黑礁》这种第一集也很吸引人，描述原本是普通人，被卷入异常事件之后展现出惊人天赋的这个过程非常带感。","children":[]},{"text":"最强不知道，最会整活到可以提两个凉宫春日06版，阿松第一季","children":[]},{"text":"企鹅罐，开头5分钟就怒涛展开，结尾是只要看过就很难忘记的生存战略","children":[]},{"text":"我自己的最强第一集是AIR，《夏影》和《鸟之诗》刻进灵魂里了。","children":[]},{"text":"不吉波普不笑，第一集氛围营造的很好，给人一种看下去的欲望","children":[]},{"text":"目前看过的，能想起来的那必然是我大网管，准确说是前几分钟","children":[]},{"text":"公主代理人的第一集，轻科幻的蒸汽朋克风感觉是真不错","children":[]},{"text":"异度侵入的第一集挺不错的，时光代理人的第一集头开的也不错","children":[]},{"text":"印象最深的是马三角，当时第一集是提前半年播的，配合魔性洗脑曲钓足了胃口。前几集节奏也不错，可惜中后期一拉到底。","children":[]},{"text":"巨人第一集确实很强，我直接被艾伦气到脑溢血没看了","children":[]},{"text":"境界上的地平线，通过第一集的竞赛将各个角色的特点都表现了出来，在我看来是人物介绍的典范","children":[]},{"text":"说个不一定强，但绝对印象深刻的，佐贺一期第一话","children":[]},{"text":"未闻花名第一集其实也很不错，完成度很高，以至于之后的故事看着反而像是狗尾续貂。\n不过我个人觉得最强的还是凉宫06。","children":[]},{"text":"megalobox2的第一集，失意拳手靠着劣质药物苟活于世、浑浑噩噩突然被酋长点醒。\n一集里面前后两次放弃嗑药而扔药的镜头太赞了！","children":[]},{"text":"铁血孤儿第一集，巴巴托斯一枪砸对面脑壳配合那个音乐，整个人都飞起来了","children":[]},{"text":"害得是轻羽飞扬，落差太大以至于记忆犹新，当时看到第4集感觉不对赶紧润了","children":[]},{"text":"少歌和奇蛋\n我永远喜欢奇幻风神展开","children":[]},{"text":"独角兽高达第一集\n重力战线第一集\n鬼知道当年循环了多少遍","children":[]},{"text":"高达00第二季第一级 \n\n舱门 丨红色丨舱门\n舱门丨      眼睛   丨舱门\n       舱门丨    高达          丨舱门\n   舱门   丨    能天使            丨舱门\n   舱门  丨刹那 沙慈  丨  舱门","children":[]},{"text":"一拳超人第一集，无敌的tv打戏"," "考虑到高达的原点是反战片，很难不选安魂曲和0083\n其他东西更多的是看个人主观审美。","children":[]},{"text":"第一档：铁血、安魂曲，我不知道制作组在想什么我只想它们全部去死\n第二档：0083、g一串，虽然不是没有可取之处但自我感动自作多情的异味过重\n第三档：水魔、age、创形者：心比天高命比纸薄你他妈到底在拍什么我根本看不懂\nG复国开除，毕竟有剧场版挽尊","children":[{"role":"回应者","text":"age最大的问题还是51集拍3代人有点紧凑了，分成3季会好很多。其实age只有孙子篇拍的问题比较大。"},{"role":"作者","text":"所以是心比天高命比纸薄，不过增加篇幅能不能好我还是持怀疑态度"}]},{"text":"那我觉得复仇的安魂曲一骑绝尘了，这个是真的思想出了问题","children":[]},{"text":"安魂曲、0083，剩下一个好难选","children":[]},{"text":"G复国也就冷门，真不拉好吗，甚至还有不少作画巅峰集\n\n0083跟安魂曲这俩可以直接拖出去了","children":[]},{"text":"天呐，大伙都忘记创形者是什么贵物了吗？当年也是口碑爆破啊，也得亏再起神了一出，不然胶达系列也得暴毙了\n\n所以三个明显是安魂曲(该除籍的东西)，铁血(给高达tv干挺了)，创形(差点给胶达tv也干挺了)","children":[]},{"text":"无论其他作品再烂，83和安魂曲都得是第一批死刑犯\n思想错误，全部错误，甚至可以说演出越好带来的负面效果越大","children":[]},{"text":"谁没选复仇的安魂曲的？抓出来","children":[]},{"text":"难道不是MS IGLOO、0083和安魂曲？别的都什么臭鱼烂虾","children":[]},{"text":"选一个就0083吧，拿顶级作画炖屎，唯一一个看完了剧情让人感觉恶心的。\n\n关键是我还特喜欢0083的机设和阿尔比昂","children":[]},{"text":"没选复仇安魂曲的一律发配到side去吸g3","children":[]},{"text":"直接83安魂曲铁血","children":[]},{"text":"0083和安魂曲啊","children":[]},{"text":"太简单了吧，安魂曲先死，然后恶意铁血，然后特林顿83","children":[]},{"text":"暴言一句说烂片提种自不提种命的要么是20年没看种命忘了剧情要么是鸡厨或者腐粉 虽然种命并非一无是处也不至于究极烂，但是真的又臭又长又不停引战结局塞张面皮就算饺子了，种自主要任务就是给种命擦屁股把这饺子包完好吧","children":[]},{"text":"有安魂曲选安魂曲\n接下来有83选83\n接下来有铁血选铁血","children":[]},{"text":"说实话看完铁血之后很长一段时间我都不想碰高达相关的东西","children":[]},{"text":"铁血\u003e网飞\u003e创刑=0083=age第三部\u003e水魔\u003egqx","children":[]},{"text":"思想上就出了大问题的0083和安魂曲一档\n\n对观众输出纯粹恶意的铁血第二档","children":[]},{"text":"安魂曲毫无疑问名列榜首；希望之花第一季结尾就有崩的趋势，没想到第二季能够一落千丈；水星魔女属于第零话高开，中间拍番茄小爆，然后结局讲了个无趣的故事；Gqx虽然叙事逻辑需要NT脑补、主角人物塑造缺善可陈，但是每集爆点够多、乐子不缺，最后结局也算是UC难得的希望线，至少算是还可以吃的饺子，就是那碟醋有点太大了\n\n0083完全是被剧情拖累了机设、音乐、作画，GP系列和灰色幽灵的机设真的很优秀，另一部分原因可能是因为作品比较久远，热度没有新世代的高选的人才少了，08MS和0080还会重温，83还是把它忘到角落里吧","children":[]},{"text":"铁血再差也只停留在剧情里面，网飞这辣鸡已经是现实世界的糟粕了，恶心程度高出一个维度","children":[]}]},{"title":"你听过最离谱的语音空耳是什么？","body":"你听过最离谱的语音空耳是什么？","replies":[{"text":"肠腔磨亮辣！","children":[]},{"text":"你有步惊云吗? 很乖巧很可爱哦!","children":[]},{"text":"斩尽牛杂","children":[]},{"text":"祝大家在新的一年里","children":[{"rol :[]},{"text":"爱音就是完美女友的标杆，品味土点还刷短视频怎么了，我都可以改名anon tokyo\n精神稳定性格好不麻烦的还有海玲，虽然有那么点像男友但让酷姐娇羞正是这类型的醍醐味\n初华总觉得有点重，盯着短信看一年什么的，压力有点大","children":[]},{"text":"立希适合的原因: 如果她认可你作为对象, 那说明她的自卑感会觉得你一定比她优秀, 在此基础上她反而会温柔卑微为主导. 温柔立希, 那必然是版本T0的娇软受妹了!","children":[]},{"text":"从这个角度看，感觉睦还挺合适的，两个不爱说话的人看着窗外的风景安静贴贴","children":[]},{"text":"为什么爱音那么多\n爱音作为闺蜜是极好的，但是作为女朋友现充浓度就太高了，一定会三天两头拉着我去看电影逛街拍照发九宫格朋友圈吧\n相比来说我选初华，起码现在表现的善解人意性格稳定\n猫猫如果认为我很有趣不嫌弃我的话也很好啊，她自己也是个有趣的女人，光是看着她吃芭菲就很幸福了","children":[]},{"text":"无论是谈恋爱还是过日子角度，爱音初华海铃这三位都是遥遥领先。情绪稳定、性格优良、沟通能力好，有这三项加持哪怕相性再差的人也能相处得不错。  \n\n剩下的人里喵梦、素世和立希算是还行的水平，虽然性格都有点问题但是大方向OK。\n\n再其他的，灯、乐奈、祥子和睦有一说一全是重量级，现实里别说谈恋爱，朋友可能都没法做。","children":[]},{"text":"虽然爱音情商超高，但我觉得是她是希望另一半多花时间陪她出去玩的类型，再怎么愿意迁就长期相处还是容易出矛盾，作为宅家型我只能pass。合适的自然是能一起宅的立希和soyo，还有看起来不太需要陪的海铃。jk那点儿压力和重力对社会人来说真的太好处理了。","children":[]},{"text":"首先爱音，其次爱音，最后爱音(\n虽然我是个宅宅，但深入思考后想明白了自己只是没有人陪伴\n\n作为一个被动型，如果没人领着就选择待机模式宅在家里，\n\n如果是一个同样需要陪伴，但要求我主动花心思精力去相处的女性，我肯定是吃不消的，\n但同爱音相处，我只需要成为一个全肯定bot就行了\n\n坦诚，情绪稳定，能够互相包容尊重对方的爱好\n\n伟大的性格无需多言，一些小心思小心机更是能成为交往中的调剂品，\n跟爱音交往一定会很开心的吧，这么好的女孩上哪去找\n本来还想选海玲的，但想想海玲还是当男友比较好，\n还是从陪伴的角度选了soyo","children":[]},{"text":"一选先天小女友圣体的圣爱音，伟大无需多言。二选最能一起过日子的祥子，俗话说贫穷是爱情最好的试金石，大祥老师既然能对苦索欧亚寄都不离不弃，以后你只要不是在摆烂你们都一定能坚持下去的！","children":[]},{"text":"想和大祥老师相识相知白头偕老度过幸福的一生\n\n然后出轨soyo让她们再打起来","children":[{"role":"回应者","text":"打的应该是你"}]},{"text":"只能说只有爱音一个选项吧。\n喜欢她的温柔和坚强，也喜欢她的逃避和彷徨；\n喜欢她的体贴和善良，也喜欢她的虚荣和小肚鸡肠。\n她就像是一个真实的人，仿佛你能真的在大街上看到一个高高兴兴露着虎牙和朋友聊天的活力女生。当她走至街道拐角，不见踪影，而你这个阿宅还在为看不见她而难受时，她竟然回眸一瞥，看到了你。\n我就是那个阿宅，我想我已经爱上千早爱音了。\n(所以什么时候国家分配一个？)","children":[]},{"text":"也就是说，对方的好感度也是恋慕？\n\n那选项就比较多了其实\n\n比如虽然立希给人留下了压力的印象，但如果她对你恋慕的话……或许你可以体验她对灯的态度，这很好，不如说这太好了","children":[]},{"text":"最想要小睦头这样的盆栽型女友。清静省事，岁月安好。","children":[]},{"text":"我不选爱音的原因是，没法确定自己会成为对方的高松灯还是初中同学。\n\n我害怕交付的真心没有回应，也是基于以心换心这个角度，选了素世和灯。","children":[]},{"text":"爱音自不必说，典型“带出去有面子的女朋友”，阳光积极好沟通。\n\n选素世，人际关系简单，她有了你意味着整个世界都是你，又不黏人。\n有事憋得心里，憋不出会爆发的人，在外人面前能给你面子，关起门的吵架的人，很典型的传统女性。\n\n立希攻略后肯定是事事向着你，但攻略前的压力怪遭不住。\n\n木头人，两个人对电波吗？\n\n灯的魅魔体质，她想谈，男女通吃，轮不到我。\n\n海铃，天天跑乐队，破事多，锻
